function presetToDraftGroup(preset){
  return { _key:newKey(), name:preset.name, selectType:preset.selectType, required:preset.required, maxSelect:preset.maxSelect,
    options: preset.options.map(o => ({ _key:newKey(), emoji:o.emoji, name:o.name, price:o.price, available:true })) };
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),1900);
}
function money(n){ return Number(n||0).toLocaleString('th-TH') + ' บาท'; }

/* ============ USERNAME -> รหัสอีเมลภายใน (ผู้ใช้ไม่ต้องมีอีเมลจริง) ============ */
function usernameToEmail(username) {
  const norm = username.trim().toLowerCase();
  let hash = 5381;
  for (let i = 0; i < norm.length; i++) { hash = ((hash << 5) + hash + norm.charCodeAt(i)) >>> 0; }
  const slug = norm.replace(/[^a-z0-9]/g, '').slice(0, 20) || 'u';
  // หมายเหตุ: เดิมใช้โดเมน "merchants.imduan.internal" แต่ .internal เป็น TLD ที่สงวนไว้
  // (reserved TLD ตาม RFC 6761 เหมือน .local/.test/.invalid) ทำให้ Supabase Auth ปฏิเสธ
  // อีเมลนี้เวลาต้องส่งอีเมลจริง เช่น "Send password recovery" (error: "Email address ... is invalid")
  // เปลี่ยนมาใช้โดเมนที่ไม่ถูกสงวนแทน เพื่อให้ signUp/signIn/reset password ทำงานได้ปกติ
  return `${slug}${hash.toString(36)}@merchants.imduan-app.com`;
}

/* ============ AUTH / INIT ============ */
async function init(){
  if (!supabaseClient) { state.view = 'needs-config'; render(); return; }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { state.view = 'auth'; state.authMode = 'login'; render(); return; }
  state.user = session.user;
  await afterLogin();
}
async function afterLogin(){
  try {
    const { data, error } = await supabaseClient.from('restaurants').select('*').eq('owner_id', state.user.id).maybeSingle();
    if (error) throw error;
    if (!data) { state.view = 'setup-profile'; render(); return; }
    state.restaurant = data; state.restaurantId = data.id;
    if (data.status === 'pending') { state.view = 'pending'; render(); return; }
    if (data.status === 'suspended') { state.view = 'suspended'; render(); return; }
    await Promise.all([refreshOrders(), refreshMenu(), refreshStats()]);
    state.view = 'dashboard'; render();
    keepScreenOn();
    subscribeOrders();
    ensureNotificationPermission();
  } catch (err) { console.error(err); showToast('โหลดข้อมูลไม่สำเร็จ'); }
}
function normalizePromptpay(v){ return String(v||'').replace(/\D/g,''); }
function isValidPromptpay(id){ return id.length === 10 || id.length === 13 || id.length === 15; }
function updatePromptpayPreview(){
  const box = document.getElementById('pp-preview'), img = document.getElementById('pp-preview-img');
  const id = normalizePromptpay(document.getElementById('sp-promptpay').value);
  if (!box || !img) return;
  if (isValidPromptpay(id)) { img.src = `https://promptpay.io/${id}.png`; box.style.display = 'block'; }
  else box.style.display = 'none';
}
function readShopForm(){
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const f = {
    nameTh: v('sp-name'), nameEn: v('sp-name-en'), category: v('sp-cat'), phone: v('sp-phone'), address: v('sp-address'),
    lat: v('sp-lat'), lng: v('sp-lng'), ownerFirst: v('sp-owner-first'), ownerLast: v('sp-owner-last'),
    ownerPhone: v('sp-owner-phone'), ownerNid: v('sp-owner-nid'), promptpay: normalizePromptpay(v('sp-promptpay')),
    storefrontFile: document.getElementById('sp-storefront').files[0],
    idCardFile: document.getElementById('sp-owner-idcard').files[0],
  };
  let err = null;
  if (!f.nameTh) err = 'กรอกชื่อร้าน (ภาษาไทย)';
  else if (!f.category) err = 'เลือกประเภทร้านค้า';
  else if (!f.phone) err = 'กรอกเบอร์โทรร้านค้า';
  else if (!f.ownerFirst || !f.ownerLast) err = 'กรอกชื่อ-นามสกุลเจ้าของร้าน';
  else if (!/^\d{13}$/.test(f.ownerNid)) err = 'เลขบัตรประชาชนต้องเป็นตัวเลข 13 หลัก';
  else if (!f.idCardFile) err = 'กรุณาแนบรูปบัตรประชาชนเจ้าของร้าน';
  else if (f.promptpay && !isValidPromptpay(f.promptpay)) err = 'หมายเลขพร้อมเพย์ต้องเป็นเบอร์มือถือ 10 หลัก หรือเลขบัตรประชาชน 13 หลัก';
  return { f, err };
}
async function saveShopProfile(f){
  const catInfo = CATEGORY_OPTIONS.find(c => c.id === f.category);
  let storefrontUrl = null;
  if (f.storefrontFile) storefrontUrl = await uploadPublicFile('storefront-images', state.user.id, f.storefrontFile);
  const idCardPath = await uploadPrivateFile(state.user.id, f.idCardFile);
  const { error } = await supabaseClient.from('restaurants').insert({
    name: f.nameTh, name_en: f.nameEn || null, category: f.category, tags: catInfo ? catInfo.label : '',
    phone: f.phone, address: f.address, lat: f.lat ? Number(f.lat) : null, lng: f.lng ? Number(f.lng) : null,
    storefront_url: storefrontUrl,
    owner_first_name: f.ownerFirst, owner_last_name: f.ownerLast, owner_phone: f.ownerPhone,
    owner_national_id: f.ownerNid, owner_id_card_path: idCardPath,
    promptpay_id: f.promptpay || null,
    promptpay_name: `${f.ownerFirst} ${f.ownerLast}`.trim() || null,
    owner_id: state.user.id, status: 'pending',
  });
  if (error) throw error;
}
function setSubmitBtn(busy, text){
  const btn = document.getElementById('sp-submit-btn');
  if (btn) { btn.disabled = busy; btn.textContent = text; }
}
async function doSignup(){
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!username || !password) { showToast('กรอกไอดีและรหัสผ่าน'); return; }
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { showToast('ไอดีต้องเป็นภาษาอังกฤษ a-z, ตัวเลข 0-9 หรือ _ เท่านั้น (3-20 ตัวอักษร)'); return; }
  if (password.length < 6) { showToast('รหัสผ่านอย่างน้อย 6 ตัวอักษร'); return; }
  const { f, err } = readShopForm();
  if (err) { showToast(err); return; }
  setSubmitBtn(true, 'กำลังสมัคร...');
  try {
    const { data, error } = await supabaseClient.auth.signUp({ email: usernameToEmail(username), password });
    if (error) throw error;
    if (!data.session) { showToast('สมัครไม่สำเร็จ: ต้องปิด "Confirm email" ใน Supabase ก่อน'); setSubmitBtn(false, 'บันทึกและส่งขออนุมัติ'); return; }
    state.user = data.user;
    await saveShopProfile(f);
    showToast('สมัครสำเร็จ! กำลังรอแอดมินอนุมัติ');
    await afterLogin();

async function uploadPublicFile(bucket, pathPrefix, file){

  const { error } = await supabaseClient.storage.from(bucket).upload(path, file);

/* ============ แจ้งเตือนงานใหม่ (เสียง + Notification เบราว์เซอร์) ============ */
let sharedAudioCtx = null;
function playAlertSound(){
  try {
    if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
    const ctx = sharedAudioCtx;
    const now = ctx.currentTime;
    [0, 0.18, 0.36].forEach((t) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + t);
      gain.gain.exponentialRampToValueAtTime(0.35, now + t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + t); osc.stop(now + t + 0.16);
    });
  } catch (e) { console.warn('เล่นเสียงไม่ได้', e); }
}
function ensureNotificationPermission(){
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') Notification.requestPermission();
}
function showBrowserNotification(title, body){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body }); } catch (e) { console.warn(e); }
}

function subscribeOrders(){
  if (!supabaseClient || ordersChannel) return;
  console.log('[realtime] subscribing to merchant_orders_' + state.restaurantId, 'restaurantId =', state.restaurantId);
  ordersChannel = supabaseClient
    .channel('merchant_orders_' + state.restaurantId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders', filter: `restaurant_id=eq.${state.restaurantId}` }, async (payload) => {
      console.log('[realtime] INSERT payload received:', payload);
      // ร้านทั่วไป (ไม่ได้ส่งเอง) ยังไม่ต้องแจ้งตอนนี้ เพราะรอไรเดอร์รับงานก่อนถึงจะเริ่มปรุง
      if (payload.new.is_self_delivery) {
        playAlertSound();
        showBrowserNotification('🔔 มีออเดอร์ใหม่เข้ามา!', `ออเดอร์ #${payload.new.order_code || ''} รอการยืนยัน`);
        showToast('🔔 มีออเดอร์ใหม่เข้ามา!');
      }
      await refreshOrders(); softRender();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `restaurant_id=eq.${state.restaurantId}` }, async (payload) => {
      console.log('[realtime] UPDATE payload received:', payload);
      // ไรเดอร์เพิ่งรับงาน (pending -> preparing) คือสัญญาณให้ครัวเริ่มทำอาหาร แจ้งเตือนตอนนี้แทน
      if (payload.new.status === 'preparing' && payload.old && payload.old.status === 'pending' && !payload.new.is_self_delivery) {
        playAlertSound();
        showBrowserNotification('👨‍🍳 มีไรเดอร์รับงานแล้ว!', `เริ่มปรุงออเดอร์ #${payload.new.order_code || ''} ได้เลย`);
        showToast('👨‍🍳 ไรเดอร์รับงานแล้ว เริ่มปรุงได้เลย!');
      }
      await refreshOrders(); softRender();
    })
    .subscribe((status, err) => {
      console.log('[realtime] subscription status:', status, err || '');
      if (status === 'SUBSCRIBED') setConn('ok');
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        setConn('off');
        console.warn('[realtime] subscribe ไม่สำเร็จ:', status, err);
      }
    });
}

function syncDraftFromDom(){

  const groupEl0 = document.getElementById('mi-group');
  const priceEl0 = document.getElementById('mi-price');
  const emojiEl0 = document.getElementById('mi-emoji');
  const descEl0 = document.getElementById('mi-desc');
  if (nameEl0) draftBaseFields.name = nameEl0.value;
  if (groupEl0) draftBaseFields.group = groupEl0.value;
  if (priceEl0) draftBaseFields.price = priceEl0.value;
  if (emojiEl0) draftBaseFields.emoji = emojiEl0.value;
  if (descEl0) draftBaseFields.desc = descEl0.value;
  draftOptionGroups.forEach(g => {
    const nameEl = document.getElementById('og-name-'+g._key);
    if (nameEl) g.name = nameEl.value;
    const maxEl = document.getElementById('og-max-'+g._key);
    if (maxEl) g.maxSelect = Math.max(1, Number(maxEl.value)||1);
    g.options.forEach(o => {

async function toggleMenuItem(id, current){

    await refreshMenu(); render();
  } catch (err) { console.error(err); showToast('อัปเดตเมนูไม่สำเร็จ'); render(); }
}
async function saveOptionGroupsForItem(itemId){
  // ลบกลุ่มตัวเลือกเดิมทั้งหมดของเมนูนี้ (cascade ลบตัวเลือกย่อยไปด้วย) แล้วบันทึกชุดใหม่ทั้งหมดแทน
  const { error: delErr } = await supabaseClient.from('menu_item_option_groups').delete().eq('menu_item_id', itemId);
  if (delErr) throw delErr;
  for (let gi = 0; gi < draftOptionGroups.length; gi++){
    const g = draftOptionGroups[gi];
    if (!g.name || !g.name.trim()) continue;
    const validOptions = g.options.filter(o => o.name && o.name.trim());
    if (validOptions.length === 0) continue;
    const { data: gRow, error: gErr } = await supabaseClient.from('menu_item_option_groups').insert({
      menu_item_id: itemId, name: g.name.trim(), select_type: g.selectType, required: !!g.required,
      max_select: g.selectType === 'multi' ? Math.max(1, Number(g.maxSelect)||1) : 1, sort_order: gi,
    }).select().single();
    if (gErr) throw gErr;
    const optionsPayload = validOptions.map((o, oi) => ({
      group_id: gRow.id, emoji: o.emoji || null, name: o.name.trim(), price_delta: Number(o.price)||0,
      is_available: o.available !== false, sort_order: oi,
    }));
    const { error: oErr } = await supabaseClient.from('menu_item_options').insert(optionsPayload);
    if (oErr) throw oErr;
  }
}
async function saveMenuItem(){
  syncDraftFromDom();
  const name = document.getElementById('mi-name').value.trim();
  const group = document.getElementById('mi-group').value.trim() || 'เมนู';
  const price = Number(document.getElementById('mi-price').value);
  const emoji = document.getElementById('mi-emoji').value.trim() || '🍽️';
  const desc = document.getElementById('mi-desc').value.trim();
  const fileInput = document.getElementById('mi-image');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if (!name || !price) { showToast('กรอกชื่อเมนูและราคาให้ครบ'); return; }
  for (const g of draftOptionGroups){
    if (g.name && g.name.trim() && g.options.filter(o=>o.name&&o.name.trim()).length===0){
      showToast(`กลุ่ม "${g.name}" ต้องมีตัวเลือกอย่างน้อย 1 ข้อ`); return;
    }
  }
  try {
    let imageUrl = editingItemId ? undefined : null;
    if (file) {
      const safeName = file.name.replace(/[^a-zA-Z0-9.]+/g, '_');
      const path = `${state.restaurantId}/${Date.now()}_${safeName}`;
      const { error: upErr } = await supabaseClient.storage.from('menu-images').upload(path, file);
      if (upErr) throw upErr;
      const { data: pub } = supabaseClient.storage.from('menu-images').getPublicUrl(path);
      imageUrl = pub.publicUrl;
    }
    let itemId = editingItemId;
    if (editingItemId) {
      const patch = { group_name: group, name, price, emoji, description: desc };
      if (imageUrl !== undefined) patch.image_url = imageUrl;
      const { error } = await supabaseClient.from('menu_items').update(patch).eq('id', editingItemId);
      if (error) throw error;
    } else {
      const { data: newItem, error } = await supabaseClient.from('menu_items').insert({
        restaurant_id: state.restaurantId, group_name: group, name, price, emoji, description: desc, is_available: true, image_url: imageUrl,
      }).select().single();
      if (error) throw error;
      itemId = newItem.id;
    }
    try { await saveOptionGroupsForItem(itemId); }
    catch(optErr) {
      console.warn('บันทึกตัวเลือกเมนูไม่สำเร็จ (อาจยังไม่ได้สร้างตาราง menu_item_option_groups / menu_item_options ใน Supabase)', optErr);
      showToast('บันทึกเมนูแล้ว แต่บันทึกตัวเลือกเพิ่มเติมไม่สำเร็จ — ตรวจสอบว่าสร้างตารางตัวเลือกใน Supabase แล้วหรือยัง');
      closeSheet(); await refreshMenu(); render();
      return;
    }
    showToast(editingItemId ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มเมนูแล้ว');
    closeSheet();
    await refreshMenu(); render();
  } catch (err) { console.error(err); showToast('บันทึกเมนูไม่สำเร็จ: ' + (err.message||'')); }
}
async function deleteMenuItem(id){
  if (!confirm('ลบเมนูนี้?')) return;
  try { const { error } = await supabaseClient.from('menu_items').delete().eq('id', id); if (error) throw error;
    await refreshMenu(); render();
  } catch (err) { console.error(err); showToast('ลบไม่สำเร็จ'); }
}

/* ============ สรุปยอดขาย (คำนวณจากออเดอร์ที่ส่งสำเร็จ) ============ */
const TH_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
async function refreshStats(){
  if (!supabaseClient || !state.restaurantId) return;
  try {
    const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - 6);
    const { data, error } = await supabaseClient
      .from('orders')
      .select('total,created_at,order_items(name,qty,price)')
      .eq('restaurant_id', state.restaurantId)
      .eq('status', 'delivered')
      .gte('created_at', start.toISOString());
    if (error) throw error;
    const days = [], labels = [];
    for (let i = 0; i < 7; i++){ const d = new Date(start); d.setDate(start.getDate() + i); days.push({ key: d.toDateString(), sales: 0, items: 0 }); labels.push(TH_DAYS[d.getDay()]); }
    const prod = {};
    (data||[]).forEach(o => {
      const day = days.find(d => d.key === new Date(o.created_at).toDateString());
      const qty = (o.order_items||[]).reduce((s,i) => s + (Number(i.qty)||0), 0);
      if (day){ day.sales += Number(o.total)||0; day.items += qty; }
      (o.order_items||[]).forEach(i => {
        const p = prod[i.name] = prod[i.name] || { name: i.name, qty: 0, revenue: 0 };
        p.qty += Number(i.qty)||0; p.revenue += (Number(i.price)||0) * (Number(i.qty)||0);
      });
    });
    const today = days[6];
    state.stats = {
      loaded: true, labels, series: days.map(d => d.sales),
      todaySales: today.sales, todayItems: today.items,
      total7: days.reduce((s,d) => s + d.sales, 0), items7: days.reduce((s,d) => s + d.items, 0),
      orders7: (data||[]).length,
      top: Object.values(prod).sort((a,b) => b.qty - a.qty).slice(0, 5),
    };
  } catch (err) { console.warn('refreshStats failed', err); }
}

/* ============ ใช้งานง่าย: เวลารอ / เสียงเตือนซ้ำ / จอไม่ดับ / สถานะการเชื่อมต่อ ============ */
function elapsedMin(t){ return Math.max(0, Math.floor((Date.now() - new Date(t).getTime()) / 60000)); }
function elapsedText(t){
  const m = elapsedMin(t);
  if (m < 1) return 'เพิ่งสั่ง';
  if (m < 60) return `รอ ${m} นาที`;
  return `รอ ${Math.floor(m/60)} ชม. ${m%60} นาที`;
}
function elapsedCls(t, warnAt){
  const m = elapsedMin(t);
  return m >= warnAt ? 'bg-red-500 text-white' : (m >= Math.ceil(warnAt/2) ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600');
}
function elapsedBadge(o, warnAt){
  return `<span class="js-elapsed text-[11px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ${elapsedCls(o.created_at, warnAt)}" data-t="${o.created_at}" data-warn="${warnAt}">⏱ ${elapsedText(o.created_at)}</span>`;
}
/* อัปเดตตัวนับเวลาทุก 30 วิ โดยไม่ต้องวาดหน้าใหม่ */
setInterval(() => {

    el.textContent = '⏱ ' + elapsedText(el.dataset.t);
    el.className = `js-elapsed text-[11px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ${elapsedCls(el.dataset.t, Number(el.dataset.warn))}`;

}, 30000);

function audioReady(){ return !!(sharedAudioCtx && sharedAudioCtx.state === 'running'); }

}

  <div class="flex items-center gap-1 my-2">
    ${STEPS.map((s, i) => `
      <div class="flex-1 min-w-0">
        <div class="h-1.5 rounded-full ${i < idx ? 'bg-brand-500' : (i === idx ? (kind==='new' ? 'bg-red-500' : 'bg-orange-400') : 'bg-slate-200')}"></div>
        <p class="text-[10px] mt-0.5 truncate ${i === idx ? 'font-bold text-slate-800' : 'text-slate-400'}">${s}</p>
      </div>`).join('')}
  </div>`;
}
function optChip(name){
  /* ตัวเลือกที่ขึ้นต้นด้วย "ไม่" (ไม่ใส่พริก / ไม่หวาน / ไม่รับช้อน) เป็นสีแดง ให้ครัวเห็นชัด */
  const plain = String(name).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '').trim();
  const neg = /^(ไม่|แยก|no\b)/i.test(plain);
  return `<span class="inline-block text-[12px] leading-tight font-semibold rounded-md px-1.5 py-0.5 border ${neg ? 'bg-red-50 text-red-700 border-red-200' : 'bg-orange-50 text-orange-800 border-orange-200'}">${esc(name)}</span>`;
}
function orderCardHtml(o, kind, tagLabel, actionsHtml){

      </div>
    </div>
    <div class="flex items-center gap-1.5 flex-wrap mt-2">${pay}</div>
    ${o.address ? `<p class="text-xs text-slate-500 flex gap-1 mt-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0 mt-px"></i><span>${esc(o.address)}</span></p>` : ''}

}
function infoLine(icon, text, tone){
  return `<div class="mt-3 text-xs font-semibold ${tone} rounded-xl px-3 py-2.5 flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i>${text}</div>`;

function bigBtn(onclick, cls, icon, label){

function setMenuFilter(f){ state.menuFilter = f; render(); }
function applyMenuFilters(){
  const input = document.getElementById('productSearch');
  const q = (input ? input.value : '').trim().toLowerCase();
  state.menuQuery = input ? input.value : '';
  const f = state.menuFilter || 'all';
  document.querySelectorAll('.product-item').forEach(el => {
    const okQ = !q || el.dataset.name.includes(q);
    const okF = f === 'all' || el.dataset.status === f;
    el.classList.toggle('hidden', !(okQ && okF));
  });
}
function renderMenuTab(){

  const fBtn = (id, label) => `<button onclick="setMenuFilter('${id}')" class="px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap ${f===id ? 'bg-brand-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${label}</button>`;

/* ============ ตั้งเวลาเปิด-ปิดร้าน (จันทร์-อาทิตย์) ============ */
const DAY_ORDER = [1,2,3,4,5,6,0];
const DAY_FULL = { 0:'วันอาทิตย์', 1:'วันจันทร์', 2:'วันอังคาร', 3:'วันพุธ', 4:'วันพฤหัสบดี', 5:'วันศุกร์', 6:'วันเสาร์' };
function getHours(){
  const saved = (state.restaurant && state.restaurant.opening_hours) || {};
  const days = {};
  DAY_ORDER.forEach(d => {
    const s = (saved.days || {})[d] || {};
    days[d] = { open: s.open !== undefined ? !!s.open : true, from: s.from || '09:00', to: s.to || '20:00' };
  });
  return { auto: !!saved.auto, days };
}
function toMin(t){ const [h,m] = String(t||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); }
/* อยู่ในเวลาทำการไหม (รองรับปิดข้ามเที่ยงคืน เช่น 18:00–02:00) */
function isWithinHours(h, now){
  now = now || new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const today = h.days[now.getDay()], yest = h.days[(now.getDay()+6) % 7];
  if (today.open){
    const f = toMin(today.from), t = toMin(today.to);
    if (f < t ? (cur >= f && cur < t) : cur >= f) return true;
  }
  if (yest.open){
    const f = toMin(yest.from), t = toMin(yest.to);
    if (f >= t && cur < t) return true;
  }
  return false;
}
function onScheduleDayToggle(d, cb){
  const row = document.getElementById('sh-row-' + d);
  if (!row) return;
  row.classList.toggle('opacity-60', !cb.checked);
  document.getElementById('sh-times-' + d).classList.toggle('hidden', !cb.checked);
  document.getElementById('sh-off-' + d).classList.toggle('hidden', cb.checked);
}

      <button id="sh-save-btn" onclick="saveSchedule()" class="w-full mt-3 py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl text-xs shadow-md transition">บันทึกตารางเวลาทำการ</button>

async function saveSchedule(){
  const days = {};
  for (const d of DAY_ORDER){
    const open = document.getElementById('sh-open-' + d).checked;
    const from = document.getElementById('sh-from-' + d).value;
    const to = document.getElementById('sh-to-' + d).value;
    if (open && (!from || !to)) { showToast(`กรอกเวลาเปิด-ปิดของ${DAY_FULL[d]}ให้ครบ`); return; }
    if (open && from === to) { showToast(`เวลาเปิดและปิดของ${DAY_FULL[d]}ต้องไม่เท่ากัน`); return; }
    days[d] = { open, from: from || '09:00', to: to || '20:00' };
  }
  const payload = { auto: document.getElementById('sh-auto').checked, days };
  const btn = document.getElementById('sh-save-btn'); if (btn) { btn.disabled = true; btn.textContent = 'กำลังบันทึก...'; }
  try {
    const { error } = await supabaseClient.from('restaurants').update({ opening_hours: payload }).eq('id', state.restaurantId);
    if (error) throw error;
    state.restaurant.opening_hours = payload;
    lastScheduleWithin = null; // ให้เช็คเวลาใหม่ทันที
    showToast('บันทึกเวลาทำการจันทร์-อาทิตย์เรียบร้อยแล้ว');
    await checkAutoSchedule();
    render();
  } catch (err) {
    console.error(err); showToast('บันทึกเวลาไม่สำเร็จ: ' + (err.message||''));
    if (btn) { btn.disabled = false; btn.textContent = 'บันทึกตารางเวลาทำการ'; }
  }
}
/* เปิด/ปิดร้านอัตโนมัติทำงานฝั่งเซิร์ฟเวอร์ทุกนาที (ไม่ต้องเปิดแอปค้าง)
   ฟังก์ชันนี้ใช้ตอนกด "บันทึก" เพื่อปรับสถานะร้านให้ตรงกับเวลาตอนนี้ทันที */
let lastScheduleWithin = null;
async function checkAutoSchedule(){
  if (state.view !== 'dashboard' || !state.restaurant) return;
  const h = getHours();
  if (!h.auto) { lastScheduleWithin = null; return; }
  const within = isWithinHours(h);
  const isOpen = state.restaurant.is_open !== false;
  if (isOpen === within) return;
  try {
    const { error } = await supabaseClient.from('restaurants').update({ is_open: within }).eq('id', state.restaurantId);
    if (error) throw error;
    state.restaurant.is_open = within;
    showToast(within ? '⏰ ถึงเวลาเปิดร้าน — เปิดรับออเดอร์อัตโนมัติแล้ว' : '⏰ หมดเวลาทำการ — ปิดรับออเดอร์อัตโนมัติแล้ว');
    if (!activeSheet && state.tab !== 'menu') render();
  } catch (err) { console.warn('auto schedule failed', err); }
}

function printOrder(id){
  const o = findOrder(id);
  if (!o) { showToast('ไม่พบออเดอร์นี้'); return; }
  let f = document.getElementById('print-frame');
  if (f) f.remove();
  f = document.createElement('iframe');
  f.id = 'print-frame';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  document.body.appendChild(f);
  const doc = f.contentWindow.document;
  doc.open(); doc.write(receiptHtml(o)); doc.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e){ console.error(e); showToast('สั่งพิมพ์ไม่สำเร็จ'); } }, 300);
}
function printTest(){
  const demo = { id:'__test', order_code:'TEST', created_at:new Date().toISOString(), is_self_delivery:false, total:120, payment_method:'cash', note:'ทดสอบเครื่องพิมพ์', address:'',
    order_items:[{ name:'ตัวอย่างเมนู', qty:2, price:50, selected_options:[{ optionName:'เผ็ดน้อย' }] }, { name:'น้ำเปล่า', qty:1, price:20 }] };
  state.__printTest = demo; printOrder('__test');
}
function printBtn(id){
  return `<button onclick="printOrder('${id}')" title="พิมพ์ใบออเดอร์" class="text-[11px] font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200 px-2 py-0.5 rounded-md flex items-center gap-1"><i data-lucide="printer" class="w-3 h-3"></i>พิมพ์</button>`;
}
function printerCardHtml(){
  const p = getPaperSize();
  const opt = (v, label) => `<button onclick="setPaperSize('${v}')" class="flex-1 py-2 rounded-xl text-xs font-bold border ${p===v ? 'bg-brand-500 text-white border-brand-500' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">${label}</button>`;
  return `
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <div class="flex items-center gap-2"><i data-lucide="printer" class="w-4 h-4 text-slate-600"></i><h3 class="font-bold text-slate-800 text-sm">เครื่องพิมพ์ใบออเดอร์</h3></div>
      <div>
        <p class="text-[11px] text-slate-500 mb-1.5">ขนาดกระดาษ</p>
        <div class="flex gap-2">${opt('58','58 มม. (เล็ก)')}${opt('80','80 มม. (ใหญ่)')}</div>
      </div>
      <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="flex-1 min-w-0"><p class="font-bold text-slate-800 text-sm">พิมพ์อัตโนมัติเมื่อกดรับออเดอร์</p><p class="text-[11px] text-slate-500">กด "รับออเดอร์" แล้วเด้งหน้าพิมพ์ให้ทันที</p></div>
        ${toggleHtml(isAutoPrint(), 'toggleAutoPrint()')}
      </div>
      <button onclick="printTest()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5"><i data-lucide="printer" class="w-4 h-4"></i> ทดสอบพิมพ์</button>
      <p class="text-[11px] text-slate-500 leading-relaxed">ใช้ได้กับเครื่องพิมพ์ที่เชื่อมกับเครื่องนี้แล้ว (USB / Wi-Fi / Bluetooth) • บนมือถือ Android แนะนำแอป <b>RawBT</b> สำหรับเครื่องพิมพ์ใบเสร็จบลูทูธ • ปุ่ม "พิมพ์" อยู่บนการ์ดออเดอร์ทุกใบ</p>
    </div>`;
}

/* หน้าก่อนเข้าระบบ (ล็อกอิน/สมัคร/รออนุมัติ) ครอบด้วยแบนเนอร์ของหน้ากาก */
function guestShell(inner){
  return `
  <div class="max-w-lg mx-auto pb-10">${inner}</div>`;
}

function render(){
  const app = document.getElementById('app');
  const done = () => { if (window.lucide) lucide.createIcons(); };
  if (state.view === 'loading') { app.innerHTML = guestShell(`<div class="onboard-card"><div class="onboard-emoji">⏳</div><h2 class="mt-2">กำลังโหลด...</h2></div>`); done(); return; }
  if (state.view === 'needs-config') { app.innerHTML = guestShell(needsConfigHtml()); done(); return; }
  if (state.view === 'auth') { app.innerHTML = guestShell(authHtml()); done(); return; }
  if (state.view === 'setup-profile') { app.innerHTML = guestShell(setupProfileHtml()); done(); return; }
  if (state.view === 'pending') { app.innerHTML = guestShell(pendingHtml()); done(); return; }
  if (state.view === 'suspended') { app.innerHTML = guestShell(suspendedHtml()); done(); return; }

  let body = '';
  if (state.tab === 'orders') body = renderOrdersTab();
  else if (state.tab === 'menu') body = renderMenuTab();
  else if (state.tab === 'analytics') body = renderAnalyticsTab();
  else body = renderSettingsTab();

  app.innerHTML = `
    ${headerHtml()}
    <main class="max-w-4xl w-full mx-auto p-3 sm:p-6 pb-24 sm:pb-24">${body}</main>
    ${navHtml()}
  `;
  if (state.tab === 'menu') applyMenuFilters();
  if (state.tab === 'analytics') drawSalesChart();
  refreshOverlay();
  done();
}

init();
</script>
</body>
</html>
