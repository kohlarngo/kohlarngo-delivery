<script>
/* ============================================================
   ร้านพรีออเดอร์ (จองวันนี้ อิ่มพรุ่งนี้) — แอปสำหรับแม่ค้า
   ใช้ฐานข้อมูลเดียวกับแอปลูกค้า (Supabase: kohlarngo-delivery)
   ============================================================ */
const SUPABASE_URL = 'https://onvrqsyoykopwjunvrhr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v2MCVFaUm-1s6xD6og_eKg_S1vBU4SF';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIES = [
  { id: 'thai', label: '🍛 อาหารไทย' }, { id: 'isaan', label: '🥗 ส้มตำ/อีสาน' }, { id: 'noodle', label: '🍜 ก๋วยเตี๋ยว' },
  { id: 'dessert', label: '🧋 ของหวาน/เครื่องดื่ม' }, { id: 'bakery', label: '🥐 เบเกอรี่' }, { id: 'japanese', label: '🍣 ญี่ปุ่น' },
  { id: 'fastfood', label: '🍔 ฟาสต์ฟู้ด' }, { id: 'other', label: '🍽️ อื่นๆ' },
];

const S = {
  view: 'loading',        // loading | auth | create | app
  tab: 'orders',          // orders | menu | settings
  authMode: 'login',
  user: null,
  shops: [], shop: null,
  orders: [], customers: {},
  menu: [],
  dateFilter: null,       // iso date | 'all'
  sheet: null,            // { type, data }
  busy: false,
  draft: null,            // แบบร่างหน้าตั้งค่า
  days: [],               // เมนูขายประจำวัน (preorder_days)
  report: { range: 'week', from: null, to: null, orders: null, loading: false }, // หน้า 📊 ยอดขาย

};
const FN_RESET = SUPABASE_URL + '/functions/v1/shop-password-reset';
let orderChannel = null;

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return Number(n || 0).toLocaleString('th-TH') + ' ฿'; }
function pad2(n){ return String(n).padStart(2, '0'); }
function isoDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + n); return isoDate(d); }
function dayLabel(iso){
  if (!iso) return { main: 'ไม่ระบุวัน', sub: '' };
  const [y, m, d] = iso.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((date - t) / 86400000);
  const sub = date.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });
  const main = diff === 0 ? 'วันนี้' : diff === 1 ? 'พรุ่งนี้' : diff === 2 ? 'มะรืนนี้' : diff === -1 ? 'เมื่อวาน' : sub;
  return { main, sub: main === sub ? '' : sub };
}
function dayText(iso){ const l = dayLabel(iso); return l.sub ? `${l.main} (${l.sub})` : l.main; }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function beep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.2, ctx.currentTime + t); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.15); });
  } catch (e) {}
}
function errMsg(e){ return (e && (e.message || e.error_description)) || 'เกิดข้อผิดพลาด'; }

// ไอดีร้านพรีออเดอร์แยกจากไอดีร้านค้าทั่วไป (คนละโดเมน → ไอดีชื่อเดียวกันก็เป็นคนละบัญชี)
const PREORDER_DOMAIN = 'preorder.imduan-app.com';
const LEGACY_DOMAIN = 'merchants.imduan-app.com'; // ร้านพรีออเดอร์ที่สมัครไว้ก่อนแยกไอดี
function usernameToEmail(username, domain){
  const norm = username.trim().toLowerCase();
  let hash = 5381;
  for (let i = 0; i < norm.length; i++) { hash = ((hash << 5) + hash + norm.charCodeAt(i)) >>> 0; }
  const slug = norm.replace(/[^a-z0-9]/g, '').slice(0, 20) || 'u';
  return `${slug}${hash.toString(36)}@${domain || PREORDER_DOMAIN}`;
}
async function doLogin(){
  const username = $('auth-username').value.trim(), pw = $('auth-password').value;
  if (!username || !pw) return toast('กรอกไอดีและรหัสผ่าน');
  setSubmitBtn('login-btn', true, 'กำลังเข้าสู่ระบบ...');
  let { data, error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username, PREORDER_DOMAIN), password: pw });
  let legacy = false;
  if (error && /Invalid login/i.test(errMsg(error))) {
    // บัญชีเก่าที่สมัครก่อนแยกไอดี: ยอมให้เข้าเฉพาะเจ้าของร้านพรีออเดอร์เท่านั้น
    const r2 = await sb.auth.signInWithPassword({ email: usernameToEmail(username, LEGACY_DOMAIN), password: pw });
    if (!r2.error) { data = r2.data; error = null; legacy = true; }
  }
  if (error) { setSubmitBtn('login-btn', false, 'เข้าสู่ระบบ'); return toast(/Invalid login/i.test(errMsg(error)) ? 'ไอดีหรือรหัสผ่านไม่ถูกต้อง (ไอดีร้านค้าทั่วไปใช้ที่นี่ไม่ได้)' : 'เข้าสู่ระบบไม่สำเร็จ: ' + errMsg(error)); }
  S.user = data.user;
  await loadShops(legacy);
}

async function doForgot(){
  const username = $('fg-username').value.trim(), phone = $('fg-phone').value.replace(/\D/g, '');
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) return toast('กรอกไอดีร้านให้ถูกต้อง');
  if (!/^0\d{8,9}$/.test(phone)) return toast('กรอกเบอร์โทรเจ้าของร้านที่ใช้ตอนสมัคร');
  setSubmitBtn('fg-btn', true, 'กำลังส่งคำขอ...');
  try {
    const r = await fetch(FN_RESET, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify({ action: 'request', username, phone }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S.authMode = 'forgot-sent'; render();
  } catch (e) { console.error(e); setSubmitBtn('fg-btn', false, 'ส่งคำขอรีเซ็ตรหัสผ่าน'); toast('ส่งคำขอไม่สำเร็จ ลองใหม่อีกครั้ง'); }
}

function previewFileTo(inputId, imgId){

function readShopForm(idCardOptional){
  const v = id => { const el = $(id); return el ? el.value.trim() : ''; };
  const f = {
    ownerFirst: v('sp-owner-first'), ownerLast: v('sp-owner-last'), ownerPhone: v('sp-owner-phone'),
    ownerNid: v('sp-owner-nid'), idCardFile: $('sp-owner-idcard').files[0],
  };
  let err = null;
  if (!f.ownerFirst || !f.ownerLast) err = 'กรอกชื่อ-นามสกุลเจ้าของร้าน';
  else if (!/^0\d{8,9}$/.test(f.ownerPhone.replace(/\D/g, ''))) err = 'กรอกเบอร์โทรเจ้าของร้านให้ถูกต้อง';
  else if (!/^\d{13}$/.test(f.ownerNid)) err = 'เลขบัตรประชาชนต้องเป็นตัวเลข 13 หลัก';
  else if (!f.idCardFile && !idCardOptional) err = 'กรุณาแนบรูปบัตรประชาชนเจ้าของร้าน';
  return { f, err };
}
async function uploadFile(bucket, file){
  const path = `${S.user.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]+/g, '_')}`;
  const { error } = await sb.storage.from(bucket).upload(path, file);
  if (error) throw error;
  return path;
}

  const idCardPath = await uploadFile('verification-docs', f.idCardFile);
  const phone = f.ownerPhone.replace(/\D/g, '');
  const { error } = await sb.from('restaurants').insert({
    // ชื่อร้านชั่วคราว — แม่ค้าแก้ได้ในหน้าตั้งค่า
    name: `ร้านของ${f.ownerFirst}`, category: 'other', tags: 'สั่งล่วงหน้า', phone,
    owner_first_name: f.ownerFirst, owner_last_name: f.ownerLast, owner_phone: phone,
    owner_national_id: f.ownerNid, owner_id_card_path: idCardPath,
    owner_id: S.user.id, status: 'pending',
    // ร้านพรีออเดอร์: จัดส่งเอง ปิดรับจองไว้ก่อนจนกว่าแอดมินอนุมัติ
    is_preorder: true, self_delivery_enabled: true, is_open: false, emoji: '🍱', color: '#F4EEFF', prep_time: 'สั่งล่วงหน้า', price_level: '฿',
  });

async function doSignup(){
  const username = $('auth-username').value.trim(), pw = $('auth-password').value;
  if (!username || !pw) return toast('กรอกไอดีและรหัสผ่าน');
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) return toast('ไอดีต้องเป็นภาษาอังกฤษ a-z, ตัวเลข 0-9 หรือ _ เท่านั้น (3-20 ตัวอักษร)');
  if (pw.length < 6) return toast('รหัสผ่านอย่างน้อย 6 ตัวอักษร');
  const { f, err } = readShopForm();
  if (err) return toast(err);
  setSubmitBtn('sp-submit-btn', true, 'กำลังสมัคร...');
  try {
    const { data, error } = await sb.auth.signUp({ email: usernameToEmail(username, PREORDER_DOMAIN), password: pw });
    if (error) throw error;
    if (!data.session) { setSubmitBtn('sp-submit-btn', false, 'บันทึกและส่งขออนุมัติ'); return toast('สมัครไม่สำเร็จ: ต้องปิด "Confirm email" ใน Supabase ก่อน'); }
    S.user = data.user;
    await saveShopProfile(f);
    toast('สมัครสำเร็จ! กำลังรอแอดมินอนุมัติ');
    await loadShops();
  } catch (e) {
    console.error(e);
    toast(/already registered/i.test(errMsg(e)) ? 'ไอดีนี้มีคนใช้แล้ว ลองไอดีอื่น' : 'สมัครไม่สำเร็จ: ' + errMsg(e));
    // สร้างบัญชีได้แล้วแต่บันทึกร้านไม่สำเร็จ → ไปหน้ากรอกข้อมูลร้านต่อ ไม่ต้องสมัครบัญชีซ้ำ
    if (S.user) { S.view = 'create'; render(); } else setSubmitBtn('sp-submit-btn', false, 'บันทึกและส่งขออนุมัติ');
  }
}

async function rejectAccount(msg){
  try { await sb.auth.signOut(); } catch (e) {}
  S.user = null; S.shops = []; S.view = 'auth'; S.authMode = 'login'; render(); toast(msg);
}
async function loadShops(legacy){
  const { data, error } = await sb.from('restaurants').select('*').eq('owner_id', S.user.id).order('created_at');
  if (error) { toast(errMsg(error)); S.view = 'auth'; return render(); }
  const all = data || [];
  const isLegacy = legacy || String(S.user.email || '').endsWith('@' + LEGACY_DOMAIN);
  S.shops = all.filter(s => s.is_preorder);
  // ไอดีร้านค้าทั่วไป เข้าแอปร้านพรีออเดอร์ไม่ได้
  if (!S.shops.length && (all.length || isLegacy)) return rejectAccount('ไอดีนี้เป็นของร้านค้าทั่วไป — กรุณาใช้แอปร้านค้าทั่วไป หรือสมัครไอดีร้านพรีออเดอร์ใหม่');
  if (!S.shops.length) { S.view = 'create'; return render(); }
  let saved = null; try { saved = localStorage.getItem('preshop_id'); } catch (e) {}
  const pick = S.shops.find(s => s.id === saved) || S.shops.find(s => s.is_preorder) || S.shops[0];
  await selectShop(pick.id);
}
async function selectShop(id){
  S.shop = S.shops.find(s => s.id === id);
  try { localStorage.setItem('preshop_id', id); } catch (e) {}
  S.view = 'app'; S.draft = null; S.sheet = null; S.dateFilter = null; S.report.orders = null;
  render();
  await Promise.all([loadOrders(), loadMenu(), loadDays()]);
  subscribeOrders();
  render();
}
async function refreshShop(){
  const { data } = await sb.from('restaurants').select('*').eq('id', S.shop.id).maybeSingle();
  if (data) { S.shop = data; S.shops = S.shops.map(s => s.id === data.id ? data : s); }
}
function grabPin(){
  if (!navigator.geolocation) return toast('อุปกรณ์นี้ไม่รองรับ GPS');
  toast('กำลังหาตำแหน่ง...');
  navigator.geolocation.getCurrentPosition(p => {
    S.draft.lat = +p.coords.latitude.toFixed(6); S.draft.lng = +p.coords.longitude.toFixed(6);
    render(); toast('📍 ปักหมุดแล้ว');
  }, () => toast('หาตำแหน่งไม่ได้ กรุณาอนุญาตการเข้าถึงตำแหน่ง'), { enableHighAccuracy: true, timeout: 12000 });
}
async function toggleOpen(){
  const val = !S.shop.is_open;
  if (val && S.shop.status !== 'active') return toast(S.shop.status === 'rejected' ? 'แอดมินยังไม่อนุมัติร้าน — กดแก้ไขข้อมูลแล้วส่งใหม่ก่อน' : 'ร้านยังรอแอดมินอนุมัติ จึงยังเปิดรับจองไม่ได้');

  const { error } = await sb.from('restaurants').update({ is_open: val }).eq('id', S.shop.id);
  if (error) return toast(errMsg(error));
  S.shop.is_open = val; render();
  toast(val ? '🟢 เปิดร้านแล้ว ลูกค้าเห็นเมนูที่โพสต์ไว้' : '🔴 ปิดร้านชั่วคราว ลูกค้าจะไม่เห็นร้าน');

/* ---------------- orders ---------------- */
async function loadOrders(){
  const from = addDays(-7);
  const { data, error } = await sb.from('orders')
    .select('id,order_code,status,subtotal,delivery_fee,discount_amount,total,address,payment_method,payment_slip_url,note,created_at,customer_id,dropoff_lat,dropoff_lng,order_type,scheduled_date,scheduled_slot,fulfillment,delivery_zone,contact_name,contact_phone,preorder_day_id,self_rider_name,self_rider_phone,cancel_reason,is_self_delivery,rider_id,rider_requested_at,payment_status,payment_note,payment_verified_at,order_items(menu_item_id,name,emoji,qty,price,selected_options)')
    .eq('restaurant_id', S.shop.id).eq('order_type', 'preorder').gte('scheduled_date', from)
    .order('scheduled_date', { ascending: true }).order('scheduled_slot', { ascending: true }).order('created_at', { ascending: true });
  if (error) { toast('โหลดออเดอร์ไม่สำเร็จ: ' + errMsg(error)); return; }
  S.orders = data || [];
  await loadRiders();
  // ออเดอร์เก่าที่ไม่มีชื่อ/เบอร์บนออเดอร์ → ดึงจากข้อมูลลูกค้า
  const ids = [...new Set(S.orders.filter(o => !o.contact_phone).map(o => o.customer_id).filter(id => id && !S.customers[id]))];
  if (ids.length) {
    const { data: cs } = await sb.from('customers').select('id,name,phone').in('id', ids);
    (cs || []).forEach(c => { S.customers[c.id] = c; });
  }
  if (!S.dateFilter) {
    const next = S.orders.find(o => o.scheduled_date >= addDays(0) && o.status !== 'cancelled' && o.status !== 'delivered');
    S.dateFilter = next ? next.scheduled_date : addDays(1);
  }
}
function subscribeOrders(){
  if (orderChannel) sb.removeChannel(orderChannel);
  orderChannel = sb.channel('preshop_' + S.shop.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: `restaurant_id=eq.${S.shop.id}` }, async payload => {
      if (payload.eventType === 'INSERT' && payload.new.order_type === 'preorder') {
        beep(); toast(`🔔 ออเดอร์จองใหม่ ${payload.new.fulfillment === 'pickup' ? 'รับเอง' : 'ส่ง'} ${dayLabel(payload.new.scheduled_date).main} ${payload.new.scheduled_slot || ''}`);
      }
      const prev = payload.new && S.orders.find(o => o.id === payload.new.id);
      if (prev && !prev.rider_id && payload.new.rider_id) {
        const r = await riderInfo(payload.new.rider_id, true);
        beep(); toast(`🛵 ไรเดอร์${r ? ' ' + r.name : ''} รับงาน #${payload.new.order_code} แล้ว`);
      }
      await loadOrders(); rerenderKeepingInput();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'restaurants', filter: `id=eq.${S.shop.id}` }, async () => {
      // แอดมินอนุมัติ/ปฏิเสธ/ระงับร้าน → อัปเดตแถบแจ้งเตือนทันที
      const before = S.shop.status; await refreshShop();
      if (S.shop.status !== before && S.view === 'app') { rerenderKeepingInput(); toast(S.shop.status === 'active' ? '🎉 แอดมินอนุมัติร้านแล้ว' : S.shop.status === 'rejected' ? 'แอดมินขอให้แก้ไขข้อมูลร้าน' : 'สถานะร้านเปลี่ยนแล้ว'); }
    })
    .subscribe();
}

/* ---------- จัดส่งโดยไรเดอร์ kohlarngo ----------
   แม่ค้ากด "เรียกไรเดอร์" → ออเดอร์เข้าคิวงานในแอปไรเดอร์ (status=pending, is_self_delivery=false)
   ไรเดอร์กดรับ → preparing (หรือ ready ถ้าอาหารพร้อมแล้วตอนเรียก) → แม่ค้ากดอาหารพร้อม → ไรเดอร์กดรับอาหาร/ส่งสำเร็จเอง */
function usesPlatformRider(o){ return o.fulfillment !== 'pickup' && o.is_self_delivery === false && !!(o.rider_requested_at || o.rider_id); }
function searchingRider(o){ return usesPlatformRider(o) && o.status === 'pending' && !o.rider_id; }
function needsConfirm(o){ return o.status === 'pending' && !searchingRider(o); }
function canCallRider(o){ return o.fulfillment !== 'pickup' && o.is_self_delivery !== false && !o.rider_id && (o.status === 'preparing' || o.status === 'ready'); }
const riderCache = {};

function statusFlow(o){
  const pickup = o.fulfillment === 'pickup';
  if (usesPlatformRider(o)) return {
    pending:   { label: 'กำลังหาไรเดอร์' },
    preparing: { label: 'ไรเดอร์กำลังมาที่ร้าน', next: 'ready', action: '📦 อาหารพร้อม ให้ไรเดอร์มารับ' },
    ready:     { label: 'รอไรเดอร์มารับ' },
    picked_up: { label: 'ไรเดอร์กำลังไปส่ง' },

  return {

    preparing: { label: 'กำลังเตรียม', next: 'ready', action: pickup ? '📦 พร้อมให้มารับ' : '📦 อาหารพร้อมแล้ว' },

    delivered: { label: pickup ? 'รับแล้ว' : 'ส่งสำเร็จ' },

  }[o.status] || { label: o.status };

async function setRealTotal(id){
  const o = S.orders.find(x => x.id === id); if (!o) return;
  const fee = Number(o.delivery_fee) || 0;
  // ยอดเดิม = เมนูปกติ + ค่าบริการฝากซื้อ (คิดไว้แล้วตอนจอง) → แม่ค้ากรอกแค่ราคาสินค้าที่ซื้อมา
  const base = (o.order_items || []).reduce((a, i) => a + Number(i.price || 0) * Number(i.qty || 0), 0);
  const v = prompt(`ราคาสินค้าฝากซื้อที่ซื้อมาจริง ออเดอร์ #${o.order_code}\n(ไม่รวมค่าบริการ ${money(base)} และค่าส่ง${fee ? ' ' + money(fee) : ''} — ระบบบวกให้เอง)`, '');
  if (v === null) return;
  const goods = Number(String(v).replace(/[^\d.]/g, ''));
  if (!(goods > 0)) return toast('กรอกยอดเป็นตัวเลข');
  const sub = base + goods;
  const { error } = await sb.from('orders').update({ subtotal: sub, total: sub + fee - (Number(o.discount_amount) || 0) }).eq('id', id);
  if (error) return toast(errMsg(error));

async function saveMenu(){

  if (custom && !(d.menu_photo_urls || []).length) return toast('สินค้าฝากซื้อต้องใส่รูปเมนูของร้านอย่างน้อย 1 รูป ให้ลูกค้าดูแล้วเลือก');
  const price = custom ? 0 : Number(d.price);
  if (!custom && (d.price === '' || !(price >= 0))) return toast('กรุณากรอกราคา');
  const big = custom || d.bigPrice === '' || d.bigPrice == null ? null : Number(d.bigPrice);
  if (big !== null && !(big > price)) return toast('ราคาพิเศษต้องมากกว่าราคาธรรมดา');
  const row = { restaurant_id: S.shop.id, name: d.name.trim(), group_name: d.group_name || MENU_GROUP, price, description: d.description.trim() || null, emoji: d.emoji.trim() || '🍱', image_url: d.image_url || null, is_available: d.is_available !== false, is_custom_request: custom, menu_photo_urls: custom ? (d.menu_photo_urls || []).slice(0, 2) : [], service_fee: custom ? Math.max(0, Number(d.service_fee) || 0) : 0 };

    else { const { data, error } = await sb.from('menu_items').insert(row).select('id').single(); if (error) throw error; itemId = data.id; }
    const old = S.menu.find(x => x.id === d.id);
    if (big !== (old ? old.bigPrice : null) || (old && big && Number(old.price) !== price)) await syncSizeGroup(itemId, old ? old.sizeGroupId : null, price, big);
  } catch (e) { return toast(errMsg(e)); }
  const back = S.sheet.back; S.sheet = null; await loadMenu();
  if (back) { if (back.type === 'day' && itemId && !d.id) back.data.picked[itemId] = ''; S.sheet = back; }

}

/* ---------------- เมนูขายประจำวัน (โพสต์ "เมนูพรุ่งนี้") ---------------- */
async function loadDays(){
  const { data, error } = await sb.from('preorder_days').select('*').eq('restaurant_id', S.shop.id).gte('serve_date', addDays(-1)).order('serve_date');
  if (error) { console.warn(error); S.days = []; return; }
  S.days = data || [];
}
function defaultCutoff(serveDate){
  // ปิดรับจอง = วันก่อนวันขาย ตามเวลาที่ร้านตั้งไว้ (เวลาไทย)
  const [y, m, d] = serveDate.split('-').map(Number);
  const prev = new Date(y, m - 1, d - 1);
  return { date: isoDate(prev), time: S.shop.preorder_cutoff || '20:00' };
}
function cutoffParts(ts){
  const d = new Date(ts);
  const bkk = new Date(d.getTime() + (7 * 60 + d.getTimezoneOffset()) * 60000);
  return { date: isoDate(bkk), time: pad2(bkk.getHours()) + ':' + pad2(bkk.getMinutes()) };
}
function cutoffText(ts){ const p = cutoffParts(ts); return `${dayLabel(p.date).main} ${p.time} น.`; }
function thaiDate(iso){ const [y, m, d] = iso.split('-').map(Number); return `${d}/${m}/${y + 543}`; }
function openDayEditor(id){
  const s = S.shop;
  const day = id ? S.days.find(x => x.id === id) : null;
  let serve = day ? day.serve_date : addDays(1);
  if (!day) { let n = 1; while (S.days.some(x => x.serve_date === serve) && n < 14) serve = addDays(++n); }
  const c = day ? cutoffParts(day.cutoff_at) : defaultCutoff(serve);
  const picked = {};
  (day ? day.items : []).forEach(it => { picked[it.menu_item_id] = it.limit == null ? '' : String(it.limit); });
  S.sheet = { type: 'day', data: {
    id: day ? day.id : null, serve_date: serve, cutoff_date: c.date, cutoff_time: c.time, picked,
    // แม่ค้าเลือกอย่างใดอย่างหนึ่ง: มารับที่ร้าน หรือ ร้านไปส่ง
    pickup_enabled: day ? !day.delivery_enabled : s.delivery_enabled === false,
    delivery_enabled: day ? !!day.delivery_enabled : s.delivery_enabled !== false,
    time_from: day ? day.time_from : (s.serve_time_from || '07:00'), time_to: day ? day.time_to : (s.serve_time_to || '11:00'),
    note: day ? (day.note || '') : '', is_open: day ? day.is_open : true,
  } };
  render();
}
function captureDayForm(){
  if (!S.sheet || S.sheet.type !== 'day' || !$('d-date')) return;
  const d = S.sheet.data;
  const newDate = $('d-date').value || d.serve_date;
  if (newDate !== d.serve_date && !d.id) {
    const c = defaultCutoff(newDate); d.cutoff_date = c.date; d.cutoff_time = c.time;
  } else { d.cutoff_date = $('d-cut-date').value || d.cutoff_date; d.cutoff_time = $('d-cut-time').value || d.cutoff_time; }
  d.serve_date = newDate;
  d.time_from = $('d-from').value || d.time_from; d.time_to = $('d-to').value || d.time_to;
  const mode = (document.querySelector('input[name="d-mode"]:checked') || {}).value;
  if (mode) { d.pickup_enabled = mode === 'pickup'; d.delivery_enabled = mode === 'delivery'; }
  d.note = $('d-note').value;
  const picked = {};
  document.querySelectorAll('[data-day-item]').forEach(cb => {
    if (cb.checked) { const lim = $('lim-' + cb.dataset.dayItem); picked[cb.dataset.dayItem] = lim ? lim.value : ''; }
  });
  d.picked = picked;
}
function feeText(){
  const s = S.shop, z = Array.isArray(s.delivery_zones) ? s.delivery_zones : [];
  if (z.length) { const fees = z.map(x => Number(x.fee) || 0); const lo = Math.min(...fees), hi = Math.max(...fees); return hi === 0 ? 'ส่งฟรี (มียอดขั้นต่ำตามโซน)' : `ค่าส่ง ${lo === hi ? lo : lo + '-' + hi} บาท ตามโซน`; }
  const f = Number(s.preorder_delivery_fee) || 0; return f ? `ค่าส่ง ${f} บาท` : 'ส่งฟรี';
}
function setDayDate(iso){ captureDayForm(); const d = S.sheet.data; if (!d.id) { d.serve_date = iso; const c = defaultCutoff(iso); d.cutoff_date = c.date; d.cutoff_time = c.time; } render(); }
function addMenuFromDay(){ captureDayForm(); const back = S.sheet; openMenuEditor(); S.sheet.back = back; render(); }
async function saveDay(){
  captureDayForm();
  const d = S.sheet.data;
  const items = Object.keys(d.picked).map(id => ({ menu_item_id: id, limit: d.picked[id] === '' ? null : Math.max(0, parseInt(d.picked[id], 10) || 0) }));
  if (!items.length) return toast('เลือกเมนูที่จะขายอย่างน้อย 1 อย่าง');
  if (!d.pickup_enabled && !d.delivery_enabled) return toast('เลือกรับเองที่ร้าน หรือ ร้านส่ง อย่างน้อย 1 แบบ');
  if (d.time_to <= d.time_from) return toast('เวลาสิ้นสุดต้องหลังเวลาเริ่ม');
  if (d.serve_date < addDays(0)) return toast('เลือกวันขายตั้งแต่วันนี้เป็นต้นไป');
  if (!d.id && S.days.some(x => x.serve_date === d.serve_date)) return toast('มีเมนูของวันนี้อยู่แล้ว — กดแก้ไขเมนูเดิมแทน');
  const cutoff = new Date(`${d.cutoff_date}T${d.cutoff_time}:00+07:00`);
  if (isNaN(cutoff)) return toast('เวลาปิดรับจองไม่ถูกต้อง');
  if (cutoff > new Date(`${d.serve_date}T${d.time_to}:00+07:00`)) return toast('ต้องปิดรับจองก่อนเวลารับ/ส่งสิ้นสุด');
  const row = { restaurant_id: S.shop.id, serve_date: d.serve_date, cutoff_at: cutoff.toISOString(), items,
    pickup_enabled: d.pickup_enabled, delivery_enabled: d.delivery_enabled, time_from: d.time_from, time_to: d.time_to,
    note: d.note.trim() || null, is_open: d.is_open };
  const { error } = d.id ? await sb.from('preorder_days').update(row).eq('id', d.id) : await sb.from('preorder_days').insert(row);
  if (error) return toast(errMsg(error));
  // โพสต์เมนูแล้ว เปิดร้านให้อัตโนมัติ (ถ้าแอดมินอนุมัติแล้ว)
  if (S.shop.status === 'active' && !S.shop.is_open && S.shop.is_preorder) {
    const { error: e2 } = await sb.from('restaurants').update({ is_open: true }).eq('id', S.shop.id);
    if (!e2) S.shop.is_open = true;
  }
  S.sheet = null; await loadDays(); render();
  toast(S.shop.status === 'active' ? '📣 โพสต์เมนูแล้ว ลูกค้าจองได้เลย' : 'บันทึกเมนูแล้ว (ลูกค้าจะเห็นเมื่อแอดมินอนุมัติร้าน)');
}

  if (error) return toast(errMsg(error));

/* ---------------- รูปร้าน (ร้านพรีออเดอร์ใช้รูปเดียว แม่ค้าเลือกได้) ---------------- */
async function onCoverImage(input){
  const f = input.files && input.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)) return toast('กรุณาเลือกไฟล์รูปภาพ');
  if (f.size > 8 * 1024 * 1024) return toast('ไฟล์ใหญ่เกิน 8MB');
  captureSettings(); toast('กำลังอัปโหลดรูปหน้าปก...');
  const path = `${S.user.id}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9.]+/g, '_')}`;
  const { error } = await sb.storage.from('storefront-images').upload(path, f, { contentType: f.type });
  if (error) return toast('อัปโหลดไม่สำเร็จ: ' + errMsg(error));
  const url = sb.storage.from('storefront-images').getPublicUrl(path).data.publicUrl;
  const { error: e2 } = await sb.from('restaurants').update({ storefront_url: url }).eq('id', S.shop.id);
  if (e2) return toast(errMsg(e2));
  S.shop.storefront_url = url; render(); toast('เปลี่ยนรูปหน้าปกแล้ว');
}

/* ---------------- รับเงินโอน (PromptPay) ---------------- */
// เบอร์มือถือ 10 หลัก → tag 01 (0066xxxxxxxxx) · เลขบัตร/ผู้เสียภาษี 13 หลัก → tag 02 · e-Wallet 15 หลัก → tag 03
function promptpayTarget(id){
  const n = String(id || '').replace(/\D/g, '');
  if (/^0\d{9}$/.test(n)) return { tag: '01', value: '0066' + n.slice(1) };
  if (/^\d{13}$/.test(n)) return { tag: '02', value: n };
  if (/^\d{15}$/.test(n)) return { tag: '03', value: n };
  return null;
}
function crc16(str){
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) { crc ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function promptpayPayload(id, amount){
  const t = promptpayTarget(id); if (!t) return null;
  const f = (tag, v) => tag + String(v.length).padStart(2, '0') + v;
  const acct = f('00', 'A000000677010111') + f(t.tag, t.value);
  let p = f('00', '01') + f('01', amount ? '12' : '11') + f('29', acct) + f('58', 'TH') + f('53', '764') + (amount ? f('54', Number(amount).toFixed(2)) : '') + '6304';
  return p + crc16(p);
}
function promptpayQrDataUrl(id){
  const payload = promptpayPayload(id); if (!payload || typeof qrcode !== 'function') return null;
  try { const q = qrcode(0, 'M'); q.addData(payload); q.make(); return q.createDataURL(6, 2); } catch (e) { return null; }
}
async function onPromptpayQr(input){
  const f = input.files && input.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)) return toast('กรุณาเลือกไฟล์รูปภาพ');
  if (f.size > 8 * 1024 * 1024) return toast('ไฟล์ใหญ่เกิน 8MB');
  captureSettings(); toast('กำลังอัปโหลด QR...');
  const path = `${S.user.id}/promptpay_${Date.now()}.${(f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg'}`;
  const { error } = await sb.storage.from('storefront-images').upload(path, f, { contentType: f.type });
  if (error) return toast('อัปโหลดไม่สำเร็จ: ' + errMsg(error));
  S.draft.promptpay_qr_url = sb.storage.from('storefront-images').getPublicUrl(path).data.publicUrl;
  render(); toast('แนบรูป QR แล้ว — กดบันทึกการตั้งค่าด้วย');
}
function removePromptpayQr(){ captureSettings(); S.draft.promptpay_qr_url = ''; render(); }

  const id = $('s-pp-id') ? $('s-pp-id').value : '', box = $('pp-gen');

  box.innerHTML = url ? `<img src="${url}" alt="QR พร้อมเพย์"><div class="hint">ตัวอย่าง QR จากเลขนี้ — ลองสแกนด้วยแอปธนาคารว่าชื่อบัญชีถูก · ตอนลูกค้าจ่าย ระบบใส่ยอดเงินใน QR ให้อัตโนมัติ</div>`
    : (id.replace(/\D/g, '') ? `<div class="hint" style="color:var(--red);">${ok ? 'สร้าง QR ไม่ได้' : 'เลขพร้อมเพย์ไม่ถูกต้อง (มือถือ 10 หลัก / บัตร 13 หลัก)'}</div>` : '');
  box.style.display = box.innerHTML ? 'block' : 'none';
}
function promptpaySectionHtml(d){
  return `<div class="h2">💳 รับเงินโอน (พร้อมเพย์)</div>
  <div class="card" style="margin-top:0;">
    <label class="label" style="margin-top:0;">เบอร์พร้อมเพย์ / เลขบัตรประชาชน</label>

/* ---------------- 📊 ยอดขาย / ออเดอร์ย้อนหลัง ---------------- */
function rangeDates(range){
  const t = new Date(); t.setHours(0,0,0,0);
  const monday = new Date(t); monday.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  if (range === 'week') { const e = new Date(monday); e.setDate(monday.getDate() + 6); return [isoDate(monday), isoDate(e)]; }
  if (range === 'lastweek') { const s = new Date(monday); s.setDate(monday.getDate() - 7); const e = new Date(monday); e.setDate(monday.getDate() - 1); return [isoDate(s), isoDate(e)]; }
  if (range === 'month') return [isoDate(new Date(t.getFullYear(), t.getMonth(), 1)), isoDate(new Date(t.getFullYear(), t.getMonth() + 1, 0))];
  if (range === 'lastmonth') return [isoDate(new Date(t.getFullYear(), t.getMonth() - 1, 1)), isoDate(new Date(t.getFullYear(), t.getMonth(), 0))];
  return [S.report.from || addDays(-30), S.report.to || addDays(0)];
}
function setReportRange(range){
  const r = S.report; r.range = range;
  if (range !== 'custom') [r.from, r.to] = rangeDates(range);
  else if (!r.from) { r.from = addDays(-30); r.to = addDays(0); }
  loadReport();
}
function setReportCustom(){
  const f = $('rp-from').value, t = $('rp-to').value;
  if (!f || !t) return; if (f > t) return toast('วันเริ่มต้องไม่หลังวันสิ้นสุด');
  S.report.from = f; S.report.to = t; loadReport();
}
async function loadReport(){
  const r = S.report;
  if (!r.from) [r.from, r.to] = rangeDates(r.range);
  r.loading = true; if (S.tab === 'report') render();
  const { data, error } = await sb.from('orders')
    .select('id,order_code,status,subtotal,delivery_fee,discount_amount,total,payment_method,payment_status,fulfillment,scheduled_date,scheduled_slot,contact_name,customer_id,created_at,order_items(menu_item_id,name,emoji,qty,price)')
    .eq('restaurant_id', S.shop.id).eq('order_type', 'preorder').gte('scheduled_date', r.from).lte('scheduled_date', r.to)
    .order('scheduled_date', { ascending: false }).order('created_at', { ascending: false }).limit(2000);
  r.loading = false;
  if (error) { toast('โหลดยอดขายไม่สำเร็จ: ' + errMsg(error)); r.orders = []; }
  else {
    r.orders = data || [];
    const ids = [...new Set(r.orders.filter(o => !o.contact_name).map(o => o.customer_id).filter(id => id && !S.customers[id]))];
    if (ids.length) { const { data: cs } = await sb.from('customers').select('id,name,phone').in('id', ids); (cs || []).forEach(c => { S.customers[c.id] = c; }); }
  }
  if (S.tab === 'report') render();
}
function reportStats(){
  const all = S.report.orders || [];
  const live = all.filter(o => o.status !== 'cancelled');
  const sum = (arr, f) => arr.reduce((a, o) => a + Number(f(o) || 0), 0);
  const byDay = {}, byItem = {};
  live.forEach(o => {
    byDay[o.scheduled_date] = byDay[o.scheduled_date] || { total: 0, n: 0 };
    byDay[o.scheduled_date].total += Number(o.total || 0); byDay[o.scheduled_date].n++;
    (o.order_items || []).forEach(i => {
      const k = i.menu_item_id || i.name;
      byItem[k] = byItem[k] || { name: i.name, emoji: i.emoji || '', qty: 0 };
      byItem[k].qty += Number(i.qty || 0);
    });
  });
  const cash = live.filter(o => o.payment_method !== 'promptpay'), pp = live.filter(o => o.payment_method === 'promptpay');
  return {
    all, live, cancelled: all.length - live.length,
    total: sum(live, o => o.total), fee: sum(live, o => o.delivery_fee), discount: sum(live, o => o.discount_amount),
    done: live.filter(o => o.status === 'delivered'),
    cash: sum(cash, o => o.total), cashN: cash.length, pp: sum(pp, o => o.total), ppN: pp.length,
    ppUnverified: pp.filter(o => o.payment_status !== 'verified'),
    pickupN: live.filter(o => o.fulfillment === 'pickup').length, deliN: live.filter(o => o.fulfillment !== 'pickup').length,
    days: Object.keys(byDay).sort().map(d => ({ d, ...byDay[d] })),
    items: Object.values(byItem).sort((a, b) => b.qty - a.qty),
  };
}

    prep[key] = prep[key] || { name: i.name, emoji: i.emoji || '', opt: optText(i.selected_options), qty: 0 };
    prep[key].qty += Number(i.qty || 0);

  let listHtml;

  } else {
    const sec = (title, arr) => arr.length ? `<div class="slot-title">${title} · ${arr.length} ออเดอร์</div>${arr.map(orderCardHtml).join('')}` : '';

             + sec('🛵 ส่งถึงบ้าน · ไรเดอร์ kohlarngo', list.filter(o => o.fulfillment !== 'pickup'));
  }
  return `<div class="h2">ออเดอร์จอง<small>${S.dateFilter === 'all' ? '' : dayText(S.dateFilter)}</small></div>
    <div class="chips">${chips}</div>${stats}${prepHtml}${listHtml}<div style="height:20px"></div>`;

          <input type="checkbox" data-day-item="${m.id}" ${d.picked[m.id] !== undefined ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--primary);">
          <span style="min-width:0;"><b style="font-size:14px;">${esc(m.emoji || '')} ${esc(m.name)}</b><br><span class="o-muted" style="font-size:12px;">${priceText(m)}</span></span>
        </label>
        <input class="input lim" id="lim-${m.id}" type="number" min="0" inputmode="numeric" placeholder="ไม่จำกัด" value="${esc(d.picked[m.id] || '')}">
      </div>`).join('') : `<div class="hint">ยังไม่มีเมนูในร้าน</div>`}
    <button class="btn ghost full" style="margin-top:8px;" onclick="addMenuFromDay()">＋ เพิ่มเมนูใหม่</button>

    <label class="label">วันนี้ให้ลูกค้ารับอาหารแบบไหน (เลือก 1 แบบ)</label>
    ${(() => { const cur = d.delivery_enabled ? 'delivery' : 'pickup'; const opt = (v, t, sub) => `
      <label class="mode-opt ${cur === v ? 'on' : ''}"><input type="radio" name="d-mode" value="${v}" ${cur === v ? 'checked' : ''} onchange="captureDayForm();render()"><span><b>${t}</b><small>${sub}</small></span></label>`;
      return opt('pickup', '🏠 ลูกค้ามารับที่ร้าน', 'ไม่มีบริการส่ง') + opt('delivery', '🛵 ส่งถึงบ้าน (ไรเดอร์ kohlarngo)', feeText()); })()}
    <div class="hint">ค่าส่ง/โซนส่ง ตั้งได้ที่ ⚙️ ตั้งค่า → ส่งถึงบ้าน · ค่าส่งเป็นค่าจ้างไรเดอร์</div>

    <label class="label">เวลารับ/ส่ง (ลูกค้าเลือกเวลาในช่วงนี้)</label>
    <div class="row"><input class="input" type="time" id="d-from" value="${esc(d.time_from)}"><span>ถึง</span><input class="input" type="time" id="d-to" value="${esc(d.time_to)}"></div>

    <label class="label">ปิดรับจอง</label>
    <div class="row"><input class="input" type="date" id="d-cut-date" value="${esc(d.cutoff_date)}"><input class="input" type="time" id="d-cut-time" value="${esc(d.cutoff_time)}"></div>

    <label class="label">ข้อความถึงลูกค้า (ถ้ามี)</label>
    <textarea class="input" id="d-note" placeholder="เช่น ทำสดตอนเช้า รูปเป็นภาพประกอบ">${esc(d.note)}</textarea>

    <button class="btn full" style="margin-top:16px;" onclick="saveDay()">${d.id ? '💾 บันทึก' : '📣 โพสต์เมนู เปิดรับจอง'}</button>
    ${d.id ? `<button class="btn danger full" style="margin-top:8px;" onclick="deleteDay('${d.id}')">ลบเมนูวันนี้</button>` : ''}
  </div>`;
}
function postSheetHtml(){
  return `<div class="sheet">
    <div class="sheet-title"><h2>ข้อความโพสต์</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="hint">กดค้างที่ข้อความ เลือกทั้งหมด แล้วคัดลอกไปวางใน Facebook</div>
    <textarea class="input" style="min-height:320px;margin-top:8px;" readonly onclick="this.select()">${esc(S.sheet.data.text)}</textarea>
  </div>`;
}

/* ---------- เมนูร้าน ---------- */
function menuHtml(){
  const groups = {};
  S.menu.forEach(m => { (groups[m.group_name || 'เมนู'] = groups[m.group_name || 'เมนู'] || []).push(m); });
  const body = S.menu.length ? Object.keys(groups).map(g => `<div class="group-label">${esc(g)}</div>${groups[g].map(m => `
    <div class="card"><div class="menu-row">
      <div class="menu-thumb" style="${m.image_url ? `background-image:url('${esc(m.image_url)}')` : ''}">${m.image_url ? '' : esc(m.emoji || '🍱')}</div>
      <div class="menu-info" onclick="openMenuEditor('${m.id}')" style="cursor:pointer;">
        <div class="menu-name" style="${m.is_available === false ? 'opacity:.5;' : ''}">${esc(m.name)}</div>
        <div class="menu-price">${priceText(m)}</div>
        <div class="hint" style="margin-top:2px;">${m.is_available === false ? 'ปิดขาย' : 'มีขาย'} · แตะเพื่อแก้ไข</div>
      </div>
      <label class="switch"><input type="checkbox" ${m.is_available !== false ? 'checked' : ''} onchange="toggleAvailable('${m.id}', this.checked)"><span></span></label>
    </div></div>`).join('')}`).join('')
    : `<div class="empty"><div class="e">🍱</div><h3>ยังไม่มีเมนู</h3><p>เพิ่มเมนูทั้งหมดของร้านไว้ที่นี่ แล้วเลือกว่าวันไหนขายอะไรในหน้า 📣 โพสต์เมนู</p></div>`;
  return `<div class="h2">เมนูของร้าน<button class="btn small" onclick="openMenuEditor()">+ เพิ่มเมนู</button></div>${body}<div style="height:20px"></div>`;
}
function menuSheetHtml(){
  const d = S.sheet.data;
  return `<div class="sheet">
    <div class="sheet-title"><h2>${d.id ? 'แก้ไขเมนู' : 'เพิ่มเมนู'}</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="row" style="margin-top:10px;">
      <div class="menu-thumb" style="width:72px;height:72px;${d.image_url ? `background-image:url('${esc(d.image_url)}')` : ''}">${d.image_url ? '' : esc(d.emoji || '🍱')}</div>
      <label class="btn ghost" style="text-align:center;">📷 ${d.image_url ? 'เปลี่ยนรูป' : (d.is_custom_request ? 'เพิ่มรูปโลโก้/หน้าปก' : 'เพิ่มรูปเมนู')}<input type="file" accept="image/*" style="display:none" onchange="onMenuImage(this)"></label>
    </div>
    ${d.is_custom_request ? `<div class="hint">รูปนี้คือรูปปกติของเมนู (เช่น โลโก้ KFC) แสดงในรายการเมนู</div>` : ''}
    <div class="set-row card" style="margin:12px 0 0;">
      <div><b>🛍️ สินค้าฝากซื้อ</b><div class="hint">ไม่รู้ราคาแน่นอน เช่น ฝากซื้อ KFC — ใส่รูปเมนู/รูปสินค้า ลูกค้าพิมพ์บอกว่าเอาชุดไหน แล้วแม่ค้าแจ้งยอดจริงทีหลัง</div></div>
      <label class="switch"><input type="checkbox" ${d.is_custom_request ? 'checked' : ''} onchange="setCustomMode(this.checked)"><span></span></label>
    </div>
    <label class="label">ชื่อเมนู *</label><input class="input" id="m-name" value="${esc(d.name)}" placeholder="${d.is_custom_request ? 'เช่น ฝากซื้อ KFC' : 'เช่น มัสมั่นไก่'}">
    ${d.is_custom_request ? `
    <label class="label">รูปเมนูของร้าน * <span style="font-weight:500;">(สูงสุด 2 รูป — ลูกค้าดูแล้วพิมพ์บอกว่าเอาชุดไหน)</span></label>
    <div class="mp-grid">
      ${(d.menu_photo_urls || []).map((u, i) => `<div class="mp-item" style="background-image:url('${esc(u)}')"><button onclick="removeMenuPhoto(${i})">✕</button></div>`).join('')}
      ${(d.menu_photo_urls || []).length < 2 ? `<label class="mp-add">＋<br>เพิ่มรูปเมนู<input type="file" accept="image/*" style="display:none" onchange="onMenuPhoto(this)"></label>` : ''}
    </div>
    <label class="label">ค่าบริการฝากซื้อ (บาท ต่อชุด) <span style="font-weight:500;">— แม่ค้ากรอกเอง · 0 = ไม่คิด</span></label>
    <input class="input" id="m-fee" type="number" inputmode="decimal" min="0" value="${esc(d.service_fee ?? '')}" placeholder="เช่น 20">
    <div class="hint">ลูกค้าจ่ายค่าบริการตอนจอง · ราคาสินค้าแสดงเป็น "ราคาตามจริง" แม่ค้าแจ้งยอดจริงทีหลังในหน้าออเดอร์</div><div style="display:none;">` : ''}
    <div class="row">
      <div style="flex:1;"><label class="label">ราคา *</label><input class="input" id="m-price" type="number" inputmode="decimal" min="0" value="${esc(d.price)}" placeholder="30"></div>
      <div style="flex:1;"><label class="label">ราคาพิเศษ (ถ้ามี)</label><input class="input" id="m-big" type="number" inputmode="decimal" min="0" value="${esc(d.bigPrice)}" placeholder="50"></div>
      <div style="width:70px;"><label class="label">อีโมจิ</label><input class="input" id="m-emoji" value="${esc(d.emoji || '')}" maxlength="4" style="text-align:center;"></div>
    </div>
    <div class="hint">มี 2 ขนาด เช่น "30/50" ใส่ราคาพิเศษ 50 — ลูกค้าจะเลือกขนาดตอนสั่ง</div>
    ${d.is_custom_request ? `</div>` : ''}
    <label class="label">หมวดในร้าน</label><input class="input" id="m-group" value="${esc(d.group_name || MENU_GROUP)}" readonly disabled style="background:var(--surface-2);color:var(--text-muted);">
    <label class="label">รายละเอียด</label><textarea class="input" id="m-desc" placeholder="เช่น ถุงละ / กล่องละ, เผ็ดน้อย">${esc(d.description || '')}</textarea>
    <button class="btn full" style="margin-top:16px;" onclick="saveMenu()">บันทึกเมนู</button>
    ${d.id ? `<button class="btn danger full" style="margin-top:8px;" onclick="deleteMenu('${d.id}')">ลบเมนูนี้</button>` : ''}
  </div>`;
}
function slipSheetHtml(){
  const d = S.sheet.data;
  return `<div class="sheet">
    <div class="sheet-title"><h2>สลิป #${esc(d.code)}</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="hint">ยอดที่ต้องได้รับ <b style="color:var(--text);">${money(d.total)}</b></div>
    <img class="slip-img" src="${esc(d.url)}" alt="สลิปโอนเงิน">
    ${(() => { const o = S.orders.find(x => x.id === d.id); const p = o && payState(o);
      if (!o || o.status === 'cancelled' || p === 'verified') return p === 'verified' ? '<div class="pay verified" style="margin-top:12px;">✅ ยืนยันแล้วว่าเงินเข้า</div>' : '';
      return `<div class="hint" style="margin-top:12px;">เปิดแอปธนาคารเช็กว่ามียอด ${money(d.total)} เข้าจริง — สลิปปลอมทำได้ง่าย อย่าดูแค่รูป</div>
      <div class="o-actions"><button class="btn green" onclick="verifyPayment('${o.id}')">✅ เงินเข้าแล้ว</button><button class="btn danger" style="flex:1;" onclick="openPayReject('${o.id}')">❌ สลิปไม่ถูกต้อง</button></div>`; })()}
  </div>`;
}
function payRejectSheetHtml(){
  const d = S.sheet.data;
  return `<div class="sheet">
    <div class="sheet-title"><h2>สลิปไม่ถูกต้อง #${esc(d.code)}</h2><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="hint">ลูกค้าจะเห็นข้อความนี้ และส่งสลิปใหม่ได้ · ออเดอร์ยังไม่ถูกยกเลิก</div>
    <label class="label">เหตุผล</label>
    <div class="reason-chips">${PAY_REJECT_REASONS.map(r => `<button onclick="$('pr-note').value=this.textContent">${esc(r)}</button>`).join('')}</div>
    <textarea class="input" id="pr-note" style="margin-top:8px;" placeholder="เช่น ยอดโอน 100 แต่ต้องโอน ${esc(money(d.total))}">${esc(d.note)}</textarea>
    <button class="btn danger full" style="margin-top:14px;padding:12px;" onclick="submitPayReject()">ส่งแจ้งลูกค้า</button>
  </div>`;
}

/* ---------- ตั้งค่า ---------- */
function settingsHtml(){
  ensureDraft();
  const d = S.draft;
  return `
  ${photoSectionHtml()}
  ${promptpaySectionHtml(d)}
  <div class="h2">การรับอาหาร</div>
  <div class="card" style="margin-top:0;">
    <div class="set-row"><div><b>🏠 ลูกค้ามารับเองที่ร้าน</b></div><label class="switch"><input type="checkbox" id="s-pickup" ${d.pickup_enabled ? 'checked' : ''}><span></span></label></div>
    <label class="label">จุดรับอาหาร / บอกทางไปร้าน</label>
    <input class="input" id="s-pickloc" value="${esc(d.pickup_location)}" placeholder="เช่น ร้านอยู่ทางไปหาดตายาย">
  </div>
  <div class="card">
    <div class="set-row"><div><b>🛵 ส่งถึงบ้าน</b><div class="hint" style="margin-top:2px;">จัดส่งโดยไรเดอร์ kohlarngo — วันส่งกด "เรียกไรเดอร์" ที่ออเดอร์ ค่าส่งที่ตั้งด้านล่างเป็นค่าจ้างไรเดอร์</div></div><label class="switch"><input type="checkbox" id="s-delivery" ${d.delivery_enabled ? 'checked' : ''}><span></span></label></div>
    <label class="label">โซนส่ง + ยอดขั้นต่ำ</label>
    ${d.zones.map((z, i) => `<div class="zone-row">
      <input class="input" id="z-name-${i}" value="${esc(z.name)}" placeholder="ชื่อโซน เช่น ลงหาด">
      <input class="input" id="z-min-${i}" type="number" min="0" value="${esc(z.min)}" placeholder="ขั้นต่ำ">
      <input class="input" id="z-fee-${i}" type="number" min="0" value="${esc(z.fee)}" placeholder="ค่าส่ง">
      <button class="x" onclick="removeZone(${i})">✕</button></div>`).join('')}
    ${d.zones.length ? '<div class="hint">ช่อง: ชื่อโซน · ขั้นต่ำ (บาท) · ค่าส่ง (บาท, 0 = ส่งฟรี)</div>' : '<div class="hint">ยังไม่มีโซน — ส่งได้ทุกที่ในรัศมี 6 กม. ไม่มีขั้นต่ำ</div>'}
    <button class="btn ghost full" style="margin-top:8px;" onclick="addZone()">＋ เพิ่มโซน (เช่น ในหมู่บ้าน 50 / ลงหาด 100 / หาดแสม 150)</button>
    ${d.zones.length ? '' : `<label class="label">ค่าส่ง (บาท)</label><input class="input" id="s-fee" type="number" min="0" value="${esc(d.preorder_delivery_fee)}">`}
  </div>

  <div class="h2">ค่าเริ่มต้นตอนโพสต์เมนู</div>
  <div class="card" style="margin-top:0;">
    <label class="label" style="margin-top:0;">เวลารับ/ส่ง</label>
    <div class="row"><input class="input" type="time" id="s-from" value="${esc(d.serve_time_from)}"><span>ถึง</span><input class="input" type="time" id="s-to" value="${esc(d.serve_time_to)}"></div>
    <label class="label">ปิดรับจอง (คืนก่อนวันขาย)</label>
    <input class="input" type="time" id="s-cutoff" value="${esc(d.preorder_cutoff)}">
  </div>

  <div class="h2">ข้อมูลร้าน</div>
  <div class="card" style="margin-top:0;">

    <label class="label">ชื่อร้าน</label><input class="input" id="s-name" value="${esc(d.name)}">
    <label class="label">เบอร์โทรร้าน (ลูกค้ากดโทรหาได้)</label><input class="input" id="s-phone" inputmode="tel" value="${esc(d.phone)}">
    <label class="label">หมวดหมู่</label><select class="input" id="s-cat">${CATEGORIES.map(c => `<option value="${c.id}" ${c.id === d.category ? 'selected' : ''}>${c.label}</option>`).join('')}</select>
    <label class="label">ที่อยู่ร้าน</label><textarea class="input" id="s-addr">${esc(d.address)}</textarea>
    <label class="label">ตำแหน่งร้าน (ใช้นำทางลูกค้ามารับ และคำนวณเขตส่ง)</label>
    <button class="btn ghost full" onclick="captureSettings();grabPin()">📍 ${d.lat ? `(${Number(d.lat).toFixed(5)}, ${Number(d.lng).toFixed(5)}) — ปักใหม่ที่ตำแหน่งปัจจุบัน` : 'ปักหมุดที่ตำแหน่งปัจจุบัน (ยืนที่ร้าน)'}</button>
  </div>
  <div style="padding:16px;">
    <button class="btn full" ${S.busy ? 'disabled' : ''} onclick="saveSettings()">${S.busy ? 'กำลังบันทึก...' : '💾 บันทึกการตั้งค่า'}</button>
  </div>
  <div class="h2">🔑 เปลี่ยนรหัสผ่าน</div>
  <div class="card" style="margin-top:0;">
    <label class="label" style="margin-top:0;">รหัสผ่านใหม่</label><input class="input" id="pw-new" type="password" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร">
    <label class="label">ยืนยันรหัสผ่านใหม่</label><input class="input" id="pw-new2" type="password" autocomplete="new-password">
    <div class="hint">ถ้าแอดมินเพิ่งรีเซ็ตรหัสให้ ควรเปลี่ยนเป็นรหัสของตัวเองทันที</div>
    <button class="btn ghost full" id="pw-btn" style="margin-top:10px;" onclick="changePassword()">🔑 เปลี่ยนรหัสผ่าน</button>
  </div>
  <div style="padding:16px;">
    <button class="btn ghost full" onclick="logout()">ออกจากระบบ</button>
  </div>`;
}

boot();
</script>
</body>
