<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — อิ่มด่วน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#F7F5F0; --text:#1D1B18; --text-muted:#726B60;
    --primary:#2E4B3C; --primary-ink:#FFFFFF; --accent:#DD3B1F; --gold:#C99A3B; --green:#3F8C4A; --red:#C0392B;
    --border:#E4E0D6; --shadow:0 1px 2px rgba(29,27,24,.06); --radius-s:8px; --radius-m:14px; --radius-l:22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#14120F; --surface:#1E1B17; --surface-2:#252119; --text:#F1ECE3; --text-muted:#AFA593; --primary:#5FBE93; --primary-ink:#0E1512; --accent:#FF6A3D; --gold:#E3B65C; --green:#6FCB7A; --red:#E05B4E; --border:#332E27; color-scheme: dark; }
  }
  :root[data-theme="dark"]{ --bg:#14120F; --surface:#1E1B17; --surface-2:#252119; --text:#F1ECE3; --text-muted:#AFA593; --primary:#5FBE93; --primary-ink:#0E1512; --accent:#FF6A3D; --gold:#E3B65C; --green:#6FCB7A; --red:#E05B4E; --border:#332E27; color-scheme: dark; }

  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans Thai',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Archivo Black','Noto Sans Thai',sans-serif;font-weight:400;margin:0;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;}

  .shell{display:flex;min-height:100vh;}
  .sidebar{width:236px;flex-shrink:0;background:var(--primary);color:var(--primary-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:transform .25s ease;z-index:80;}
  .sidebar-close{display:none;}
  .hamburger-btn{display:none;border:none;background:var(--surface);width:36px;height:36px;border-radius:10px;box-shadow:var(--shadow);font-size:16px;align-items:center;justify-content:center;flex-shrink:0;color:var(--text);}
  .sidebar-backdrop{display:none;}
  @media (max-width:880px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.25);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-close{display:flex;margin-left:auto;border:none;background:rgba(255,255,255,.14);width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;color:#fff;}
    :root[data-theme="dark"] .sidebar-close{ background:rgba(0,0,0,.14); color:#0E1512; }
    .hamburger-btn{display:flex;}
    .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;}
    .sidebar-backdrop.show{display:block;}
    .topbar{padding:16px 16px;}
    .content{padding:16px 16px 60px;}
  }
  @media (max-width:520px){
    .stats-row{grid-template-columns:1fr 1fr;gap:10px;}
    .topbar h1{font-size:17px;}
  }
  .side-logo{display:flex;align-items:center;gap:9px;padding:22px 20px 18px;}
  .logo-mark{width:32px;height:32px;border-radius:9px;background:var(--gold);color:#241B15;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black';font-size:15px;flex-shrink:0;}
  .logo-text{font-family:'Archivo Black';font-size:15px;}
  .logo-sub{font-size:10px;opacity:.7;font-weight:600;}
  .side-nav{padding:8px 12px;flex:1;display:flex;flex-direction:column;gap:2px;}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.72);border:none;background:none;text-align:left;width:100%;}
  :root[data-theme="dark"] .side-link{ color:rgba(0,0,0,.62); }
  .side-link .ic{font-size:16px;width:18px;text-align:center;}
  .side-link.active{background:rgba(255,255,255,.14);color:#fff;}
  :root[data-theme="dark"] .side-link.active{ background:rgba(0,0,0,.14); color:#0E1512; }
  .side-link .badge{margin-left:auto;background:var(--gold);color:#241B15;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;}
  .side-foot{padding:14px 18px;font-size:10.5px;opacity:.6;border-top:1px solid rgba(255,255,255,.12);}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:20px;}
  .topbar .sub{font-size:12px;color:var(--text-muted);margin-top:3px;}
  .content{padding:22px 28px 60px;}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  @media (max-width:920px){.stats-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;}
  .stat-card .lbl{font-size:12px;color:var(--text-muted);font-weight:600;}
  .stat-card .val{font-size:23px;font-family:'Archivo Black';margin-top:6px;}
  .stat-card .delta{font-size:11.5px;margin-top:4px;font-weight:700;color:var(--green);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);}
  .detail-overlay{position:fixed;inset:0;background:rgba(15,20,23,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
  .detail-modal{background:var(--bg);width:100%;max-width:520px;max-height:86vh;overflow-y:auto;border-radius:16px;padding:20px;}
  .detail-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .detail-close{border:none;background:var(--surface-2);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;}
  .detail-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .detail-row .lbl{color:var(--text-muted);flex-shrink:0;}
  .detail-row .val{text-align:right;font-weight:600;}
  .detail-section{font-size:12.5px;font-weight:800;color:var(--primary);margin:16px 0 4px;}
  .detail-img{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px;}
  .btn-doc{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--primary);padding:9px;border-radius:8px;font-weight:700;font-size:12px;margin-top:8px;cursor:pointer;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
  .panel-head h2{font-size:15px;}
  .two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;}
  @media (max-width:920px){.two-col{grid-template-columns:1fr;}}

  .chart-row{display:flex;align-items:flex-end;gap:10px;height:150px;padding:18px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .bar{width:100%;max-width:30px;background:linear-gradient(180deg,var(--gold),var(--primary));border-radius:6px 6px 3px 3px;}
  .bar-lbl{font-size:10.5px;color:var(--text-muted);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;color:var(--text-muted);font-weight:700;padding:10px 18px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 18px;border-bottom:1px solid var(--border);font-size:12.8px;vertical-align:middle;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .name-cell{display:flex;align-items:center;gap:9px;}
  .avatar-sm{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;display:inline-block;}
  .tag.active{background:rgba(63,140,74,.15);color:var(--green);}
  .tag.pending{background:rgba(201,154,59,.18);color:var(--gold);}
  .tag.rejected{background:rgba(192,57,43,.10);color:var(--red);border:1px dashed rgba(192,57,43,.4);}
  .reject-note{margin-top:6px;font-size:11.5px;color:var(--red);font-weight:600;}
  .temp-pw{font-size:20px;font-weight:800;letter-spacing:2px;background:var(--surface-2);padding:6px 12px;border-radius:8px;display:inline-block;margin:4px 0;font-family:monospace;}
  .tag.suspended{background:rgba(192,57,43,.14);color:var(--red);}
  .tag.online{background:rgba(63,140,74,.15);color:var(--green);}
  .tag.offline{background:var(--surface-2);color:var(--text-muted);}
  .btn-mini{border:none;padding:6px 11px;border-radius:7px;font-size:11.5px;font-weight:700;margin-right:5px;}
  .btn-mini.approve{background:var(--green);color:#fff;}
  .btn-mini.suspend{background:rgba(192,57,43,.12);color:var(--red);}
  .btn-mini.outline{background:var(--surface-2);border:1px solid var(--border);color:var(--text);}

  .table-scroll{overflow-x:auto;}

  .filter-row{display:flex;gap:8px;padding:14px 18px 0;}
  .filt{border:1px solid var(--border);background:var(--surface-2);padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--text-muted);}
  .filt.active{background:var(--text);color:var(--bg);border-color:var(--text);}

  .form-grid{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:920px){.form-grid{grid-template-columns:1fr;}}
  .f-group label{font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;}
  .f-group input{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);font-family:inherit;}
  .btn-primary{background:var(--primary);color:var(--primary-ink);border:none;padding:9px 16px;border-radius:999px;font-weight:700;font-size:12.5px;}

  .f-group select,.f-sel{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);font-family:inherit;}
  .rank-sel{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--text);}
  .rank-sel.on{background:var(--gold);color:#241B15;border-color:var(--gold);}
  .shop-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:220px;overflow-y:auto;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);}
  .shop-checks label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text);margin:0;}
  .menu-row-a{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.8px;}
  .menu-row-a img,.menu-row-a .avatar-sm{width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0;}
  .kind-switch{display:flex;gap:8px;padding:16px 28px 0;flex-wrap:wrap;}
  @media (max-width:880px){.kind-switch{padding:12px 16px 0;}}
  .kind-switch button{flex:1;min-width:150px;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;font-size:14px;font-weight:800;color:var(--text-muted);}
  .kind-switch button b{display:inline-block;margin-left:6px;background:var(--surface-2);color:var(--text);border-radius:999px;padding:1px 9px;font-size:12px;}
  .kind-switch button.on{border-color:var(--primary);color:var(--primary);background:var(--surface-2);}
  .shop-checks input[type=checkbox]{width:auto;padding:0;margin:0;flex-shrink:0;}
  .chk-title{grid-column:1/-1;font-size:11.5px;font-weight:800;color:var(--primary);margin-top:4px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* Supabase Configuration (safe init) */
const SUPABASE_URL = 'https://onvrqsyoykopwjunvrhr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v2MCVFaUm-1s6xD6og_eKg_S1vBU4SF';
let supabaseClient = null;
try {
  if (SUPABASE_KEY.indexOf('นำ_ANON_PUBLIC_KEY') === -1 && typeof window.supabase !== 'undefined') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (err) { console.warn('Supabase Init Error:', err); }
const dataSource = supabaseClient ? 'supabase' : 'mock';

let activePage = 'overview';
let restFilter = 'all';
let sidebarOpen = false;
let loading = true;
let realtimeChannel = null;
let activeDetail = null; // { type: 'restaurant'|'rider', id }
function openDetail(type, id){ activeDetail = { type, id }; render(); }
function closeDetail(){ activeDetail = null; render(); }
async function viewPrivateDoc(path){
  if (!path) { showToast('ยังไม่มีเอกสารนี้'); return; }
  try {
    const { data, error } = await supabaseClient.storage.from('verification-docs').createSignedUrl(path, 300);
    if (error) throw error;
    window.open(data.signedUrl, '_blank');
  } catch (err) { console.error(err); showToast('เปิดเอกสารไม่สำเร็จ'); }
}
function mapsLink(lat, lng){ return `https://www.google.com/maps?q=${lat},${lng}`; }
let adminView = 'loading'; // loading | auth | denied | dashboard
let currentAdminEmail = null;

let gmvWeek = [];
let restaurants = [];
let riders = [];
let users = [];
let platformOrders = [];
let commissionRate = 20;
let appLogoUrl = null;
let minDeliveryFee = 15;
let todayOrdersCount = 0;

/* ============ MOCK DATA (fallback เมื่อยังไม่เชื่อม Supabase) ============ */
const MOCK_GMV = [{d:'จ',v:82000},{d:'อ',v:91000},{d:'พ',v:87500},{d:'พฤ',v:104000},{d:'ศ',v:128000},{d:'ส',v:156000},{d:'อา',v:141000}];
const MOCK_RESTAURANTS = [
  {id:'r1', name:'ส้มตำแซ่บนัว', cat:'ส้มตำ/อีสาน', status:'active', rating:4.7, orders:1204, emoji:'🥗'},
  {id:'r5', name:'พิซซ่า อิตาเลียนโน', cat:'พิซซ่า/พาสต้า', status:'suspended', rating:4.1, orders:210, emoji:'🍕'},
  {id:'r6', name:'ครัวป้านิด ตามสั่ง', cat:'อาหารไทย', status:'pending', rating:0, orders:0, emoji:'🍳'},
];
const MOCK_RIDERS = [
  {id:'d1', name:'เอกชัย ใจดี', status:'online', trips:1842, rating:4.9, todayTrips:6},
  {id:'d5', name:'ปรีชา ใหม่ล่าสุด', status:'pending', trips:0, rating:0, todayTrips:0},
];
const MOCK_USERS = [{id:'u1', name:'สมชาย ใจงาม', joined:'ม.ค. 2025', orders:48, spent:8420}];
const MOCK_ORDERS = [{id:'OD10231', rest:'ครัวไทยแท้ ป้าอำนวย', cust:'สมชาย ใจงาม', total:186, status:'delivered', date:'16 ก.ย. 14:22'}];

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),1700);
}

/* ============ AUTH / INIT ============ */
async function init(){
  if (dataSource === 'mock') {
    gmvWeek = MOCK_GMV; restaurants = MOCK_RESTAURANTS; riders = MOCK_RIDERS; users = MOCK_USERS; platformOrders = MOCK_ORDERS;
    loading = false; adminView = 'dashboard'; render(); return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { loading = false; adminView = 'auth'; render(); return; }
  await checkAdminAndLoad(session.user);
}
async function checkAdminAndLoad(user){
  try {
    const { data, error } = await supabaseClient.from('admins').select('*').eq('id', user.id).maybeSingle();
    if (error) throw error;
    if (!data) { await supabaseClient.auth.signOut(); adminView = 'denied'; loading = false; render(); return; }
    currentAdminEmail = user.email;
    await refreshAll();
    loading = false; adminView = 'dashboard'; render();
    subscribeRealtime();
  } catch (err) {
    console.error(err); loading = false; adminView = 'auth'; render();
    showToast('เกิดข้อผิดพลาด ลองใหม่อีกครั้ง');
  }
}
async function doAdminLogin(){
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;
  if (!email || !password) { showToast('กรอกอีเมลและรหัสผ่าน'); return; }
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    loading = true; render();
    await checkAdminAndLoad(data.user);
  } catch (err) { console.error(err); showToast('เข้าสู่ระบบไม่สำเร็จ: ' + (err.message||'')); }
}
async function doAdminLogout(){
  if (realtimeChannel) { supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
  await supabaseClient.auth.signOut();
  adminView = 'auth'; currentAdminEmail = null;
  render();
}
function authHtml(){
  return `
  <div style="max-width:380px;margin:80px auto;padding:0 20px;">
    <div class="panel">
      <div class="panel-head"><h2>เข้าสู่ระบบแอดมิน</h2></div>
      <div class="form-grid" style="grid-template-columns:1fr;">
        <div class="f-group"><label>อีเมล</label><input id="admin-email" type="email" placeholder="admin@imduan.co.th"></div>
        <div class="f-group"><label>รหัสผ่าน</label><input id="admin-password" type="password" placeholder="รหัสผ่าน"></div>
      </div>
      <div style="padding:0 18px 18px"><button class="btn-primary" onclick="doAdminLogin()" style="width:100%;">เข้าสู่ระบบ</button></div>
    </div>
    <p style="font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:14px;">บัญชีแอดมินต้องถูกเพิ่มไว้ล่วงหน้าในฐานข้อมูล (ตาราง admins) เท่านั้น ดูวิธีใน migration_auth.sql</p>
  </div>`;
}
function deniedHtml(){
  return `
  <div style="max-width:380px;margin:80px auto;padding:0 20px;text-align:center;">
    <div style="font-size:44px;">🚫</div>
    <h2 style="font-size:17px;margin-top:10px;">บัญชีนี้ไม่มีสิทธิ์แอดมิน</h2>
    <p style="font-size:12.5px;color:var(--text-muted);margin-top:8px;">ติดต่อผู้ดูแลระบบเพื่อเพิ่มบัญชีนี้ในตาราง admins</p>
    <button class="btn-primary" style="margin-top:14px;" onclick="adminView='auth';render()">กลับไปเข้าสู่ระบบ</button>
  </div>`;
}
async function refreshAll(){
  refreshResetRequests().then(() => render());
  await Promise.all([refreshRestaurants(), refreshRiders(), refreshUsers(), refreshOrders(), refreshSettings(), refreshTodayOrdersCount(), refreshPromos(), refreshAllMenuItems(), refreshPromoCodes()]);
  await computeGmvWeekFromDb();
}

let promoCodes = [];
async function refreshPromoCodes(){
  try {
    const { data, error } = await supabaseClient.from('promo_codes').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    promoCodes = data || [];
  } catch (err) { console.warn('refreshPromoCodes failed', err); }
}

let promoBanners = [];
async function refreshPromos(){
  try {
    const { data, error } = await supabaseClient.from('promo_banners').select('*').order('sort_order', { ascending: true });
    if (error) throw error;
    promoBanners = data || [];
  } catch (err) { console.warn('refreshPromos failed', err); }
}
let allMenuItems = [];
async function refreshAllMenuItems(){
  try {
    const { data, error } = await supabaseClient
      .from('menu_items')
      .select('id,name,price,emoji,image_url,is_available,restaurant_id,group_name,description,restaurants(name)')
      .order('name', { ascending: true });
    if (error) throw error;
    allMenuItems = (data || []).map(m => ({ ...m, restaurantName: m.restaurants ? m.restaurants.name : '-' }));
  } catch (err) { console.warn('refreshAllMenuItems failed', err); }
}

function isPre(r){ return !!(r && r.raw && r.raw.is_preorder); }
let preDays = [];
async function refreshPreDays(){
  try {
    const t = new Date(); const today = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    const { data, error } = await supabaseClient.from('preorder_days').select('id,restaurant_id,serve_date,cutoff_at,is_open,items,pickup_enabled,delivery_enabled,time_from,time_to').gte('serve_date', today).order('serve_date');
    if (error) throw error; preDays = data || [];
  } catch (err) { console.warn('refreshPreDays failed', err); }

async function refreshRestaurants(){

async function refreshUsers(){
  try {
    const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    const { data: ord } = await supabaseClient.from('orders').select('customer_id,total').eq('status','delivered');
    const agg = {}; (ord||[]).forEach(o=>{ if (!o.customer_id) return; if (!agg[o.customer_id]) agg[o.customer_id]={orders:0,spent:0}; agg[o.customer_id].orders++; agg[o.customer_id].spent+=Number(o.total||0); });
    users = (data||[]).map(u => ({
      id:u.id, name:u.name||'ลูกค้าอิ่มด่วน',
      joined:new Date(u.created_at).toLocaleDateString('th-TH',{month:'short',year:'numeric'}),
      orders:(agg[u.id]?agg[u.id].orders:0), spent:(agg[u.id]?agg[u.id].spent:0),
    }));
  } catch (err) { console.warn('refreshUsers failed', err); }
}
async function refreshOrders(){
  try {
    const { data, error } = await supabaseClient
      .from('orders')
      .select('id,order_code,status,total,created_at,is_self_delivery,restaurants(name),customers(name)')
      .order('created_at', { ascending: false }).limit(60);
    if (error) throw error;
    platformOrders = (data||[]).map(o => ({
      id:o.order_code, rawId:o.id, rest:o.restaurants?o.restaurants.name:'-', cust:o.customers?o.customers.name:'-',

function mapDbStatusToAdmin(s){
  if (s==='delivered') return 'delivered';
  if (s==='cancelled') return 'cancelled';
  if (s==='pending') return 'searching';
  if (s==='preparing') return 'preparing';
  return 'on_the_way'; // ready, picked_up
}

async function refreshTodayOrdersCount(){
  try {
    const start = new Date(); start.setHours(0,0,0,0);
    const { count, error } = await supabaseClient.from('orders').select('id', { count:'exact', head:true }).gte('created_at', start.toISOString());
    if (error) throw error;
    todayOrdersCount = count||0;
  } catch (err) { console.warn('refreshTodayOrdersCount failed', err); }
}
async function computeGmvWeekFromDb(){
  try {
    const start = new Date(); start.setDate(start.getDate()-6); start.setHours(0,0,0,0);
    const { data, error } = await supabaseClient.from('orders').select('total,created_at').eq('status','delivered').gte('created_at', start.toISOString());
    if (error) throw error;
    const labels = ['อา','จ','อ','พ','พฤ','ศ','ส'];
    const buckets = {};
    for (let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0); buckets[d.toISOString().slice(0,10)] = { d: labels[d.getDay()], v: 0 }; }
    (data||[]).forEach(o => { const key = new Date(o.created_at).toISOString().slice(0,10); if (buckets[key]) buckets[key].v += Number(o.total||0); });
    gmvWeek = Object.values(buckets);
  } catch (err) { console.warn('computeGmvWeekFromDb failed', err); gmvWeek = MOCK_GMV; }
}
function subscribeRealtime(){
  if (!supabaseClient || realtimeChannel) return;
  realtimeChannel = supabaseClient.channel('admin_watch')
    .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, async () => { await refreshOrders(); await computeGmvWeekFromDb(); await refreshRiders(); await refreshTodayOrdersCount(); render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'restaurants' }, async () => { await refreshRestaurants(); render(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'riders' }, async () => { await refreshRiders(); render(); })
    .subscribe();
}

/* ลบออเดอร์ (พร้อมข้อมูลผูกอยู่) ทั้งหมดที่ตรงกับ field=value เช่น restaurant_id, rider_id, customer_id
   ใช้ตอน "บังคับลบ" เอนทิตีที่ติด foreign key จากประวัติออเดอร์ */
async function deleteAndVerify(table, field, value, label){
  const { error } = await supabaseClient.from(table).delete().eq(field, value);
  if (error) throw error;
  const { count, error: chkErr } = await supabaseClient.from(table).select('*', { count:'exact', head:true }).eq(field, value);
  if (chkErr) throw chkErr;
  if (count && count > 0) {
    throw new Error(`ลบ${label||table}ไม่สำเร็จ ${count} รายการ (คำสั่งลบไม่ error แต่ไม่มีอะไรถูกลบจริง — มักเกิดจาก Row Level Security ของตาราง ${table} ยังไม่อนุญาตให้แอดมินลบ ดู RLS policy สำหรับแอดมินในไฟล์ migration)`);
  }
}
async function deleteRowAndVerify(table, id, label){
  await deleteAndVerify(table, 'id', id, label);
}
async function cascadeDeleteOrdersByField(field, value){
  const { data: ords, error: ordErr } = await supabaseClient.from('orders').select('id').eq(field, value);
  if (ordErr) throw ordErr;
  const ids = (ords||[]).map(o => o.id);
  if (!ids.length) return;
  const { error: itemsErr } = await supabaseClient.from('order_items').delete().in('order_id', ids);
  if (itemsErr) throw itemsErr;
  const { error: msgErr } = await supabaseClient.from('order_messages').delete().in('order_id', ids);
  if (msgErr) throw msgErr;
  const { error: delErr } = await supabaseClient.from('orders').delete().in('id', ids);
  if (delErr) throw delErr;
  // ยืนยันว่าลบจริง — ถ้า Row Level Security บล็อกการลบเงียบๆ (ไม่ error แต่ก็ไม่ลบ) ให้ตรวจจับตรงนี้แทน
  // ไม่งั้นโค้ดจะไปเจอ error ตอนลบตัวหลัก (ร้าน/ไรเดอร์/ลูกค้า) ซึ่งอ่านสาเหตุจริงได้ยากกว่า
  const { count, error: chkErr } = await supabaseClient.from('orders').select('*', { count:'exact', head:true }).eq(field, value);
  if (chkErr) throw chkErr;
  if (count && count > 0) {
    throw new Error(`ลบออเดอร์ไม่สำเร็จ ${count} รายการ (คำสั่งลบไม่ error แต่ก็ไม่มีอะไรถูกลบจริง — มักเกิดจาก Row Level Security ของตาราง orders ยังไม่อนุญาตให้แอดมินลบ ดู RLS policy สำหรับแอดมินในไฟล์ migration)`);
  }
}
function isForeignKeyError(err){
  return String(err.message||'').toLowerCase().includes('foreign key') || String(err.code)==='23503';
}
async function deleteRestPermanently(id, name){
  if (!confirm(`ลบร้าน "${name}" ทิ้งถาวร? การกระทำนี้ไม่สามารถย้อนกลับได้`)) return;
  if (dataSource==='mock'){ showToast('ใช้ได้เฉพาะโหมดเชื่อมฐานข้อมูลจริง'); return; }
  try {
    await deleteRowAndVerify('restaurants', id, 'ร้าน');
    showToast('ลบร้านแล้ว'); await refreshRestaurants(); render();
  } catch(err) {
    console.error(err);
    if (!isForeignKeyError(err)) { showToast('ลบไม่สำเร็จ: ' + (err.message||'')); return; }
    if (!confirm(`ลบไม่ได้ตามปกติ เพราะร้าน "${name}" มีเมนู/ประวัติออเดอร์ผูกอยู่\n\nกด "ตกลง" เพื่อ "บังคับลบ" — ระบบจะลบเมนูและประวัติออเดอร์ทั้งหมดของร้านนี้ทิ้งไปด้วย การกระทำนี้ย้อนกลับไม่ได้`)) return;
    try {
      await deleteAndVerify('menu_items', 'restaurant_id', id, 'เมนู');
      await cascadeDeleteOrdersByField('restaurant_id', id);
      await deleteRowAndVerify('restaurants', id, 'ร้าน');
      showToast('บังคับลบร้านและข้อมูลที่เกี่ยวข้องแล้ว'); await refreshRestaurants(); render();
    } catch(err2) {
      console.error(err2);
      showToast('บังคับลบไม่สำเร็จ: ' + (err2.message||''));
    }
  }
}

let menuItemFilter = '';
let menuKind = 'all';
async function toggleMenuItemGlobal(id, current){
  if (dataSource==='mock'){ showToast('ใช้ได้เฉพาะโหมดเชื่อมฐานข้อมูลจริง'); return; }
  try { const { error } = await supabaseClient.from('menu_items').update({ is_available: !current }).eq('id', id); if (error) throw error;
    await refreshAllMenuItems(); render();
  } catch(err){ console.error(err); showToast('ดำเนินการไม่สำเร็จ'); }
}
async function deleteMenuItemGlobal(id, name){
  if (!confirm(`ลบเมนู "${name}" ทิ้งถาวร?`)) return;
  if (dataSource==='mock'){ showToast('ใช้ได้เฉพาะโหมดเชื่อมฐานข้อมูลจริง'); return; }
  try { const { error: unlinkErr } = await supabaseClient.from('order_items').update({ menu_item_id: null }).eq('menu_item_id', id);
    void unlinkErr; // เมนูที่ยังไม่เคยมีคนสั่งจะไม่มีแถวให้แก้ไข ไม่ต้องสนใจ error ตรงนี้
    await deleteRowAndVerify('menu_items', id, 'เมนู');
    showToast('ลบเมนูแล้ว'); await refreshAllMenuItems(); render();
  } catch(err){
    console.error(err);
    if (!isForeignKeyError(err)) { showToast('ลบไม่สำเร็จ: ' + (err.message||'')); return; }
    if (!confirm(`ลบไม่ได้ตามปกติ เพราะเมนู "${name}" ถูกใช้ในประวัติออเดอร์เก่า\n\nกด "ตกลง" เพื่อ "บังคับลบ" เมนูนี้ (ประวัติออเดอร์เก่ายังอยู่ครบ แค่จะไม่ผูกกับเมนูนี้อีกต่อไป) — ย้อนกลับไม่ได้`)) return;
    try {
      const { error: unlinkErr } = await supabaseClient.from('order_items').update({ menu_item_id: null }).eq('menu_item_id', id);
      if (unlinkErr) throw unlinkErr;
      const { count, error: chkErr } = await supabaseClient.from('order_items').select('*', { count:'exact', head:true }).eq('menu_item_id', id);
      if (chkErr) throw chkErr;
      if (count && count > 0) throw new Error(`ยกเลิกการผูกเมนูกับออเดอร์เก่าไม่สำเร็จ ${count} รายการ (มักเกิดจาก Row Level Security ของตาราง order_items ยังไม่อนุญาตให้แอดมินแก้ไข)`);
      const { error: delErr } = await supabaseClient.from('menu_items').delete().eq('id', id);
      if (delErr) throw delErr;
      showToast('บังคับลบเมนูแล้ว'); await refreshAllMenuItems(); render();
    } catch(err2){
      console.error(err2);
      showToast('บังคับลบไม่สำเร็จ: ' + (err2.message||''));
    }
  }
}

function previewPromoImage(){
  const input = document.getElementById('promo-image');
  const img = document.getElementById('promo-preview');
  const file = input.files && input.files[0];
  if (!file || !img) return;
  const reader = new FileReader();
  reader.onload = e => { img.src = e.target.result; img.style.display = 'block'; };
  reader.readAsDataURL(file);
}
async function addPromoBanner(){
  const file = document.getElementById('promo-image').files[0];
  const title = document.getElementById('promo-title').value.trim();
  const link = document.getElementById('promo-link').value.trim();
  const sortOrder = Number(document.getElementById('promo-sort').value) || 0;
  const shopId = document.getElementById('promo-shop').value || null;
  const disc = readDiscount('promo-discount');
  if (!file) { showToast('เลือกรูปแบนเนอร์ก่อน'); return; }
  if (!disc.ok) { showToast('ส่วนลดต้องอยู่ระหว่าง 1-99%'); return; }
  if (disc.val && !shopId) { showToast('ถ้าจะลดทั้งร้าน ต้องเลือกร้านก่อน'); return; }
  if (dataSource==='mock'){ showToast('ใช้ได้เฉพาะโหมดเชื่อมฐานข้อมูลจริง'); return; }
  const btn = document.getElementById('promo-add-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'กำลังอัปโหลด...'; }
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9.]+/g, '_');
    const path = `${Date.now()}_${safeName}`;
    const { error: upErr } = await supabaseClient.storage.from('promo-banners').upload(path, file);

      image_url: pub.publicUrl, title: title || null, link_url: link || null, sort_order: sortOrder, active: true,

/* ============ คำขอรีเซ็ตรหัสผ่านร้าน (ผ่าน edge function shop-password-reset) ============ */
const FN_RESET = SUPABASE_URL + '/functions/v1/shop-password-reset';
let resetRequests = [];
const tempPasswords = {}; // id ร้าน/คำขอ -> รหัสชั่วคราวที่เพิ่งตั้ง (แสดงครั้งเดียว ไม่บันทึก)
function escA(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function makeTempPassword(){ const c = 'abcdefghjkmnpqrstuvwxyz23456789'; return Array.from(crypto.getRandomValues(new Uint32Array(8)), x => c[x % c.length]).join(''); }
async function callResetFn(body){
  const { data: { session } } = await supabaseClient.auth.getSession();
  const r = await fetch(FN_RESET, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_KEY, Authorization:'Bearer ' + (session ? session.access_token : SUPABASE_KEY) }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function refreshResetRequests(){
  if (dataSource !== 'supabase') return;
  try { resetRequests = (await callResetFn({ action:'list' })).requests || []; } catch (err) { console.warn('โหลดคำขอรีเซ็ตไม่สำเร็จ', err); }
}
async function resetShopPassword(restaurantId){
  if (!confirm('ตั้งรหัสผ่านใหม่ให้ร้านนี้? รหัสเดิมจะใช้ไม่ได้ทันที')) return;
  const pw = makeTempPassword();
  try { await callResetFn({ action:'reset_shop', restaurant_id: restaurantId, password: pw }); tempPasswords[restaurantId] = pw; await refreshResetRequests(); render(); showToast('ตั้งรหัสใหม่แล้ว — โทรแจ้งร้าน'); }
  catch (err) { console.error(err); showToast('รีเซ็ตไม่สำเร็จ: ' + err.message); }
}
async function resetFromRequest(reqId){
  if (!confirm('ยืนยันตัวตนทางโทรศัพท์แล้ว และต้องการตั้งรหัสผ่านใหม่?')) return;
  const pw = makeTempPassword();
  try { await callResetFn({ action:'reset', id: reqId, password: pw }); tempPasswords[reqId] = pw; render(); showToast('ตั้งรหัสใหม่แล้ว — โทรแจ้งร้าน'); }
  catch (err) { console.error(err); showToast('รีเซ็ตไม่สำเร็จ: ' + err.message); }
}
async function dismissResetRequest(reqId){
  if (!confirm('ปิดคำขอนี้โดยไม่รีเซ็ต?')) return;
  try { await callResetFn({ action:'dismiss', id: reqId }); resetRequests = resetRequests.filter(x => x.id !== reqId); render(); }
  catch (err) { showToast('ไม่สำเร็จ: ' + err.message); }
}
function renderResets(){
  return `
  ${header('🔑 คำขอรีเซ็ตรหัสผ่านร้าน','แม่ค้ากด "ลืมรหัสผ่าน" ในแอปร้าน · ขึ้นที่นี่เฉพาะคำขอที่ไอดีและเบอร์เจ้าของร้านตรงกัน')}
  <div class="content">
    <div class="panel">
      <div class="panel-head"><h2>คำขอที่รอดำเนินการ</h2><button class="btn-mini outline" onclick="refreshResetRequests().then(render)">↻ รีเฟรช</button></div>
      <div style="padding:10px 18px;font-size:12px;color:var(--text-muted);">ขั้นตอน: โทรกลับเบอร์เจ้าของร้านเพื่อยืนยันตัวตน → กด "ตั้งรหัสใหม่" → แจ้งรหัสชั่วคราวทางโทรศัพท์ → ให้แม่ค้าเปลี่ยนรหัสเองที่ ⚙️ ตั้งค่า</div>
      ${resetRequests.map(q => { const shop = q.restaurants || {}; const p = (Array.isArray(shop.restaurant_private) ? shop.restaurant_private[0] : shop.restaurant_private) || {};
        return `<div style="padding:12px 18px;border-top:1px solid var(--border);">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><b>${escA(shop.name || '-')}</b><span style="font-size:11.5px;color:var(--text-muted);">${new Date(q.created_at).toLocaleString('th-TH')}</span></div>
          <div style="font-size:12.5px;margin-top:3px;">ไอดี <b>${escA(q.username)}</b> · เจ้าของ ${escA((p.owner_first_name||'') + ' ' + (p.owner_last_name||''))} · 📞 <a href="tel:${escA(q.phone)}">${escA(q.phone)}</a></div>
          ${tempPasswords[q.id] ? `<div style="margin-top:6px;">รหัสชั่วคราว: <span class="temp-pw">${escA(tempPasswords[q.id])}</span></div>`
            : `<div style="margin-top:8px;"><button class="btn-mini approve" onclick="resetFromRequest('${q.id}')">🔑 ตั้งรหัสใหม่</button><button class="btn-mini suspend" onclick="dismissResetRequest('${q.id}')">ปิดคำขอ</button></div>`}
        </div>`; }).join('') || `<div style="padding:24px 18px;text-align:center;color:var(--text-muted);font-size:12.5px;">ไม่มีคำขอค้างอยู่</div>`}
    </div>
  </div>`;
}

/* ============ MAIN RENDER ============ */
function openSidebar(){ sidebarOpen = true; render(); }
function closeSidebar(){ sidebarOpen = false; render(); }

function render(){
  const app = document.getElementById('app');
  if (loading) { app.innerHTML = `<div style="padding:80px 30px;text-align:center;color:var(--text-muted);"><div style="font-size:44px;margin-bottom:10px;">⏳</div><h3>กำลังโหลดข้อมูล...</h3></div>`; return; }
  if (adminView === 'auth') { app.innerHTML = authHtml(); return; }
  if (adminView === 'denied') { app.innerHTML = deniedHtml(); return; }
  let page = '';
  if (activePage==='overview') page = renderOverview();
  if (activePage==='restaurants') page = renderRestaurants('normal');
  if (activePage==='preshops') page = renderRestaurants('preorder');
  if (activePage==='menuitems') page = renderMenuItems();
  if (activePage==='riders') page = renderRiders();
  if (activePage==='users') page = renderUsers();
  if (activePage==='orders') page = renderOrders();
  if (activePage==='promos') page = renderPromos();
  if (activePage==='promocodes') page = renderPromoCodes();
  if (activePage==='finance') page = renderFinance();
  if (activePage==='resets') page = renderResets();
  const sbHtml = sidebarHtml().replace('class="sidebar"', `class="sidebar${sidebarOpen?' open':''}"`);
  let detailHtml = '';
  if (activeDetail) {
    if (activeDetail.type === 'restaurant') {
      const r = restaurants.find(x => x.id === activeDetail.id);
      if (r) detailHtml = restaurantDetailHtml(r);
    } else if (activeDetail.type === 'shopmenu') {
      const r = restaurants.find(x => x.id === activeDetail.id);
      if (r) detailHtml = shopMenuHtml(r);
    } else if (activeDetail.type === 'codeshops') {
      const p = promoCodes.find(x => x.id === activeDetail.id);
      if (p) detailHtml = codeShopsHtml(p);
    } else if (activeDetail.type === 'banner') {
      const b = promoBanners.find(x => x.id === activeDetail.id);
      if (b) detailHtml = bannerEditHtml(b);
    } else if (activeDetail.type === 'rider') {
      const r = riders.find(x => x.id === activeDetail.id);
      if (r) detailHtml = riderDetailHtml(r);
    }
  }
  app.innerHTML = `
    <div class="shell">
      <div class="sidebar-backdrop ${sidebarOpen?'show':''}" onclick="closeSidebar()"></div>
      ${sbHtml}
      <div class="main">${page}</div>
    </div>
    ${detailHtml}`;
}
init();
</script>
</body>
</html>
