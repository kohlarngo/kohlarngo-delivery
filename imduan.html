<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อิ่มด่วน — สั่งอาหารส่งถึงบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet Map CSS/JS & Supabase SDK -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #FBF3E7;
    --surface: #FFFFFF;
    --surface-2: #FFF9F0;
    --text: #241B15;
    --text-muted: #7A6A57;
    --primary: #DD3B1F;
    --primary-ink: #FFFFFF;
    --secondary: #F2A93B;
    --green: #3F8C4A;
    --border: #EADBC3;
    --shadow: 0 1px 2px rgba(36,27,21,0.06);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17120E;
      --surface: #241C16;
      --surface-2: #2B2119;
      --text: #F5ECDD;
      --text-muted: #C9B79E;
      --primary: #FF6A3D;
      --primary-ink: #17120E;
      --secondary: #FFC94D;
      --green: #6FCB7A;
      --border: #3A2E23;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17120E;
    --surface: #241C16;
    --surface-2: #2B2119;
    --text: #F5ECDD;
    --text-muted: #C9B79E;
    --primary: #FF6A3D;
    --primary-ink: #17120E;
    --secondary: #FFC94D;
    --green: #6FCB7A;
    --border: #3A2E23;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 84px;
  }
  h1, h2, h3, .display {
    font-family: 'Archivo Black', 'Noto Sans Thai', sans-serif;
    font-weight: 400;
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.01em;
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  img { max-width: 100%; }
  ::selection { background: var(--secondary); color: var(--text); }

  .wrap { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; background: var(--bg); }
  @media (min-width: 700px) {
    .wrap { max-width: 900px; box-shadow: 0 0 60px rgba(0,0,0,0.08); }
  }
  @media (min-width: 1150px) {
    .wrap { max-width: 1180px; }
    .hero { padding: 34px 40px; }
    .hero h1 { font-size: 34px; }
    .hero p { font-size: 14.5px; }
    .hero .bowl { font-size: 130px; right: 10px; bottom: -26px; }
    .search-row, .section-title, .cats, .rest-list, .hero { padding-left: 28px; padding-right: 28px; }
    .hero { margin-left: 28px; margin-right: 28px; }
  }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px 10px;
    position: sticky; top: 0; z-index: 40;
    background: var(--bg);
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--primary); color: var(--primary-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo Black'; font-size: 16px;
    transform: rotate(-6deg);
  }
  .logo-text { font-family: 'Archivo Black'; font-size: 18px; }
  .addr-pill {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted); max-width: 130px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .icon-btn {
    border: none; background: var(--surface); width: 38px; height: 38px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); font-size: 16px; flex-shrink: 0;
    position: relative;
  }
  .cart-badge {
    position: absolute; top: -4px; right: -4px; background: var(--primary); color: var(--primary-ink);
    font-size: 10px; font-weight: 800; border-radius: 50%; min-width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }

  .search-row { padding: 4px 18px 14px; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 11px 16px; box-shadow: var(--shadow);
  }
  .search-box input {
    border: none; outline: none; background: transparent; color: var(--text);
    font-size: 14px; width: 100%; font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  /* ---------- Hero ---------- */
  .hero {
    margin: 4px 18px 18px; border-radius: var(--radius-l);
    background: linear-gradient(135deg, var(--primary), #ff8a5c 130%);
    color: #fff; padding: 22px 20px; position: relative; overflow: hidden;
  }
  .hero h1 { font-size: 26px; max-width: 70%; }
  .hero p { margin: 8px 0 0; font-size: 13px; opacity: .92; max-width: 65%; }
  .hero .bowl {
    position: absolute; right: -10px; bottom: -18px; font-size: 92px;
    transform: rotate(8deg); filter: drop-shadow(0 8px 10px rgba(0,0,0,.2));
  }
  .hero .steam { position: absolute; right: 46px; top: 14px; font-size: 20px; opacity: .8; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); opacity:.5 } 50% { transform: translateY(-8px); opacity: .9 } }

  /* ---------- Promo banner carousel ---------- */
  .promo-carousel { margin: 4px 0 18px; padding: 0 18px; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .promo-carousel::-webkit-scrollbar { display: none; }
  .promo-slide { flex: 0 0 88%; scroll-snap-align: start; border-radius: var(--radius-l); overflow: hidden; position: relative; background: var(--surface-2); border: none; padding: 0; cursor: pointer; }
  .promo-slide img { width: 100%; height: 140px; object-fit: cover; display: block; }
  .promo-slide .promo-slide-title { position: absolute; left: 14px; bottom: 10px; color: #fff; font-weight: 800; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  /* ---------- Categories ---------- */
  .section-title {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 18px; margin: 22px 0 12px;
  }
  .section-title h2 { font-size: 17px; }
  .section-title span { font-size: 12px; color: var(--text-muted); }

  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ---------- Restaurant cards ---------- */
  .rest-list { padding: 0 18px; display: flex; flex-direction: column; gap: 14px; }
  .rest-card {
    display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-m); padding: 12px; text-align: left; width: 100%;
  }
  .rest-thumb {
    width: 76px; height: 76px; border-radius: var(--radius-s); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
  }
  .rest-info { flex: 1; min-width: 0; }
  .rest-name-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .rest-name { font-size: 15px; font-weight: 700; }
  .promo-tag {
    font-size: 10px; font-weight: 800; background: var(--secondary); color: #241B15;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0;
  }
  .rest-tags { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .rest-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .rest-meta b { color: var(--text); }

  /* ---------- Grid layout desktop ---------- */
  @media (min-width: 700px) {
    .rest-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  }
  @media (min-width: 1150px) {
    .rest-list { grid-template-columns: repeat(3, 1fr); }
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; z-index: 50;
  }
  @media (min-width: 700px) { .bottom-nav { max-width: 900px; } }
  @media (min-width: 1150px) { .bottom-nav { max-width: 1180px; } }
  .nav-btn {
    flex: 1; border: none; background: none; padding: 10px 4px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-muted); font-size: 10px; font-weight: 600;
  }
  .nav-btn .nav-ic { font-size: 19px; }
  .nav-btn.active { color: var(--primary); }

  /* ---------- Restaurant detail ---------- */
  .detail-header {
    height: 150px; background: linear-gradient(160deg, var(--secondary), var(--primary));
    display: flex; align-items: flex-end; padding: 16px 18px; position: relative;
  }
  .back-btn {
    position: absolute; top: 14px; left: 14px; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.92); border: none; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #241B15;
  }
  .detail-header .emoji-big { font-size: 64px; position: absolute; right: 14px; top: 14px; opacity: .9; }
  .detail-sub { padding: 14px 18px 6px; border-bottom: 1px solid var(--border); }
  .detail-meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-muted); margin-top: 6px; flex-wrap: wrap; }
  .detail-meta b { color: var(--text); }

  .menu-group-title { padding: 6px 18px 2px; font-size: 15px; font-weight: 800; margin-top: 10px; }
  .menu-item {
    display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); align-items: center;
  }
  .menu-item-emoji {
    width: 58px; height: 58px; border-radius: var(--radius-s); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .menu-item-info { flex: 1; min-width: 0; }
  .menu-item-name { font-size: 14.5px; font-weight: 700; }
  .menu-item-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
  .menu-item-price { font-size: 14px; font-weight: 800; margin-top: 6px; color: var(--primary); }

  .qty-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--primary); background: var(--surface);
    color: var(--primary); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .qty-btn.add { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .qty-num { font-weight: 800; min-width: 16px; text-align: center; font-size: 14px; }

  /* ---------- Floating cart bar ---------- */
  .cart-fab {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 78px;
    width: calc(100% - 36px); max-width: 444px;
    background: var(--primary); color: var(--primary-ink);
    border-radius: 999px; padding: 13px 18px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 8px 20px rgba(221,59,31,0.35); border: none; z-index: 45; font-weight: 700; font-size: 14px;
  }
  @media (min-width: 700px) { .cart-fab { max-width: 864px; } }
  @media (min-width: 1150px) { .cart-fab { max-width: 1140px; } }

  /* ---------- Drawer / modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(23,18,14,0.5); z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 700px) { .overlay { align-items: center; } }
  .sheet {
    background: var(--bg); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 0 24px; position: relative;
  }
  @media (min-width: 700px) { .sheet { border-radius: 22px; max-width: 460px; } }
  .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 3px; margin: 0 auto 12px; }
  .sheet-title { padding: 0 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title h2 { font-size: 18px; }
  .sheet-close { border: none; background: var(--surface); width: 30px; height: 30px; border-radius: 50%; font-size: 14px; }

  .cart-line { display: flex; gap: 10px; padding: 12px 20px; align-items: center; }
  .cart-line-emoji { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .cart-line-info { flex: 1; min-width: 0; }
  .cart-line-name { font-size: 13.5px; font-weight: 700; }
  .cart-line-price { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .summary-row { display: flex; justify-content: space-between; padding: 8px 20px; font-size: 13.5px; color: var(--text-muted); }
  .summary-row.total { color: var(--text); font-weight: 800; font-size: 16px; border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 14px; }

  .btn-primary {
    display: block; width: calc(100% - 40px); margin: 14px 20px 0; background: var(--primary); color: var(--primary-ink);
    border: none; padding: 14px; border-radius: 999px; font-weight: 800; font-size: 14.5px;
  }
  .btn-primary:disabled { opacity: .45; }
  .btn-secondary {
    display: block; width: calc(100% - 40px); margin: 10px 20px 0; background: transparent; color: var(--text);
    border: 1.5px solid var(--border); padding: 13px; border-radius: 999px; font-weight: 700; font-size: 14px;
  }

  .field-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); padding: 14px 20px 6px; }
  .field-input {
    margin: 0 20px; display: block; width: calc(100% - 40px); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-s); padding: 12px 14px; font-size: 14px; color: var(--text); font-family: inherit;
  }
  textarea.field-input { resize: vertical; min-height: 60px; }

  .pay-option {
    display: flex; align-items: center; gap: 10px; margin: 8px 20px; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius-s); font-size: 13.5px; font-weight: 600;
  }
  .pay-option.selected { border-color: var(--primary); background: var(--surface-2); }
  .pay-option .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--text-muted); flex-shrink: 0; position: relative; }
  .pay-option.selected .dot { border-color: var(--primary); }
  .pay-option.selected .dot::after { content:''; position:absolute; inset:3px; background: var(--primary); border-radius: 50%; }

  /* ---------- empty states ---------- */
  .empty-state { text-align: center; padding: 60px 30px; color: var(--text-muted); }
  .empty-state .e { font-size: 46px; margin-bottom: 10px; }
  .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; line-height: 1.5; }

  /* ---------- Order tracking ---------- */
  .track-wrap { padding: 20px 18px; }
  .track-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 22px 18px; text-align: center; }
  .track-emoji { font-size: 54px; }
  .track-status { font-size: 18px; font-weight: 800; margin-top: 10px; font-family:'Archivo Black'; }
  .track-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 5px; margin: 22px 4px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 5px; transition: width 0.6s ease; }
  .steps { display: flex; justify-content: space-between; margin-top: 10px; font-size: 10.5px; color: var(--text-muted); }
  .steps .on { color: var(--primary); font-weight: 800; }
  .order-id { font-size: 11px; color: var(--text-muted); margin-top: 16px; }
  .track-header { display:flex; align-items:center; justify-content:space-between; padding: 0 4px; margin-bottom: 10px; }
  .track-order-code { font-size: 13px; font-weight: 800; color: var(--text); }
  .gpr-indicator { display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color: var(--text-muted); }
  .gpr-dot { width:7px; height:7px; border-radius:50%; background:#22C55E; box-shadow:0 0 0 0 rgba(34,197,94,.6); animation: gprPulse 1.6s infinite; }
  @keyframes gprPulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.5);} 70%{box-shadow:0 0 0 6px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }
  .stage-row { display:flex; justify-content:space-between; margin-top:18px; position:relative; }
  .stage-row::before { content:''; position:absolute; top:15px; left:8%; right:8%; height:2px; background:var(--border); z-index:0; }
  .stage-item { flex:1; text-align:center; position:relative; z-index:1; }
  .stage-dot { width:30px; height:30px; border-radius:50%; background:var(--surface-2); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:13px; }
  .stage-item.done .stage-dot { background: var(--primary); border-color: var(--primary); color:#fff; }
  .stage-item.active .stage-dot { background: var(--accent); border-color: var(--accent); color:#fff; }
  .stage-label { font-size:10.5px; margin-top:6px; color:var(--text-muted); }
  .stage-item.done .stage-label, .stage-item.active .stage-label { color:var(--text); font-weight:700; }
  .eta-badge { display:inline-flex; align-items:center; gap:6px; background: var(--surface-2); border:1px solid var(--border); padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; margin-top:14px; }
  .driver-card { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; margin-top:14px; }
  .driver-avatar { width:46px; height:46px; border-radius:50%; background:var(--secondary); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .driver-name { font-size:13.5px; font-weight:800; }
  .driver-meta { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .driver-actions { display:flex; gap:8px; margin-left:auto; }
  .driver-btn { width:38px; height:38px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
  .driver-btn.call { background:#3B82F6; }
  .driver-btn.chat { background:#0EA5E9; }

  /* ---------- Voice call overlay ---------- */
  .call-overlay { position: fixed; inset: 0; background: linear-gradient(160deg, #1a2e22, #0d1712); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 30px; }
  .call-avatar { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 18px; }
  .call-name { font-size: 19px; font-weight: 800; }
  .call-status { font-size: 13px; opacity: .75; margin-top: 6px; }
  .call-timer { font-size: 28px; font-weight: 800; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .call-actions { display: flex; gap: 22px; margin-top: 36px; }
  .call-btn { width: 58px; height: 58px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; cursor: pointer; }
  .call-btn.accept { background: #22C55E; }
  .call-btn.decline, .call-btn.hangup { background: #EF4444; }
  .call-btn.mute { background: rgba(255,255,255,.18); font-size: 20px; }
  .call-btn-label { font-size: 10.5px; margin-top: 6px; opacity: .8; }
  .call-btn-wrap { display: flex; flex-direction: column; align-items: center; }

  /* ---------- Chat drawer ---------- */
  .chat-msg-row { display: flex; margin-bottom: 10px; }
  .chat-msg-row.mine { justify-content: flex-end; }
  .chat-bubble { max-width: 75%; padding: 9px 13px; border-radius: 16px; font-size: 13px; line-height: 1.4; }
  .chat-msg-row.mine .chat-bubble { background: var(--primary); color: var(--primary-ink); border-bottom-right-radius: 4px; }
  .chat-msg-row.theirs .chat-bubble { background: var(--surface-2); color: var(--text); border-bottom-left-radius: 4px; }
  .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .chat-input-row input { flex: 1; border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 10px 16px; font-size: 13px; color: var(--text); font-family: inherit; }

<script>

try {

let liveMap = null;

/* ============ CALL / CHAT (Agora RTC + Supabase Realtime สำหรับสัญญาณเรียกเข้า) ============ */
const AGORA_APP_ID = '370aa664b73149a5ae69717073df6ddc';
let agoraClient = null;

let callState = 'idle'; // idle | calling | ringing | connected
let callOpen = false;
let callTimerHandle = null;
let callSeconds = 0;
let micMuted = false;

let chatChannel = null;
let chatMessages = [];
let chatOpen = false;

/* ============ CATEGORIES (คงที่ ใช้แค่กรองหน้าจอ) ============ */
const CATEGORIES = [

];

/* ============ MOCK DATA (fallback เมื่อยังไม่เชื่อม Supabase) ============ */
const MOCK_RESTAURANTS = [
  { id: 'r1', name: 'ส้มตำแซ่บนัว', cat: 'isaan', emoji: '🥗', color: '#E9F5E1',

        { id:'i2', name:'ส้มตำปูปลาร้า', desc:'สูตรอีสานแท้ กลิ่นหอมปลาร้า', price:65, emoji:'🦀' },

    menu: [
      { group: 'ก๋วยเตี๋ยวเรือ', items: [
        { id:'i6', name:'เรือหมูน้ำตก', desc:'น้ำซุปเข้มข้น ใส่เลือดหมู', price:45, emoji:'🍜' },
      ]},
    ],
  },
];

/* ============ STATE ============ */
const state = {
  view: 'home',
  activeCat: 'all',
  searchQuery: '',
  currentRestaurantId: null,
  cart: { restaurantId: null, items: {} },
  orders: [],
  activeOrder: null,
  loading: true,
  customerId: null,
  isAnonymous: true,
  customerName: '',
};
let RESTAURANTS = [];
let dataSource = 'loading'; // 'supabase' | 'mock'
let promoBanners = [];
let appLogoUrl = null;
let checkoutDiscount = { code: null, amount: 0 };
let checkoutGpsCoords = null; // {lat,lng} เมื่อกดปุ่ม GPS ในหน้าชำระเงิน
function resetCheckoutExtras(){ checkoutDiscount = { code: null, amount: 0 }; checkoutGpsCoords = null; }

function loadState() {
  try { const c = localStorage.getItem('imduan_cart'); if (c) state.cart = JSON.parse(c); } catch(e) {}
  try { const o = localStorage.getItem('imduan_orders'); if (o) state.orders = JSON.parse(o); } catch(e) {}
}
function saveCart() { try { localStorage.setItem('imduan_cart', JSON.stringify(state.cart)); } catch(e) {} }
function saveOrders() { try { localStorage.setItem('imduan_orders', JSON.stringify(state.orders)); } catch(e) {} }

/* ============ SUPABASE DATA LOADING ============ */
function mapRestaurantRow(r) {
  const groups = {};
  (r.menu_items || []).filter(m => m.is_available !== false).forEach(m => {
    const g = m.group_name || 'เมนู';
    if (!groups[g]) groups[g] = [];
    groups[g].push({ id: m.id, name: m.name, desc: m.description || '', price: Number(m.price), emoji: m.emoji || '🍽️', image: m.image_url || null });
  });
  return {
    id: r.id, name: r.name, cat: r.category || 'other', emoji: r.emoji || '🍽️', color: r.color || '#FDEDE3',
    tags: r.tags || '', rating: r.rating || 0, time: r.prep_time || '20-30 นาที', price: r.price_level || '฿฿',
    promo: r.promo || null, selfDelivery: !!r.self_delivery_enabled,
    menu: Object.keys(groups).map(g => ({ group: g, items: groups[g] })),
  };
}

async function ensureSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    state.customerId = session.user.id;
    state.isAnonymous = !!session.user.is_anonymous;
    return;
  }
  const { data, error } = await supabaseClient.auth.signInAnonymously();
  if (error) throw error;
  state.customerId = data.user.id;
  state.isAnonymous = true;
}
async function ensureCustomerRow() {
  const { data, error } = await supabaseClient.from('customers').select('id,name,address').eq('id', state.customerId).maybeSingle();
  if (error) throw error;
  if (!data) {
    const { error: insErr } = await supabaseClient.from('customers').insert({ id: state.customerId, name: 'ลูกค้าอิ่มด่วน' });
    if (insErr) throw insErr;
  } else if (data.name) {
    state.customerName = data.name;
  }
}
async function refreshPromoBanners() {
  try {
    const { data, error } = await supabaseClient.from('promo_banners').select('*').eq('active', true).order('sort_order', { ascending: true });
    if (error) throw error;
    promoBanners = data || [];
  } catch (err) { console.warn('refreshPromoBanners failed', err); }
}
async function loadAppLogo() {
  try {
    const { data, error } = await supabaseClient.from('platform_settings').select('value').eq('key', 'app_logo_url').maybeSingle();
    if (error) throw error;
    appLogoUrl = data && data.value ? data.value : null;
  } catch (err) { console.warn('loadAppLogo failed', err); }
}
async function loginWithProvider(provider) {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user.is_anonymous) {
      const { error } = await supabaseClient.auth.linkIdentity({ provider, options: { redirectTo: window.location.href } });
      if (error) throw error;
    } else {
      const { error } = await supabaseClient.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.href } });
      if (error) throw error;
    }
  } catch (err) {
    console.error(err);
    showToast('เข้าสู่ระบบไม่สำเร็จ: ' + (err.message || ''));
  }
}
async function doLogout() {
  try { await supabaseClient.auth.signOut(); } catch (err) { console.warn(err); }
  location.reload();
}

async function init() {
  loadState();
  render(); // แสดงหน้า loading ก่อน
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('restaurants')
        .select('id,name,category,emoji,color,tags,price_level,prep_time,promo,rating,is_featured,self_delivery_enabled,menu_items(id,group_name,name,description,price,emoji,is_available,image_url)')
        .eq('status', 'active')
        .order('is_featured', { ascending: false })
        .order('name', { ascending: true });
      if (error) throw error;
      RESTAURANTS = (data || []).map(mapRestaurantRow);
      dataSource = 'supabase';
    } catch (err) {
      console.warn('Load restaurants failed, using demo data instead:', err);
      RESTAURANTS = MOCK_RESTAURANTS;
      dataSource = 'mock';
    }
    if (dataSource === 'supabase') {
      try {
        await ensureSession();
        await ensureCustomerRow();
      } catch (err) {
        // มักเกิดจากยังไม่เปิด "Allow anonymous sign-ins" ใน Supabase Authentication > Providers
        console.warn('Auth session failed (check "Allow anonymous sign-ins" in Supabase):', err);
        state.authBlocked = true;
      }
      await refreshPromoBanners();
      await loadAppLogo();
    }
  } else {
    RESTAURANTS = MOCK_RESTAURANTS;
    dataSource = 'mock';
  }
  if (state.cart.restaurantId && !findRestaurant(state.cart.restaurantId)) {
    state.cart = { restaurantId: null, items: {} };
    saveCart();
  }
  state.loading = false;
  render();
}

/* ============ HELPERS ============ */
function findRestaurant(id) { return RESTAURANTS.find(r => r.id === id); }
function findItem(restaurant, itemId) {
  for (const g of restaurant.menu) {
    const found = g.items.find(i => i.id === itemId);
    if (found) return found;
  }
  return null;
}
function cartCount() { return Object.values(state.cart.items).reduce((a,b) => a+b, 0); }
function cartSubtotal() {
  const r = findRestaurant(state.cart.restaurantId);
  if (!r) return 0;
  let sum = 0;
  for (const [id, qty] of Object.entries(state.cart.items)) {
    const item = findItem(r, id);
    if (item) sum += item.price * qty;
  }
  return sum;
}
function money(n) { return Number(n||0).toLocaleString('th-TH') + ' บาท'; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
}
let sharedAudioCtx = null;
function playAlertSound() {
  try {
    if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
    const ctx = sharedAudioCtx; const now = ctx.currentTime;
    [0, 0.18].forEach((t) => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + t);
      gain.gain.exponentialRampToValueAtTime(0.3, now + t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + t); osc.stop(now + t + 0.16);
    });
  } catch (e) { console.warn('เล่นเสียงไม่ได้', e); }
}

/* ============ CALL (Agora RTC ส่งเสียงจริง + Supabase Realtime แค่ใช้แจ้งสายเรียกเข้า) ============ */
function subscribeCallChannel(orderId) {
  if (!supabaseClient) return;
  if (callChannel && callChannelOrderId === orderId) return;
  if (callChannel) { supabaseClient.removeChannel(callChannel); callChannel = null; }
  callChannelOrderId = orderId;
  callChannel = supabaseClient.channel('call_' + orderId);
  callChannel
    .on('broadcast', { event: 'call-offer' }, ({ payload }) => { if (payload.from !== 'customer') handleIncomingOffer(); })
    .on('broadcast', { event: 'call-answer' }, ({ payload }) => { if (payload.from !== 'customer') handleCallAnswer(); })
    .on('broadcast', { event: 'call-end' }, ({ payload }) => { if (payload.from !== 'customer') endCallLocal(); })
    .subscribe();
}
function unsubscribeCallChannel() {
  if (callChannel) { supabaseClient.removeChannel(callChannel); callChannel = null; callChannelOrderId = null; }
  endCallLocal();
}
function getAgoraClient() {
  if (!agoraClient) agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
  return agoraClient;
}
async function joinAgoraChannel(orderId) {
  const client = getAgoraClient();
  client.removeAllListeners();
  client.on('user-published', async (user, mediaType) => {
    await client.subscribe(user, mediaType);
    if (mediaType === 'audio') {
      user.audioTrack.play();
      if (callState !== 'connected') { callState = 'connected'; startCallTimer(); render(); }
    }
  });
  client.on('user-left', () => { endCallLocal(); });
  await client.join(AGORA_APP_ID, 'order_' + orderId, null, null);
  localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
  await client.publish([localAudioTrack]);
}
async function leaveAgoraChannel() {
  if (localAudioTrack) { localAudioTrack.close(); localAudioTrack = null; }
  if (agoraClient) { try { await agoraClient.leave(); } catch (e) { console.warn(e); } }
}
function formatCallTime(sec) { const m = Math.floor(sec/60), s = sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function startCallTimer() {
  callSeconds = 0;
  callTimerHandle = setInterval(() => {
    callSeconds++;
    const el = document.getElementById('call-timer-text');
    if (el) el.textContent = formatCallTime(callSeconds);
  }, 1000);
}
function playRingtone(){ playAlertSound(); ringInterval = setInterval(playAlertSound, 2000); }
function stopRingtone(){ clearInterval(ringInterval); ringInterval = null; }

async function startCall() {
  if (!callChannel || !state.activeOrder) { showToast('ยังเชื่อมต่อระบบโทรไม่ได้ ลองใหม่อีกครั้ง'); return; }
  if (callState !== 'idle') return;
  callState = 'calling'; callOpen = true; render();
  try {
    await joinAgoraChannel(state.activeOrder.id);
  } catch (err) {
    console.error(err); showToast('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตสิทธิ์');
    callState = 'idle'; callOpen = false; render(); return;
  }
  callChannel.send({ type: 'broadcast', event: 'call-offer', payload: { from: 'customer' } });
}
function handleIncomingOffer() {
  if (callState !== 'idle') return;
  callState = 'ringing'; callOpen = true; render();
  playRingtone();
}
async function acceptCall() {
  stopRingtone();
  callOpen = true; render();
  try {
    await joinAgoraChannel(state.activeOrder.id);
  } catch (err) { console.error(err); showToast('ไม่สามารถเข้าถึงไมโครโฟนได้'); declineCall(); return; }
  callChannel.send({ type: 'broadcast', event: 'call-answer', payload: { from: 'customer' } });
  callState = 'connected'; startCallTimer(); render();
}
function declineCall() {
  stopRingtone();
  if (callChannel) callChannel.send({ type: 'broadcast', event: 'call-end', payload: { from: 'customer' } });
  callState = 'idle'; callOpen = false; render();
}
function handleCallAnswer() {
  if (callState === 'calling') { callState = 'connected'; startCallTimer(); render(); }
}
function endCall() {
  if (callChannel) callChannel.send({ type: 'broadcast', event: 'call-end', payload: { from: 'customer' } });
  endCallLocal();
}
async function endCallLocal() {
  stopRingtone();
  await leaveAgoraChannel();
  clearInterval(callTimerHandle); callTimerHandle = null; callSeconds = 0; micMuted = false;
  callState = 'idle'; callOpen = false;
  render();
}
function toggleMute() {
  if (!localAudioTrack) return;
  micMuted = !micMuted;
  localAudioTrack.setEnabled(!micMuted);
  render();
}
function callModalHtml() {
  if (!callOpen) return '';
  const o = state.activeOrder;
  const name = (o && o.riderInfo) ? o.riderInfo.name : 'ไรเดอร์';
  let body = '';
  if (callState === 'calling') {
    body = `<div class="call-status">กำลังโทรออก...</div>
    <div class="call-actions"><div class="call-btn-wrap"><button class="call-btn hangup" onclick="endCall()">✕</button><span class="call-btn-label">วางสาย</span></div></div>`;
  } else if (callState === 'ringing') {
    body = `<div class="call-status">มีสายเรียกเข้า</div>
    <div class="call-actions">
      <div class="call-btn-wrap"><button class="call-btn decline" onclick="declineCall()">✕</button><span class="call-btn-label">ปฏิเสธ</span></div>
      <div class="call-btn-wrap"><button class="call-btn accept" onclick="acceptCall()">📞</button><span class="call-btn-label">รับสาย</span></div>
    </div>`;
  } else if (callState === 'connected') {
    body = `<div class="call-status">กำลังคุยอยู่</div>
    <div class="call-timer" id="call-timer-text">00:00</div>
    <div class="call-actions">
      <div class="call-btn-wrap"><button class="call-btn mute" onclick="toggleMute()">${micMuted?'🔇':'🎙️'}</button><span class="call-btn-label">${micMuted?'เปิดไมค์':'ปิดไมค์'}</span></div>
      <div class="call-btn-wrap"><button class="call-btn hangup" onclick="endCall()">✕</button><span class="call-btn-label">วางสาย</span></div>
    </div>`;
  }
  return `
  <div class="call-overlay">
    <div class="call-avatar">🏍️</div>
    <div class="call-name">${name}</div>
    ${body}
  </div>`;
}

/* ============ CHAT ============ */
function subscribeChatMessages(orderId) {
  if (!supabaseClient || chatChannel) return;
  chatChannel = supabaseClient.channel('chat_' + orderId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'order_messages', filter: `order_id=eq.${orderId}` }, payload => {
      chatMessages.push(payload.new);
      if (chatOpen) render();
      else if (payload.new.sender_role !== 'customer') { playAlertSound(); showToast('💬 ข้อความใหม่จากไรเดอร์'); }
    })
    .subscribe();
}
function unsubscribeChatMessages() {
  if (chatChannel) { supabaseClient.removeChannel(chatChannel); chatChannel = null; }
  chatMessages = []; chatOpen = false;
}
async function loadChatMessages(orderId) {
  try {
    const { data, error } = await supabaseClient.from('order_messages').select('*').eq('order_id', orderId).order('created_at', { ascending: true });
    if (error) throw error;
    chatMessages = data || [];
  } catch (err) { console.warn('loadChatMessages failed', err); }
}
function openChat() { chatOpen = true; render(); setTimeout(scrollChatToBottom, 50); }
function closeChat() { chatOpen = false; render(); }
function scrollChatToBottom() {
  const el = document.getElementById('chat-messages');
  if (el) el.scrollTop = el.scrollHeight;
}
async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text || !state.activeOrder) return;
  input.value = '';
  try {
    const { error } = await supabaseClient.from('order_messages').insert({
      order_id: state.activeOrder.id, sender_role: 'customer', sender_id: state.customerId, message: text,
    });
    if (error) throw error;
  } catch (err) { console.error(err); showToast('ส่งข้อความไม่สำเร็จ'); }
}
function chatDrawerHtml() {
  return `
  <div class="overlay" onclick="if(event.target===this) closeChat()">
    <div class="sheet" style="height:80vh;display:flex;flex-direction:column;padding:0;">
      <div class="sheet-title" style="padding:16px 20px 12px;"><h2>แชทกับไรเดอร์</h2><button class="sheet-close" onclick="closeChat()">✕</button></div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px 16px;">
        ${chatMessages.length === 0 ? `<div class="empty-state"><div class="e">💬</div><h3>เริ่มแชทได้เลย</h3></div>` :
          chatMessages.map(m => `<div class="chat-msg-row ${m.sender_role==='customer'?'mine':'theirs'}"><div class="chat-bubble">${m.message}</div></div>`).join('')}
      </div>

async function placeOrder() {
  const addr = document.getElementById('addr-input') ? document.getElementById('addr-input').value.trim() : '';
  const custName = document.getElementById('name-input') ? document.getElementById('name-input').value.trim() : '';
  const custPhone = document.getElementById('phone-input') ? document.getElementById('phone-input').value.trim() : '';
  const note = document.getElementById('note-input') ? document.getElementById('note-input').value.trim() : '';
  if (!addr) { showToast('กรุณากรอกที่อยู่จัดส่ง'); return; }
  const r = findRestaurant(state.cart.restaurantId);
  if (!r) { showToast('ไม่พบร้านค้า'); return; }
  const cartLines = Object.entries(state.cart.items).map(([id, qty]) => {
    const item = findItem(r, id);
    return { menu_item_id: id, name: item.name, qty, price: item.price, emoji: item.emoji };
  });
  const subtotal = cartSubtotal();
  const isSelfDelivery = !!r.selfDelivery;
  const deliveryFee = isSelfDelivery ? 0 : (subtotal > 0 ? 15 : 0);
  const discountAmount = checkoutDiscount.amount || 0;
  const discountCode = checkoutDiscount.code || null;
  const total = Math.max(0, subtotal + deliveryFee - discountAmount);
  const orderCode = 'OD' + Date.now().toString().slice(-8);
  const dropLat = checkoutGpsCoords ? checkoutGpsCoords.lat : null;
  const dropLng = checkoutGpsCoords ? checkoutGpsCoords.lng : null;

  if (dataSource === 'supabase' && supabaseClient && state.customerId) {
    try {
      if (custName || custPhone) {
        await supabaseClient.from('customers').update({
          name: custName || undefined, phone: custPhone || undefined, address: addr,
        }).eq('id', state.customerId);
      }
      const { data: orderRow, error: orderErr } = await supabaseClient
        .from('orders')
        .insert({
          order_code: orderCode, customer_id: state.customerId, restaurant_id: r.id,
          status: 'pending', subtotal, delivery_fee: deliveryFee, total,
          address: addr, payment_method: checkoutPayment, note,
          is_self_delivery: isSelfDelivery, dropoff_lat: dropLat, dropoff_lng: dropLng,
          discount_code: discountCode, discount_amount: discountAmount,
        })
        .select().single();
      if (orderErr) throw orderErr;
      const itemsPayload = cartLines.map(i => ({
        order_id: orderRow.id, menu_item_id: i.menu_item_id, name: i.name, emoji: i.emoji, qty: i.qty, price: i.price,
      }));
      const { error: itemsErr } = await supabaseClient.from('order_items').insert(itemsPayload);
      if (itemsErr) throw itemsErr;
      if (discountCode) { try { await supabaseClient.rpc('increment_promo_usage', { p_code: discountCode }); } catch(e) { console.warn(e); } }

      const order = {
        id: orderRow.id, code: orderRow.order_code, restaurantId: r.id, restaurantName: r.name, restaurantEmoji: r.emoji,
        items: cartLines, subtotal, deliveryFee, discountAmount, discountCode, total, address: addr, payment: checkoutPayment,
        date: new Date().toLocaleString('th-TH'), status: 'pending', riderId: null, isSelfDelivery,
        dropoffLat: dropLat, dropoffLng: dropLng,
      };
      state.orders.unshift(order);
      state.activeOrder = order;
      clearCart(); resetCheckoutExtras(); activeSheet = null;
      setView('tracking');
      subscribeToOrder(order.id);
      showToast('สั่งซื้อสำเร็จ! ' + (isSelfDelivery ? 'ร้านค้าได้รับออเดอร์ของคุณแล้ว' : 'กำลังหาไรเดอร์ให้คุณ'));
    } catch (err) {
      console.error(err);
      showToast('สั่งซื้อไม่สำเร็จ ลองใหม่อีกครั้ง');
    }
  } else {
    // dataSource เป็น supabase แต่ยังไม่มี customerId (มักเกิดจากยังไม่เปิด anonymous sign-in) หรือยังไม่เชื่อม Supabase เลย
    // จำลองสถานะในเครื่องนี้เท่านั้น ไม่ถูกส่งไปที่ร้านค้า/ไรเดอร์จริง
    const order = {
      id: orderCode, code: orderCode, restaurantId: r.id, restaurantName: r.name, restaurantEmoji: r.emoji,
      items: cartLines, subtotal, deliveryFee, discountAmount, discountCode, total, address: addr, payment: checkoutPayment,
      date: new Date().toLocaleString('th-TH'), status: 'pending', riderId: null, demo: true, isSelfDelivery,
    };
    state.orders.unshift(order);
    state.activeOrder = order;
    saveOrders();
    clearCart(); resetCheckoutExtras(); activeSheet = null;
    setView('tracking');
    if (dataSource === 'supabase' && !state.customerId) {
      showToast('⚠️ ยังสั่งจริงไม่ได้ — ต้องเปิด Allow anonymous sign-ins ใน Supabase ก่อน (ตอนนี้เป็นแค่ตัวอย่าง)');
    }
    simulateProgressDemo(order);
  }
}

function simulateProgressDemo(order) {
  let idx = 0;
  const timer = setInterval(() => {
    idx++;
    if (idx >= STATUS_ORDER.length) { clearInterval(timer); return; }
    const o = state.orders.find(x => x.id === order.id);
    if (!o) { clearInterval(timer); return; }
    o.status = STATUS_ORDER[idx];
    saveOrders();
    if (state.view === 'tracking' && state.activeOrder && state.activeOrder.id === order.id) {
      state.activeOrder = o; render();
    }
  }, 2600);
}

/* ============ REALTIME (Supabase) ============ */
function subscribeToOrder(orderId) {
  if (!supabaseClient) return;
  if (orderChannel) { supabaseClient.removeChannel(orderChannel); orderChannel = null; }
  orderChannel = supabaseClient
    .channel('order_track_' + orderId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${orderId}` }, async payload => {
      const o = state.orders.find(x => x.id === orderId);
      if (!o) return;
      o.status = payload.new.status;
      o.riderId = payload.new.rider_id;
      if (state.activeOrder && state.activeOrder.id === orderId) state.activeOrder = o;
      if (o.riderId && !o.riderInfo) await fetchRiderInfo(o);
      if (o.riderId) subscribeToRiderGps(o.riderId);
      if (state.view === 'tracking') render();
    })
    .subscribe();
  subscribeCallChannel(orderId);
  subscribeChatMessages(orderId);
  loadChatMessages(orderId);
}
async function fetchRiderInfo(order) {
  try {
    const { data, error } = await supabaseClient.from('riders').select('name,plate,rating,phone').eq('id', order.riderId).maybeSingle();
    if (error) throw error;
    order.riderInfo = data;
  } catch (err) { console.warn('fetchRiderInfo failed', err); }
}
let lastEtaCheck = 0;
let etaMinutes = null;
async function computeOsrmEta(originLat, originLng, destLat, destLng) {
  const now = Date.now();
  if (now - lastEtaCheck < 15000) return; // จำกัดไม่ให้ยิง OSRM ถี่เกินไป
  lastEtaCheck = now;
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${originLng},${originLat};${destLng},${destLat}?overview=false`;
    const res = await fetch(url);
    const data = await res.json();
    if (data && data.routes && data.routes[0]) {
      etaMinutes = Math.max(1, Math.round(data.routes[0].duration / 60));
      const etaEl = document.getElementById('eta-text');
      if (etaEl) etaEl.textContent = `ประมาณ ${etaMinutes} นาที`;
    }
  } catch (err) { console.warn('OSRM ETA failed', err); }
}
function subscribeToRiderGps(riderId) {
  if (!supabaseClient || !riderId) return;
  if (gpsChannel) { supabaseClient.removeChannel(gpsChannel); gpsChannel = null; }
  gpsChannel = supabaseClient
    .channel('gps_track_' + riderId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gps_locations', filter: `rider_id=eq.${riderId}` }, payload => {
      const row = payload.new;
      if (!row || !liveMap) return;
      if (!riderMarker) riderMarker = L.marker([row.lat, row.lng], { icon: carIconRef }).addTo(liveMap);
      else riderMarker.setLatLng([row.lat, row.lng]);
      liveMap.panTo([row.lat, row.lng]);
      const o = state.activeOrder;
      if (o && o.dropoffLat && o.dropoffLng) computeOsrmEta(row.lat, row.lng, o.dropoffLat, o.dropoffLng);
    })
    .subscribe();
}
async function refreshMyOrders() {
  try {
    const { data, error } = await supabaseClient
      .from('orders')
      .select('id,order_code,status,subtotal,delivery_fee,total,address,payment_method,created_at,rider_id,is_self_delivery,dropoff_lat,dropoff_lng,discount_code,discount_amount,restaurants(name,emoji),order_items(name,emoji,qty,price)')
      .eq('customer_id', state.customerId)
      .order('created_at', { ascending: false })
      .limit(30);

    state.orders = (data || []).map(o => ({

      restaurantName: o.restaurants ? o.restaurants.name : 'ร้านค้า',

      address: o.address, payment: o.payment_method, date: new Date(o.created_at).toLocaleString('th-TH'),
      riderId: o.rider_id, riderInfo: null, isSelfDelivery: o.is_self_delivery,
      dropoffLat: o.dropoff_lat, dropoffLng: o.dropoff_lng,
      discountCode: o.discount_code, discountAmount: o.discount_amount,
    }));
  } catch (err) { console.warn('refresh orders failed', err); }
}

async function useGpsForAddress(){
  if (!('geolocation' in navigator)) { showToast('อุปกรณ์นี้ไม่รองรับ GPS'); return; }
  const label = document.getElementById('gps-status-label');
  if (label) label.textContent = '📡 กำลังค้นหาตำแหน่ง...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    checkoutGpsCoords = { lat, lng };
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=th`);
      const data = await res.json();
      const addrInput = document.getElementById('addr-input');
      if (data && data.display_name && addrInput) addrInput.value = data.display_name;
      if (label) label.textContent = '✅ ปักหมุดตำแหน่งปัจจุบันแล้ว — ตรวจสอบที่อยู่ก่อนสั่งซื้อ';
      showToast('📍 ใช้ตำแหน่งปัจจุบันแล้ว');
    } catch (err) {
      console.warn('reverse geocode failed', err);
      if (label) label.textContent = '✅ ได้พิกัดแล้ว (กรอกที่อยู่เพิ่มเติมเองได้)';
    }
  }, () => {
    if (label) label.textContent = '⚠️ ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาอนุญาตสิทธิ์ GPS';
    showToast('ไม่สามารถเข้าถึงตำแหน่งได้');
  }, { enableHighAccuracy: true, timeout: 8000 });
}
async function applyDiscountCode(){
  const input = document.getElementById('discount-input');
  const code = input ? input.value.trim() : '';
  const label = document.getElementById('discount-status-label');
  if (!code) { checkoutDiscount = { code: null, amount: 0 }; openSheet('checkout'); return; }
  if (dataSource !== 'supabase' || !supabaseClient) { showToast('ใช้โค้ดได้เฉพาะโหมดเชื่อมฐานข้อมูลจริง'); return; }
  const subtotal = cartSubtotal();
  try {
    const { data, error } = await supabaseClient.rpc('validate_promo_code', { p_code: code, p_subtotal: subtotal });
    if (error) throw error;
    const result = Array.isArray(data) ? data[0] : data;
    if (result && result.valid) {
      checkoutDiscount = { code: code.toUpperCase(), amount: Number(result.discount) };
      showToast('✅ ' + result.message);
    } else {
      checkoutDiscount = { code: null, amount: 0 };
      showToast('⚠️ ' + (result ? result.message : 'โค้ดไม่ถูกต้อง'));
    }
  } catch (err) {
    console.error(err); showToast('ตรวจสอบโค้ดไม่สำเร็จ');
  }
  openSheet('checkout');
}

/* ============ RENDER: TRACKING WITH LIVE MAP ============ */
function renderTracking() {
  const o = state.activeOrder || state.orders[0];
  if (!o) return `<div class="empty-state">ไม่พบคำสั่งซื้อ</div>`;
  const statusMap = o.isSelfDelivery ? STATUS_MAP_SELF : STATUS_MAP;
  const info = statusMap[o.status] || statusMap.pending;
  const STAGE_ICONS = ['👨‍🍳','🛵','✅'];
  setTimeout(() => initLiveTrackingMap(o), 100);
  return `
  ${topbar()}
  <div class="track-wrap">
    <div class="track-header">
      <div class="track-order-code">#${o.code || o.id}</div>
      ${o.status!=='delivered' && o.status!=='cancelled' && !o.demo ? `<div class="gpr-indicator"><span class="gpr-dot"></span>GPRS</div>` : ''}
    </div>
    <div class="track-card">
      <div class="track-emoji">${info.emoji}</div>
      <div class="track-status">${info.label}</div>
      <div class="track-sub">${o.status==='cancelled' ? 'ติดต่อร้านค้าหรือฝ่ายบริการลูกค้า' : (o.status==='delivered' ? 'ขอบคุณที่ใช้บริการอิ่มด่วน 🎉' : (o.demo ? 'โหมดตัวอย่าง (ยังไม่เชื่อมฐานข้อมูล)' : 'ระบบจะอัปเดตสถานะให้อัตโนมัติ'))}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${info.pct}%"></div></div>

      <div class="stage-row">
        ${TRACK_STAGES.map((label,i) => `
          <div class="stage-item ${info.stage>i?'done':(info.stage===i?'active':'')}">
            <div class="stage-dot">${info.stage>i?'✓':STAGE_ICONS[i]}</div>
            <div class="stage-label">${label}</div>
          </div>`).join('')}
      </div>

      ${(o.status==='picked_up') ? `<div class="eta-badge">⏱️ <span id="eta-text">${etaMinutes ? 'ประมาณ '+etaMinutes+' นาที' : 'กำลังคำนวณเวลา...'}</span></div>` : ''}
      <div class="order-id">เลขคำสั่งซื้อ #${o.code || o.id}${o.isSelfDelivery ? ' · จัดส่งโดยร้านค้าเอง' : ''}</div>
    </div>
    <div id="live-tracking-map"></div>

    ${(!o.isSelfDelivery && (o.status==='preparing' || o.status==='ready' || o.status==='picked_up') || o.isSelfDelivery && (o.status==='ready' || o.status==='picked_up')) ? `
    <div class="driver-card">
      <div class="driver-avatar">${o.isSelfDelivery ? '🏪' : '🏍️'}</div>
      <div>
        <div class="driver-name">${o.riderInfo ? o.riderInfo.name : (o.isSelfDelivery ? o.restaurantName : 'กำลังมอบหมายไรเดอร์...')}</div>
        <div class="driver-meta">${o.riderInfo ? `ทะเบียน ${o.riderInfo.plate||'-'} • คะแนน ${o.riderInfo.rating||'-'} ★` : (o.isSelfDelivery ? 'ทีมจัดส่งของร้าน' : '')}</div>
      </div>
      ${!o.isSelfDelivery && o.riderId ? `
      <div class="driver-actions">
        <button class="driver-btn call" onclick="startCall()"><i>📞</i></button>
        <button class="driver-btn chat" onclick="openChat()"><i>💬</i></button>
      </div>` : ''}
    </div>` : ''}

    <div class="section-title" style="padding:0;margin-top:16px;"><h2>สรุปคำสั่งซื้อ</h2></div>
    <div class="order-card" style="margin-top:8px">
      <div class="order-card-top"><span style="font-weight:700">${o.restaurantEmoji} ${o.restaurantName}</span></div>
      <div class="order-card-items">${o.items.map(i => `${i.qty}× ${i.name}`).join(', ')}</div>
      <div class="order-card-bottom"><span>ส่งไปที่ ${o.address}</span></div>
      ${o.discountAmount>0 ? `<div class="order-card-bottom"><span style="color:var(--primary)">ส่วนลด (${o.discountCode})</span><span style="color:var(--primary)">-${money(o.discountAmount)}</span></div>` : ''}
      <div class="order-card-bottom"><b>รวม ${money(o.total)}</b></div>
    </div>
    <button class="btn-secondary" onclick="setView('home')">กลับหน้าแรก สั่งเพิ่ม</button>
  </div>

  `;
}
function initLiveTrackingMap(o) {
  const mapContainer = document.getElementById('live-tracking-map');
  if (!mapContainer || typeof L === 'undefined' || liveMap) return;
  liveMap = L.map('live-tracking-map').setView([13.7563, 100.5018], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(liveMap);
  carIconRef = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3097/3097180.png', iconSize: [38,38], iconAnchor: [19,19] });
  if (o && o.dropoffLat && o.dropoffLng) {
    L.marker([o.dropoffLat, o.dropoffLng]).addTo(liveMap).bindPopup('จุดส่งของคุณ');
    liveMap.setView([o.dropoffLat, o.dropoffLng], 14);
  }
  if (o && o.riderId) subscribeToRiderGps(o.riderId);
}

/* ============ RENDER: ORDERS HISTORY ============ */
function renderOrders() {
  return `
  ${topbar()}
  <div class="section-title"><h2>ประวัติคำสั่งซื้อ</h2></div>
  ${state.orders.length === 0 ? `
    <div class="empty-state"><div class="e">🧾</div><h3>ยังไม่มีคำสั่งซื้อ</h3><p>เมื่อคุณสั่งอาหาร ประวัติจะแสดงที่นี่</p></div>
  ` : `
  <div class="orders-list">
    ${state.orders.map(o => {
      const statusMap = o.isSelfDelivery ? STATUS_MAP_SELF : STATUS_MAP;
      const info = statusMap[o.status] || statusMap.pending;
      const done = o.status === 'delivered' || o.status === 'cancelled';
      return `
      <div class="order-card" onclick="openOrderTracking('${o.id}')">
        <div class="order-card-top">

  <div style="height:100px"></div>

/* ============ MAIN RENDER ============ */
function render() {
  const app = document.getElementById('app');
  if (state.loading) { app.innerHTML = `<div class="empty-state"><div class="e">⏳</div><h3>กำลังโหลดร้านอาหาร...</h3></div>`; return; }
  let html = '';
  if (state.view === 'home') html = renderHome();
  if (state.view === 'detail') html = renderDetail();
  if (state.view === 'tracking') html = renderTracking();
  if (state.view === 'orders') html = renderOrders();

  let fab = '';
  if ((state.view === 'home' || state.view === 'detail') && cartCount() > 0 && !activeSheet) {
    const r = findRestaurant(state.cart.restaurantId);
    fab = `<button class="cart-fab" onclick="openCartSheet()">
      <span>🛒 ${cartCount()} รายการ · ${r ? r.name : ''}</span>
      <span>${money(cartSubtotal())} ›</span>
    </button>`;
  }
  let nav = (state.view === 'home' || state.view === 'detail') ? bottomNav() : '';
  if (state.view === 'detail') nav = '';

  app.innerHTML = html + fab + nav;

  let overlayEl = document.getElementById('overlay-root');
  if (overlayEl) overlayEl.remove();
  if (activeSheet) {
    const div = document.createElement('div');
    div.id = 'overlay-root'; div.className = 'overlay';
    div.onclick = (e) => { if (e.target === div) closeSheet(); };
    div.innerHTML = activeSheet === 'cart' ? cartSheetHtml() : (activeSheet === 'profile' ? profileSheetHtml() : checkoutSheetHtml());
    document.body.appendChild(div);
  }

  let chatEl = document.getElementById('chat-root');
  if (chatEl) chatEl.remove();
  if (chatOpen) {
    const div = document.createElement('div');
    div.id = 'chat-root';
    div.innerHTML = chatDrawerHtml();
    document.body.appendChild(div);
    scrollChatToBottom();
  }

  let callEl = document.getElementById('call-root');
  if (callEl) callEl.remove();
  if (callOpen) {
    const div = document.createElement('div');
    div.id = 'call-root';
    div.innerHTML = callModalHtml();
    document.body.appendChild(div);
  }
}

/* ============ INIT ============ */
init();
