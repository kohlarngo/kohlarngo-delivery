<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แอปไรเดอร์ — อิ่มด่วน (GPS Tracking Enabled)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<style>
  :root{
    --bg:#FBF3E7; --surface:#FFFFFF; --surface-2:#FFF9F0; --text:#241B15; --text-muted:#7A6A57;
    --primary:#1F7A4D; --primary-ink:#FFFFFF; --accent:#DD3B1F; --secondary:#F2A93B;
    --border:#E4DDC8; --shadow:0 1px 2px rgba(36,27,21,.06); --radius-s:8px; --radius-m:14px; --radius-l:22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#101613; --surface:#1B2320; --surface-2:#212A26; --text:#EDF3EE; --text-muted:#A9BBB0; --primary:#3DDC84; --primary-ink:#101613; --accent:#FF6A3D; --secondary:#FFC94D; --border:#2C3733; color-scheme: dark; }
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans Thai',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px;}
  h1,h2,h3{font-family:'Archivo Black','Noto Sans Thai',sans-serif;font-weight:400;margin:0;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;}

  .wrap{max-width:460px;margin:0 auto;position:relative;min-height:100vh;background:var(--bg);}
  @media (min-width:700px){ .wrap{max-width:520px;box-shadow:0 0 60px rgba(0,0,0,.08);} }

  .topbar{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .who .name{font-size:14px;font-weight:800;}
  .who .plate{font-size:11px;color:var(--text-muted);}
  .online-box{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:6px 6px 6px 12px;border-radius:999px;box-shadow:var(--shadow);}
  .online-label{font-size:12px;font-weight:700;}
  .switch{width:38px;height:22px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;border:none;}
  .switch.on{background:var(--primary);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on::after{transform:translateX(16px);}

  .earn-strip{margin:4px 18px 16px;background:linear-gradient(135deg,var(--primary),#2fae72 130%);color:#fff;border-radius:var(--radius-l);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;}
  .earn-strip .big{font-family:'Archivo Black';font-size:24px;}
  .earn-strip .lbl{font-size:11.5px;opacity:.85;margin-top:2px;}
  .earn-strip .trips{text-align:right;font-size:12px;opacity:.9;}

  .section-title{padding:0 18px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline;}
  .section-title h2{font-size:16px;}
  .section-title span{font-size:11.5px;color:var(--text-muted);}

  .job-card{margin:0 18px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
  .job-top{display:flex;justify-content:space-between;align-items:center;}
  .job-restaurant{font-size:14px;font-weight:800;}
  .job-fee{font-size:15px;font-weight:800;color:var(--primary);}
  .job-route{font-size:12px;color:var(--text-muted);margin-top:8px;line-height:1.7;}
  .job-route .dotline{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text-muted);margin-right:6px;}
  .job-meta{display:flex;gap:12px;font-size:11.5px;color:var(--text-muted);margin-top:8px;}
  .btn-accept{margin-top:12px;width:100%;background:var(--primary);color:var(--primary-ink);border:none;padding:11px;border-radius:999px;font-weight:800;font-size:13.5px;}

  .gps-box {
    margin: 10px 18px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .gps-status { font-size: 12px; font-weight: 700; color: var(--primary); }

  .empty-state{text-align:center;padding:60px 30px;color:var(--text-muted);}
  .empty-state .e{font-size:44px;margin-bottom:10px;}
  .empty-state h3{font-size:15px;color:var(--text);margin-bottom:6px;}

  .job-active-card{margin:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:20px;text-align:center;}
  .ff-label{font-size:12px;font-weight:700;color:var(--text-muted);margin:12px 0 6px;text-align:left;}
  .ff-input, select.ff-input{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);font-family:inherit;box-sizing:border-box;}
  .ff-row{display:flex;gap:10px;}
  .ff-row .ff-input{flex:1;}
  .ff-section{font-size:13px;font-weight:800;color:var(--primary);text-align:left;margin:20px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .ff-img-preview{display:none;width:100%;max-height:140px;object-fit:cover;border-radius:10px;margin-top:8px;}
  .ff-hint{font-size:11px;color:var(--text-muted);margin-top:6px;text-align:left;}
  .job-active-emoji{font-size:48px;}
  .job-active-status{font-size:17px;font-weight:800;font-family:'Archivo Black';margin-top:8px;}
  .job-active-sub{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5;}

  /* ---------- Voice call overlay ---------- */
  .call-overlay { position: fixed; inset: 0; background: linear-gradient(160deg, #1a2e22, #0d1712); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 30px; }
  .call-avatar { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 18px; }
  .call-name { font-size: 19px; font-weight: 800; }
  .call-status { font-size: 13px; opacity: .75; margin-top: 6px; }
  .call-timer { font-size: 28px; font-weight: 800; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .call-actions { display: flex; gap: 22px; margin-top: 36px; }
  .call-btn { width: 58px; height: 58px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; cursor: pointer; }
  .call-btn.accept { background: #22C55E; }
  .call-btn.decline, .call-btn.hangup { background: #EF4444; }
  .call-btn.mute { background: rgba(255,255,255,.18); font-size: 20px; }
  .call-btn-label { font-size: 10.5px; margin-top: 6px; opacity: .8; }
  .call-btn-wrap { display: flex; flex-direction: column; align-items: center; }

  /* ---------- Chat drawer ---------- */
  .chat-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 150; display: flex; align-items: flex-end; justify-content: center; }
  .chat-sheet { background: var(--bg); width: 100%; max-width: 460px; height: 78vh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .chat-sheet-title { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .chat-sheet-close { border: none; background: var(--surface-2); width: 30px; height: 30px; border-radius: 50%; font-size: 14px; }
  .chat-msg-row { display: flex; margin-bottom: 10px; }
  .chat-msg-row.mine { justify-content: flex-end; }
  .chat-bubble { max-width: 75%; padding: 9px 13px; border-radius: 16px; font-size: 13px; line-height: 1.4; }
  .chat-msg-row.mine .chat-bubble { background: var(--primary); color: var(--primary-ink); border-bottom-right-radius: 4px; }
  .chat-msg-row.theirs .chat-bubble { background: var(--surface-2); color: var(--text); border-bottom-left-radius: 4px; }
  .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .chat-input-row input { flex: 1; border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 10px 16px; font-size: 13px; color: var(--text); font-family: inherit; }
  .chat-send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); border: none; flex-shrink: 0; font-size: 16px; }
  .route-card{margin:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;}
  .route-step{display:flex;gap:10px;align-items:flex-start;padding:6px 0;}
  .route-dot{width:10px;height:10px;border-radius:50%;background:var(--border);margin-top:4px;flex-shrink:0;}
  .route-step.done .route-dot{background:var(--primary);}
  .route-line{width:2px;background:var(--border);margin-left:4px;height:20px;}
  .btn-big{margin:14px 18px 0;display:block;width:calc(100% - 36px);background:var(--primary);color:var(--primary-ink);border:none;padding:14px;border-radius:999px;font-weight:800;font-size:14.5px;}

  .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;}
  @media (min-width:700px){ .bottom-nav{max-width:520px;} }
  .nav-btn{flex:1;border:none;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font-size:10px;font-weight:600;}
  .nav-btn.active{color:var(--primary);}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* Supabase Configuration */
const SUPABASE_URL = 'https://onvrqsyoykopwjunvrhr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v2MCVFaUm-1s6xD6og_eKg_S1vBU4SF';
let supabaseClient = null;
try {
  if (SUPABASE_KEY.indexOf('นำ_ANON_PUBLIC_KEY') === -1 && typeof window.supabase !== 'undefined') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (err) { console.warn('Supabase Init Error:', err); }
const dataSource = supabaseClient ? 'supabase' : 'mock';

let state = {
  view: 'loading',    // loading | auth | setup-profile | pending | jobs
  authMode: 'login',   // login | signup
  user: null,
  riderId: null,
  riderName: '',
  riderPlate: '',
  online: false,
  availableJobs: [],
  activeJob: null,
  todayEarnings: 0,
  todayTrips: 0,
};
let watchGpsId = null;
let gpsActive = false;
let ordersChannel = null;

/* ============ CALL / CHAT (Agora RTC + Supabase Realtime สำหรับสัญญาณเรียกเข้า) ============ */
const AGORA_APP_ID = '370aa664b73149a5ae69717073df6ddc';
let agoraClient = null;
let localAudioTrack = null;
let callChannel = null;
let callChannelOrderId = null;
let callState = 'idle'; // idle | calling | ringing | connected
let callOpen = false;
let callTimerHandle = null;
let callSeconds = 0;
let micMuted = false;
let ringInterval = null;
let chatChannel = null;
let chatChannelOrderId = null;
let chatMessages = [];
let chatOpen = false;

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),1700);
}

/* ============ CALL (Agora RTC ส่งเสียงจริง + Supabase Realtime แค่ใช้แจ้งสายเรียกเข้า) ============ */
function subscribeCallChannel(orderId) {
  if (!supabaseClient) return;
  if (callChannel && callChannelOrderId === orderId) return;
  if (callChannel) { supabaseClient.removeChannel(callChannel); callChannel = null; }
  callChannelOrderId = orderId;
  callChannel = supabaseClient.channel('call_' + orderId);
  callChannel
    .on('broadcast', { event: 'call-offer' }, ({ payload }) => { if (payload.from !== 'rider') handleIncomingOffer(); })
    .on('broadcast', { event: 'call-answer' }, ({ payload }) => { if (payload.from !== 'rider') handleCallAnswer(); })
    .on('broadcast', { event: 'call-end' }, ({ payload }) => { if (payload.from !== 'rider') endCallLocal(); })
    .subscribe();
}
function unsubscribeCallChannel() {
  if (callChannel) { supabaseClient.removeChannel(callChannel); callChannel = null; callChannelOrderId = null; }
  endCallLocal();
}
function getAgoraClient() {
  if (!agoraClient) agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
  return agoraClient;
}
async function joinAgoraChannel(orderId) {
  const client = getAgoraClient();
  client.removeAllListeners();
  client.on('user-published', async (user, mediaType) => {
    await client.subscribe(user, mediaType);
    if (mediaType === 'audio') {
      user.audioTrack.play();
      if (callState !== 'connected') { callState = 'connected'; startCallTimer(); render(); }
    }
  });
  client.on('user-left', () => { endCallLocal(); });
  await client.join(AGORA_APP_ID, 'order_' + orderId, null, null);
  localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
  await client.publish([localAudioTrack]);
}
async function leaveAgoraChannel() {
  if (localAudioTrack) { localAudioTrack.close(); localAudioTrack = null; }
  if (agoraClient) { try { await agoraClient.leave(); } catch (e) { console.warn(e); } }
}
function formatCallTime(sec) { const m = Math.floor(sec/60), s = sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function startCallTimer() {
  callSeconds = 0;
  callTimerHandle = setInterval(() => {
    callSeconds++;
    const el = document.getElementById('call-timer-text');
    if (el) el.textContent = formatCallTime(callSeconds);
  }, 1000);
}
function playRingtone(){ playAlertSound(); ringInterval = setInterval(playAlertSound, 2000); }
function stopRingtone(){ clearInterval(ringInterval); ringInterval = null; }

async function startCall() {
  if (!callChannel || !state.activeJob) { showToast('ยังเชื่อมต่อระบบโทรไม่ได้ ลองใหม่อีกครั้ง'); return; }
  if (callState !== 'idle') return;
  callState = 'calling'; callOpen = true; render();
  try {
    await joinAgoraChannel(state.activeJob.id);
  } catch (err) {
    console.error(err); showToast('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตสิทธิ์');
    callState = 'idle'; callOpen = false; render(); return;
  }
  callChannel.send({ type: 'broadcast', event: 'call-offer', payload: { from: 'rider' } });
}
function handleIncomingOffer() {
  if (callState !== 'idle') return;
  callState = 'ringing'; callOpen = true; render();
  playRingtone();
}
async function acceptCall() {
  stopRingtone();
  callOpen = true; render();
  try {
    await joinAgoraChannel(state.activeJob.id);
  } catch (err) { console.error(err); showToast('ไม่สามารถเข้าถึงไมโครโฟนได้'); declineCall(); return; }
  callChannel.send({ type: 'broadcast', event: 'call-answer', payload: { from: 'rider' } });
  callState = 'connected'; startCallTimer(); render();
}
function declineCall() {
  stopRingtone();
  if (callChannel) callChannel.send({ type: 'broadcast', event: 'call-end', payload: { from: 'rider' } });
  callState = 'idle'; callOpen = false; render();
}
function handleCallAnswer() {
  if (callState === 'calling') { callState = 'connected'; startCallTimer(); render(); }
}
function endCall() {
  if (callChannel) callChannel.send({ type: 'broadcast', event: 'call-end', payload: { from: 'rider' } });
  endCallLocal();
}
async function endCallLocal() {
  stopRingtone();
  await leaveAgoraChannel();
  clearInterval(callTimerHandle); callTimerHandle = null; callSeconds = 0; micMuted = false;
  callState = 'idle'; callOpen = false;
  render();
}
function toggleMute() {
  if (!localAudioTrack) return;
  micMuted = !micMuted;
  localAudioTrack.setEnabled(!micMuted);
  render();
}
function callModalHtml() {
  if (!callOpen) return '';
  const name = 'ลูกค้า';
  let body = '';
  if (callState === 'calling') {
    body = `<div class="call-status">กำลังโทรออก...</div>
    <div class="call-actions"><div class="call-btn-wrap"><button class="call-btn hangup" onclick="endCall()">✕</button><span class="call-btn-label">วางสาย</span></div></div>`;
  } else if (callState === 'ringing') {
    body = `<div class="call-status">มีสายเรียกเข้า</div>
    <div class="call-actions">
      <div class="call-btn-wrap"><button class="call-btn decline" onclick="declineCall()">✕</button><span class="call-btn-label">ปฏิเสธ</span></div>
      <div class="call-btn-wrap"><button class="call-btn accept" onclick="acceptCall()">📞</button><span class="call-btn-label">รับสาย</span></div>
    </div>`;
  } else if (callState === 'connected') {
    body = `<div class="call-status">กำลังคุยอยู่</div>
    <div class="call-timer" id="call-timer-text">00:00</div>
    <div class="call-actions">
      <div class="call-btn-wrap"><button class="call-btn mute" onclick="toggleMute()">${micMuted?'🔇':'🎙️'}</button><span class="call-btn-label">${micMuted?'เปิดไมค์':'ปิดไมค์'}</span></div>
      <div class="call-btn-wrap"><button class="call-btn hangup" onclick="endCall()">✕</button><span class="call-btn-label">วางสาย</span></div>
    </div>`;
  }
  return `
  <div class="call-overlay">
    <div class="call-avatar">🙂</div>
    <div class="call-name">${name}</div>
    ${body}
  </div>`;
}

/* ============ CHAT ============ */
function subscribeChatMessages(orderId) {
  if (!supabaseClient) return;
  if (chatChannel && chatChannelOrderId === orderId) return;
  if (chatChannel) { supabaseClient.removeChannel(chatChannel); chatChannel = null; }
  chatChannelOrderId = orderId;
  chatChannel = supabaseClient.channel('chat_' + orderId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'order_messages', filter: `order_id=eq.${orderId}` }, payload => {
      chatMessages.push(payload.new);
      if (chatOpen) render();
      else if (payload.new.sender_role !== 'rider') { playAlertSound(); showToast('💬 ข้อความใหม่จากลูกค้า'); }
    })
    .subscribe();
}
function unsubscribeChatMessages() {
  if (chatChannel) { supabaseClient.removeChannel(chatChannel); chatChannel = null; chatChannelOrderId = null; }
  chatMessages = []; chatOpen = false;
}
async function loadChatMessages(orderId) {
  try {
    const { data, error } = await supabaseClient.from('order_messages').select('*').eq('order_id', orderId).order('created_at', { ascending: true });
    if (error) throw error;
    chatMessages = data || [];
  } catch (err) { console.warn('loadChatMessages failed', err); }
}
function openChat() { chatOpen = true; render(); setTimeout(scrollChatToBottom, 50); }
function closeChat() { chatOpen = false; render(); }
function scrollChatToBottom() {
  const el = document.getElementById('chat-messages');
  if (el) el.scrollTop = el.scrollHeight;
}
async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input || !state.activeJob) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    const { error } = await supabaseClient.from('order_messages').insert({
      order_id: state.activeJob.id, sender_role: 'rider', sender_id: state.riderId, message: text,
    });
    if (error) throw error;
  } catch (err) { console.error(err); showToast('ส่งข้อความไม่สำเร็จ'); }
}
function chatDrawerHtml() {
  return `
  <div class="chat-overlay" onclick="if(event.target===this) closeChat()">
    <div class="chat-sheet">
      <div class="chat-sheet-title"><h2 style="font-size:15px;font-weight:800;">แชทกับลูกค้า</h2><button class="chat-sheet-close" onclick="closeChat()">✕</button></div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px 16px;">
        ${chatMessages.length === 0 ? `<div class="empty-state"><div class="e">💬</div><h3>เริ่มแชทได้เลย</h3></div>` :
          chatMessages.map(m => `<div class="chat-msg-row ${m.sender_role==='rider'?'mine':'theirs'}"><div class="chat-bubble">${m.message}</div></div>`).join('')}
      </div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key==='Enter'){sendChatMessage();}">
        <button class="chat-send-btn" onclick="sendChatMessage()">➤</button>
      </div>
    </div>
  </div>`;
}
function usernameToEmail(username) {
  const norm = username.trim().toLowerCase();
  let hash = 5381;
  for (let i = 0; i < norm.length; i++) { hash = ((hash << 5) + hash + norm.charCodeAt(i)) >>> 0; }
  const slug = norm.replace(/[^a-z0-9]/g, '').slice(0, 20) || 'u';
  // หมายเหตุ: เดิมใช้โดเมน "riders.imduan.internal" แต่ .internal เป็น TLD ที่สงวนไว้
  // (reserved TLD ตาม RFC 6761 เหมือน .local/.test/.invalid) ทำให้ Supabase Auth ปฏิเสธ
  // อีเมลนี้เวลาต้องส่งอีเมลจริง เช่น "Send password recovery" (error: "Email address ... is invalid")
  // เปลี่ยนมาใช้โดเมนที่ไม่ถูกสงวนแทน เพื่อให้ signUp/signIn/reset password ทำงานได้ปกติ
  return `${slug}${hash.toString(36)}@riders.imduan-app.com`;
}

/* ============ DATA REFRESH (Supabase) ============ */
async function refreshAll(){ await Promise.all([refreshAvailableJobs(), refreshActiveJob(), refreshTodayStats()]); }
async function refreshAvailableJobs(){
  try {
    const { data, error } = await supabaseClient
      .from('orders')
      .select('id,order_code,delivery_fee,address,restaurants(name,emoji)')
      .eq('status', 'pending').is('rider_id', null).eq('is_self_delivery', false)
      .order('created_at', { ascending: true });
    if (error) throw error;
    state.availableJobs = (data||[]).map(o => ({
      id: o.id, code: o.order_code, fee: o.delivery_fee, dropoff: o.address,
      restaurant: o.restaurants ? o.restaurants.name : 'ร้านค้า', emoji: o.restaurants ? o.restaurants.emoji : '🍽️',
    }));
  } catch (err) { console.warn('refreshAvailableJobs failed', err); }
}
async function refreshActiveJob(){
  try {
    const { data, error } = await supabaseClient
      .from('orders')
      .select('id,order_code,status,delivery_fee,address,restaurants(name,emoji)')
      .eq('rider_id', state.riderId)
      .in('status', ['preparing','ready','picked_up'])
      .order('created_at', { ascending: false }).limit(1).maybeSingle();
    if (error) throw error;
    if (!data) {
      state.activeJob = null;
      unsubscribeCallChannel(); unsubscribeChatMessages();
      return;
    }
    const stepMap = { preparing: 0, ready: 1, picked_up: 2 };
    state.activeJob = {
      id: data.id, code: data.order_code, fee: data.delivery_fee, dropoff: data.address,
      restaurant: data.restaurants ? data.restaurants.name : 'ร้านค้า', emoji: data.restaurants ? data.restaurants.emoji : '🍽️',
      step: stepMap[data.status] ?? 0, dbStatus: data.status,
    };
    subscribeCallChannel(data.id);
    subscribeChatMessages(data.id);
    if (chatMessages.length === 0) loadChatMessages(data.id);
  } catch (err) { console.warn('refreshActiveJob failed', err); }
}
async function refreshTodayStats(){
  try {
    const start = new Date(); start.setHours(0,0,0,0);
    const { data, error } = await supabaseClient
      .from('orders').select('delivery_fee')
      .eq('rider_id', state.riderId).eq('status', 'delivered').gte('created_at', start.toISOString());
    if (error) throw error;
    state.todayTrips = (data||[]).length;
    state.todayEarnings = (data||[]).reduce((s,o)=>s+Number(o.delivery_fee||0),0);
  } catch (err) { console.warn('refreshTodayStats failed', err); }
}

/* ============ แจ้งเตือนงานใหม่ (เสียง + Notification เบราว์เซอร์) ============ */
let sharedAudioCtx = null;
function playAlertSound(){
  try {
    if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
    const ctx = sharedAudioCtx;
    const now = ctx.currentTime;
    [0, 0.18, 0.36].forEach((t) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + t);
      gain.gain.exponentialRampToValueAtTime(0.35, now + t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + t); osc.stop(now + t + 0.16);
    });
  } catch (e) { console.warn('เล่นเสียงไม่ได้', e); }
}
function ensureNotificationPermission(){
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') Notification.requestPermission();
}
function showBrowserNotification(title, body){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body }); } catch (e) { console.warn(e); }
}

function subscribeOrders(){
  if (!supabaseClient || ordersChannel) return;
  ordersChannel = supabaseClient
    .channel('rider_orders_watch')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, async (payload) => {
      if (state.view !== 'jobs') return;
      const newJobAvailable = payload.new && payload.new.status === 'pending' && !payload.new.rider_id && !payload.new.is_self_delivery;
      if (newJobAvailable && state.online && !state.activeJob) {
        playAlertSound();
        showBrowserNotification('🔔 มีงานใหม่เข้ามา!', 'มีออเดอร์รอไรเดอร์รับ');
        showToast('🔔 มีงานใหม่เข้ามา!');
      }
      const myJobReady = payload.new && payload.new.status === 'ready' && state.activeJob && payload.new.id === state.activeJob.id;
      if (myJobReady) {
        playAlertSound();
        showBrowserNotification('🍽️ อาหารพร้อมแล้ว!', 'ไปรับอาหารที่ร้านได้เลย');
        showToast('🍽️ อาหารพร้อมแล้ว! ไปรับได้เลย');
      }
      await refreshAll(); render();
    })
    .subscribe();
}

async function toggleOnline(){
  state.online = !state.online;
  if (dataSource === 'supabase') {
    try {
      await supabaseClient.from('riders').update({ status: state.online ? 'online' : 'offline' }).eq('id', state.riderId);
      if (state.online) await refreshAll();
    } catch (err) { console.warn(err); }
  }
  render();
}
async function toggleGpsTracking() {
  if (!gpsActive) {
    if ("geolocation" in navigator) {
      watchGpsId = navigator.geolocation.watchPosition(sendGpsToSupabase, handleGpsError, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
      gpsActive = true; showToast('📡 เปิดระบบส่งพิกัด GPS เรียบร้อย');
    } else { alert("อุปกรณ์นี้ไม่รองรับ GPS"); }
  } else {
    if (watchGpsId !== null) navigator.geolocation.clearWatch(watchGpsId);
    gpsActive = false; showToast('⏹️ ปิดการส่งพิกัด GPS');
  }
  render();
}
async function sendGpsToSupabase(position) {
  if (!supabaseClient || !state.riderId) return;
  const lat = position.coords.latitude, lng = position.coords.longitude;
  const { error } = await supabaseClient.from('gps_locations').upsert({ rider_id: state.riderId, lat, lng, updated_at: new Date() });
  if (error) console.error('GPS Update Error:', error);
}
function handleGpsError(err) { showToast('⚠️ ไม่สามารถเข้าถึง GPS กรุณากดอนุญาตสิทธิ์'); }

async function acceptJob(id){
  if (dataSource === 'mock') {
    const j = state.availableJobs.find(x=>x.id===id);
    if (!j) return;
    state.activeJob = {...j, step:0};
    state.availableJobs = state.availableJobs.filter(x=>x.id!==id);
    if (!gpsActive) toggleGpsTracking();
    render();
    return;
  }
  try {
    const { data, error } = await supabaseClient
      .from('orders').update({ rider_id: state.riderId, status: 'preparing' })
      .eq('id', id).is('rider_id', null).eq('status','pending').select();
    if (error) throw error;
    if (!data || data.length === 0) { showToast('งานนี้ถูกไรเดอร์คนอื่นรับไปแล้ว'); await refreshAvailableJobs(); render(); return; }
    if (!gpsActive) toggleGpsTracking();
    showToast('✅ รับงานแล้ว ร้านค้าได้รับแจ้งให้เริ่มปรุงอาหาร');
    await refreshAll(); render();
  } catch (err) { console.error(err); showToast('รับงานไม่สำเร็จ ลองใหม่อีกครั้ง'); }
}
async function advanceJob(){
  if (!state.activeJob) return;
  if (state.activeJob.dbStatus === 'preparing') { showToast('รอร้านค้ากดว่าอาหารพร้อมก่อน'); return; }
  if (dataSource === 'mock') {
    state.activeJob.step++;
    if (state.activeJob.step >= 3){
      state.todayEarnings += state.activeJob.fee; state.todayTrips++;
      showToast('ส่งอาหารสำเร็จ! ได้รับ '+state.activeJob.fee+' บาท');
      state.activeJob = null;
    }
    render();
    return;
  }
  const NEXT = { ready: 'picked_up', picked_up: 'delivered' };
  const next = NEXT[state.activeJob.dbStatus];
  if (!next) return;
  try {
    const { error } = await supabaseClient.from('orders').update({ status: next }).eq('id', state.activeJob.id);
    if (error) throw error;
    if (next === 'delivered') showToast('ส่งอาหารสำเร็จ! ได้รับ '+state.activeJob.fee+' บาท');
    await refreshAll(); render();
  } catch (err) { console.error(err); showToast('อัปเดตสถานะไม่สำเร็จ'); }
}

    <div class="ff-row">
      <div><div class="ff-label">ชื่อ</div><input id="sp-first" class="ff-input" placeholder="ชื่อจริง"></div>
      <div><div class="ff-label">นามสกุล</div><input id="sp-last" class="ff-input" placeholder="นามสกุล"></div>
    </div>
    <div class="ff-label">เบอร์โทรศัพท์</div>
    <input id="sp-phone" class="ff-input" type="tel" placeholder="08xxxxxxxx">
    <div class="ff-label">เลขบัตรประชาชน (13 หลัก)</div>
    <input id="sp-nid" class="ff-input" inputmode="numeric" maxlength="13" placeholder="1234567890123">
    <div class="ff-label">ภาพถ่ายบัตรประชาชน (เห็นหน้าบัตรชัดเจน ไม่สะท้อนแสง)</div>
    <input id="sp-idcard" type="file" accept="image/*" class="ff-input" onchange="previewFileTo('sp-idcard','sp-idcard-preview')">
    <img id="sp-idcard-preview" class="ff-img-preview">
    <div class="ff-label">ภาพถ่ายใบขับขี่</div>
    <input id="sp-license" type="file" accept="image/*" class="ff-input" onchange="previewFileTo('sp-license','sp-license-preview')">
    <img id="sp-license-preview" class="ff-img-preview">
    <div class="ff-label">วันหมดอายุใบขับขี่</div>
    <input id="sp-license-expiry" type="date" class="ff-input">
    <p class="ff-hint">🔒 รูปเอกสารถูกเก็บแบบส่วนตัว มีแต่คุณและแอดมินเท่านั้นที่เปิดดูได้</p>

    <div class="ff-section">ข้อมูลยานพาหนะ</div>
    <div class="ff-label">ประเภทพาหนะ</div>
    <select id="sp-vehicle" class="ff-input"><option value="">— เลือกประเภทพาหนะ —</option>${vehicleOptions}</select>
    <div class="ff-label">ป้ายทะเบียนรถ</div>
    <input id="sp-plate" class="ff-input" placeholder="เช่น 1กข 1234 กทม.">

    <button class="btn-accept" id="sp-submit-btn" style="margin-top:18px;" onclick="doSignup()">สมัครสมาชิก</button>
    <button class="btn-accept" style="margin-top:8px;background:transparent;color:var(--primary);" onclick="state.authMode='login';render()">
      มีบัญชีแล้ว? เข้าสู่ระบบ
    </button>
  </div>`;
}
function setupProfileHtml(){
  const vehicleOptions = VEHICLE_OPTIONS.map(v => `<option value="${v.id}">${v.label}</option>`).join('');
  return `
  <div class="job-active-card" style="text-align:left;margin-top:24px;">
    <div style="text-align:center;">
      <div class="job-active-emoji">📝</div>
      <div class="job-active-status">สมัครเป็นไรเดอร์ — กรอกข้อมูลให้ครบ</div>
      <p style="font-size:12px;color:var(--text-muted);margin-top:6px;">ข้อมูลทั้งหมดจะถูกส่งให้แอดมินตรวจสอบก่อนเริ่มรับงาน</p>
    </div>

    <div class="ff-section">ข้อมูลส่วนตัวและเอกสาร</div>
    <div class="ff-row">
      <div><div class="ff-label">ชื่อ</div><input id="sp-first" class="ff-input" placeholder="ชื่อจริง"></div>
      <div><div class="ff-label">นามสกุล</div><input id="sp-last" class="ff-input" placeholder="นามสกุล"></div>
    </div>
    <div class="ff-label">เบอร์โทรศัพท์</div>
    <input id="sp-phone" class="ff-input" type="tel" placeholder="08xxxxxxxx">
    <div class="ff-label">เลขบัตรประชาชน (13 หลัก)</div>
    <input id="sp-nid" class="ff-input" inputmode="numeric" maxlength="13" placeholder="1234567890123">
    <div class="ff-label">ภาพถ่ายบัตรประชาชน (เห็นหน้าบัตรชัดเจน ไม่สะท้อนแสง)</div>
    <input id="sp-idcard" type="file" accept="image/*" class="ff-input" onchange="previewFileTo('sp-idcard','sp-idcard-preview')">
    <img id="sp-idcard-preview" class="ff-img-preview">
    <div class="ff-label">ภาพถ่ายใบขับขี่</div>
    <input id="sp-license" type="file" accept="image/*" class="ff-input" onchange="previewFileTo('sp-license','sp-license-preview')">
    <img id="sp-license-preview" class="ff-img-preview">
    <div class="ff-label">วันหมดอายุใบขับขี่</div>
    <input id="sp-license-expiry" type="date" class="ff-input">
    <p class="ff-hint">🔒 รูปเอกสารถูกเก็บแบบส่วนตัว มีแต่คุณและแอดมินเท่านั้นที่เปิดดูได้</p>

    <div class="ff-section">ข้อมูลยานพาหนะ</div>
    <div class="ff-label">ประเภทพาหนะ</div>
    <select id="sp-vehicle" class="ff-input"><option value="">— เลือกประเภทพาหนะ —</option>${vehicleOptions}</select>
    <div class="ff-label">ป้ายทะเบียนรถ</div>
    <input id="sp-plate" class="ff-input" placeholder="เช่น 1กข 1234 กทม.">

    <button class="btn-accept" id="sp-submit-btn" style="margin-top:18px;" onclick="submitProfile()">บันทึกและส่งขออนุมัติ</button>
    <button class="btn-accept" style="margin-top:8px;background:transparent;color:var(--red, #C0392B);" onclick="doLogout()">ออกจากระบบ</button>
  </div>`;
}
function pendingHtml(){
  return `
  <div class="job-active-card">
    <div class="job-active-emoji">⏳</div>
    <div class="job-active-status">รอการอนุมัติจากแอดมิน</div>
    <div class="job-active-sub">บัญชีของคุณ (${state.riderName}) กำลังรอตรวจสอบ กรุณาลองใหม่ภายหลัง</div>
    <button class="btn-accept" style="margin-top:16px;background:transparent;color:#C0392B;" onclick="doLogout()">ออกจากระบบ</button>
  </div>`;
}
function topbar(){
  return `
  <div class="topbar">
    <div class="avatar">🏍️</div>
    <div class="who"><div class="name">${state.riderName||'ไรเดอร์'}</div><div class="plate">${state.riderPlate||'-'} · <span style="text-decoration:underline;cursor:pointer;" onclick="doLogout()">ออกจากระบบ</span></div></div>
    <div class="online-box"><span class="online-label">${state.online?'ออนไลน์':'ออฟไลน์'}</span><button class="switch ${state.online?'on':''}" onclick="toggleOnline()"></button></div>
  </div>
  <div class="earn-strip">
    <div><div class="big">฿${state.todayEarnings.toLocaleString('th-TH')}</div><div class="lbl">รายได้วันนี้</div></div>
    <div class="trips">${state.todayTrips} เที่ยว</div>
  </div>`;
}
function renderJobs(){
  if (state.activeJob) return renderActiveJob();
  return `
  <div class="gps-box">
    <div><b>ส่งพิกัด GPS แบบ Realtime</b><br><span style="font-size:11px;color:var(--text-muted)">สถานะ: ${gpsActive?'กำลังส่งพิกัด...':'ปิดอยู่'}</span></div>
    <button class="switch ${gpsActive?'on':''}" onclick="toggleGpsTracking()"></button>
  </div>
  ${!state.online ? `<div class="empty-state"><div class="e">🌙</div><h3>คุณออฟไลน์อยู่</h3><p>เปิดสวิตช์ออนไลน์ด้านบนเพื่อเริ่มรับงาน</p></div>` : `
  <div class="section-title"><h2>งานที่พร้อมรับ</h2></div>
  ${state.availableJobs.length === 0 ? `<div class="empty-state"><div class="e">🔍</div><h3>ยังไม่มีงานตอนนี้</h3><p>รอสักครู่ งานใหม่จะขึ้นที่นี่โดยอัตโนมัติ</p></div>` :
  state.availableJobs.map(j => `
    <div class="job-card">
      <div class="job-top"><span class="job-restaurant">${j.emoji} ${j.restaurant}</span><span class="job-fee">+${j.fee} บาท</span></div>
      <div class="job-route"><span class="dotline"></span>รับที่ — ${j.restaurant}<br><span class="dotline"></span>ส่งที่ — ${j.dropoff}</div>
      <button class="btn-accept" onclick="acceptJob('${j.id}')">รับงานนี้</button>
    </div>`).join('')}`}
  `;
}
function renderActiveJob(){
  const j = state.activeJob;
  const STEP_LABELS = ['กำลังไปที่ร้าน • รอครัวปรุงอาหาร', 'อาหารพร้อมแล้ว รับได้เลย', 'รับอาหารแล้ว กำลังไปส่ง'];
  const STEP_BTN = [null, 'รับอาหารแล้ว ไปส่งลูกค้า', 'ส่งอาหารสำเร็จ'];
  const btn = STEP_BTN[j.step];
  return `
  <div class="job-active-card">
    <div class="job-active-emoji">🏍️</div>
    <div class="job-active-status">${STEP_LABELS[j.step]}</div>
    <div class="job-active-sub">งาน #${j.code || j.id} · ${j.restaurant} · ส่งที่ ${j.dropoff}</div>
    ${j.step === 0 ? `<div class="job-active-sub" style="margin-top:8px;color:var(--primary);">💡 คุณได้งานนี้แล้ว ขับไปที่ร้านได้เลย ระบบจะแจ้งเตือนอีกครั้งเมื่ออาหารพร้อม</div>` : ''}
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn-accept" style="margin:0;flex:1;background:#22C55E;" onclick="startCall()">📞 โทรหาลูกค้า</button>
      <button class="btn-accept" style="margin:0;flex:1;background:#0EA5E9;" onclick="openChat()">💬 แชท</button>
    </div>
  </div>
  <div class="gps-box">
    <span class="gps-status">${gpsActive ? '🟢 ส่งตำแหน่ง GPS ให้ลูกค้าแบบ Real-time' : '🔴 GPS ปิดอยู่'}</span>
    <button class="btn-accept" style="margin:0;width:auto;padding:6px 12px;" onclick="toggleGpsTracking()">${gpsActive?'ปิด':'เปิด GPS'}</button>
  </div>
  ${btn ? `<button class="btn-big" onclick="advanceJob()">${btn}</button>` : ''}
  `;
}
function render(){
  let body = '';
  if (state.view === 'loading') body = `<div class="empty-state"><div class="e">⏳</div><h3>กำลังโหลด...</h3></div>`;
  else if (state.view === 'auth') body = authHtml();
  else if (state.view === 'setup-profile') body = setupProfileHtml();
  else if (state.view === 'pending') body = topbar() + pendingHtml();
  else body = topbar() + renderJobs();
  document.getElementById('app').innerHTML = body;

  let chatEl = document.getElementById('chat-root');
  if (chatEl) chatEl.remove();
  if (chatOpen) {
    const div = document.createElement('div');
    div.id = 'chat-root';
    div.innerHTML = chatDrawerHtml();
    document.body.appendChild(div);
    scrollChatToBottom();
  }

  let callEl = document.getElementById('call-root');
  if (callEl) callEl.remove();
  if (callOpen) {
    const div = document.createElement('div');
    div.id = 'call-root';
    div.innerHTML = callModalHtml();
    document.body.appendChild(div);
  }
}

init();
</script>
</body>
</html>
