<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #FFF3E8;
    --text: #2B1A0E;
    --text-muted: #8A6C56;
    --primary: #FF6B00;
    --primary-ink: #FFFFFF;
    --secondary: #FFB54D;
    --green: #2E9E4F;
    --border: #FFE0C6;
    --shadow: 0 1px 2px rgba(36,27,21,0.06);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17110B;
      --surface: #221911;
      --surface-2: #2E2015;
      --text: #FFF4EA;
      --text-muted: #D2B59C;
      --primary: #FF8A2B;
      --primary-ink: #17110B;
      --secondary: #FFC266;
      --green: #6FCB7A;
      --border: #3A2E23;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17110B;
    --surface: #221911;
    --surface-2: #2E2015;
    --text: #FFF4EA;
    --text-muted: #D2B59C;
    --primary: #FF8A2B;
    --primary-ink: #17110B;
    --secondary: #FFC266;
    --green: #6FCB7A;
    --border: #3A2E23;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 84px;
  }
  h1, h2, h3, .display {
    font-family: 'Archivo Black', 'Noto Sans Thai', sans-serif;
    font-weight: 400;
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.01em;
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; }
  img { max-width: 100%; }
  ::selection { background: var(--secondary); color: var(--text); }

  .wrap { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; background: var(--bg); }
  @media (min-width: 700px) {
    .wrap { max-width: 900px; box-shadow: 0 0 60px rgba(0,0,0,0.08); }
  }
  @media (min-width: 1150px) {
    .wrap { max-width: 1180px; }
    .hero { padding: 34px 40px; }
    .hero h1 { font-size: 34px; }
    .hero p { font-size: 14.5px; }
    .hero .bowl { font-size: 130px; right: 10px; bottom: -26px; }
    .search-row, .section-title, .cats, .rest-list, .hero { padding-left: 28px; padding-right: 28px; }
    .hero { margin-left: 28px; margin-right: 28px; }
  }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px 10px;
    position: sticky; top: 0; z-index: 40;
    background: var(--bg);
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--primary); color: var(--primary-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo Black'; font-size: 16px;
    transform: rotate(-6deg);
  }
  .logo-text { font-family: 'Archivo Black'; font-size: 18px; }
  .addr-pill {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted); max-width: 130px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .icon-btn {
    border: none; background: var(--surface); width: 38px; height: 38px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); font-size: 16px; flex-shrink: 0;
    position: relative;
  }
  .cart-badge {
    position: absolute; top: -4px; right: -4px; background: var(--primary); color: var(--primary-ink);
    font-size: 10px; font-weight: 800; border-radius: 50%; min-width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }

  .search-row { padding: 4px 18px 14px; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 11px 16px; box-shadow: var(--shadow);
  }
  .search-box input {
    border: none; outline: none; background: transparent; color: var(--text);
    font-size: 14px; width: 100%; font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  /* ---------- Hero ---------- */
  .hero {
    margin: 4px 18px 18px; border-radius: var(--radius-l);
    background: linear-gradient(135deg, var(--primary), #FFA94D 130%);
    color: #fff; padding: 22px 20px; position: relative; overflow: hidden;
  }
  .hero h1 { font-size: 26px; max-width: 70%; }
  .hero p { margin: 8px 0 0; font-size: 13px; opacity: .92; max-width: 65%; }
  .hero .bowl {
    position: absolute; right: -10px; bottom: -18px; font-size: 92px;
    transform: rotate(8deg); filter: drop-shadow(0 8px 10px rgba(0,0,0,.2));
  }
  .hero .steam { position: absolute; right: 46px; top: 14px; font-size: 20px; opacity: .8; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); opacity:.5 } 50% { transform: translateY(-8px); opacity: .9 } }

  /* ---------- Promo banner carousel ---------- */
  .hero-carousel { margin: 4px 18px 18px; border-radius: var(--radius-l); overflow: hidden; position: relative; box-shadow: var(--shadow); background: var(--text); }
  .hero-carousel-track { position: relative; width: 100%; height: clamp(120px, 38vw, 168px); }
  .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease-in-out; cursor: pointer; border: none; padding: 0; width: 100%; height: 100%; text-align: left; }
  .hero-slide.on { opacity: 1; z-index: 1; }
  .hero-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-slide .hero-slide-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.65), rgba(0,0,0,.15) 60%, transparent); display: flex; align-items: center; }
  .hero-slide .hero-slide-text { padding: clamp(12px, 5vw, 20px); max-width: 78%; color: #fff; }
  .hero-slide .hero-slide-text h2 { font-size: clamp(14px, 4.3vw, 19px); line-height: 1.25; }
  .hero-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .hero-arrow.prev { left: 10px; } .hero-arrow.next { right: 10px; }
  .hero-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 6px; }
  .hero-dots button { width: 8px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.4); border: none; padding: 0; transition: all .25s; }
  .hero-dots button.on { width: 20px; background: #fff; }

  /* ---------- Categories ---------- */
  .section-title {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 18px; margin: 22px 0 12px;
  }
  .section-title h2 { font-size: 17px; }
  .section-title span { font-size: 12px; color: var(--text-muted); }

  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ---------- Restaurant cards ---------- */
  .rest-list { padding: 0 18px; display: flex; flex-direction: column; gap: 14px; }
  .rest-card {
    display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-m); padding: 12px; text-align: left; width: 100%;
  }
  .rest-thumb {
    width: 76px; height: 76px; border-radius: var(--radius-s); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    background-size: cover; background-position: center; position: relative; overflow: hidden;
  }
  .rest-card { position: relative; }
  .featured-ribbon {
    position: absolute; top: -6px; left: 8px; background: var(--accent); color: #fff;
    font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.2); z-index: 1;
  }
  .rest-info { flex: 1; min-width: 0; }
  .rest-name-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .rest-name { font-size: 15px; font-weight: 700; }
  .promo-tag {
    font-size: 10px; font-weight: 800; background: var(--secondary); color: #241B15;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0;
  }
  .rest-tags { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .rest-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .rest-meta b { color: var(--text); }

  /* ---------- Grid layout desktop ---------- */
  @media (min-width: 700px) {
    .rest-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  }
  @media (min-width: 1150px) {
    .rest-list { grid-template-columns: repeat(3, 1fr); }
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; z-index: 50;
  }
  @media (min-width: 700px) { .bottom-nav { max-width: 900px; } }
  @media (min-width: 1150px) { .bottom-nav { max-width: 1180px; } }
  .nav-btn {
    flex: 1; border: none; background: none; padding: 10px 4px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-muted); font-size: 10px; font-weight: 600;
  }
  .nav-btn .nav-ic { font-size: 19px; }
  .nav-btn.active { color: var(--primary); }

  /* ---------- Restaurant detail ---------- */
  .detail-header {
    height: 150px; background: linear-gradient(160deg, var(--secondary), var(--primary));
    display: flex; align-items: flex-end; padding: 16px 18px; position: relative;
  }
  .back-btn {
    position: absolute; top: 14px; left: 14px; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.92); border: none; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #241B15;
  }
  .detail-header .emoji-big { font-size: 64px; position: absolute; right: 14px; top: 14px; opacity: .9; }
  .detail-sub { padding: 14px 18px 6px; border-bottom: 1px solid var(--border); }
  .detail-meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-muted); margin-top: 6px; flex-wrap: wrap; }
  .detail-meta b { color: var(--text); }

  .menu-group-title { padding: 6px 18px 2px; font-size: 15px; font-weight: 800; margin-top: 10px; }
  .menu-item {
    display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); align-items: center;
  }
  .menu-item-emoji {
    width: 58px; height: 58px; border-radius: var(--radius-s); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .menu-item-info { flex: 1; min-width: 0; }
  .menu-item-name { font-size: 14.5px; font-weight: 700; }
  .menu-item-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
  .menu-item-price { font-size: 14px; font-weight: 800; margin-top: 6px; color: var(--primary); }

  .qty-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--primary); background: var(--surface);
    color: var(--primary); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .qty-btn.add { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .qty-num { font-weight: 800; min-width: 16px; text-align: center; font-size: 14px; }

  /* ---------- Floating cart bar ---------- */
  .cart-fab {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 78px;
    width: calc(100% - 36px); max-width: 444px;
    background: var(--primary); color: var(--primary-ink);
    border-radius: 999px; padding: 13px 18px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 8px 20px rgba(255,107,0,0.35); border: none; z-index: 45; font-weight: 700; font-size: 14px;
  }
  @media (min-width: 700px) { .cart-fab { max-width: 864px; } }
  @media (min-width: 1150px) { .cart-fab { max-width: 1140px; } }

  /* ---------- Drawer / modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(23,18,14,0.5); z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 700px) { .overlay { align-items: center; } }
  .sheet {
    background: var(--bg); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 0 24px; position: relative;
  }
  @media (min-width: 700px) { .sheet { border-radius: 22px; max-width: 460px; } }
  .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 3px; margin: 0 auto 12px; }
  .sheet-title { padding: 0 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title h2 { font-size: 18px; }
  .sheet-close { border: none; background: var(--surface); width: 30px; height: 30px; border-radius: 50%; font-size: 14px; }

  .cart-line { display: flex; gap: 10px; padding: 12px 20px; align-items: center; }
  .cart-line-emoji { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .cart-line-info { flex: 1; min-width: 0; }
  .cart-line-name { font-size: 13.5px; font-weight: 700; }
  .cart-line-price { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .summary-row { display: flex; justify-content: space-between; padding: 8px 20px; font-size: 13.5px; color: var(--text-muted); }
  .summary-row.total { color: var(--text); font-weight: 800; font-size: 16px; border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 14px; }

  .btn-primary {
    display: block; width: calc(100% - 40px); margin: 14px 20px 0; background: var(--primary); color: var(--primary-ink);
    border: none; padding: 14px; border-radius: 999px; font-weight: 800; font-size: 14.5px;
  }
  .btn-primary:disabled { opacity: .45; }
  .btn-secondary {
    display: block; width: calc(100% - 40px); margin: 10px 20px 0; background: transparent; color: var(--text);
    border: 1.5px solid var(--border); padding: 13px; border-radius: 999px; font-weight: 700; font-size: 14px;
  }

  .field-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); padding: 14px 20px 6px; }
  .field-input {
    margin: 0 20px; display: block; width: calc(100% - 40px); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-s); padding: 12px 14px; font-size: 14px; color: var(--text); font-family: inherit;
  }
  textarea.field-input { resize: vertical; min-height: 60px; }

  .pay-option {
    display: flex; align-items: center; gap: 10px; margin: 8px 20px; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius-s); font-size: 13.5px; font-weight: 600;
  }
  .pay-option.selected { border-color: var(--primary); background: var(--surface-2); }
  .pay-option .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--text-muted); flex-shrink: 0; position: relative; }
  .pay-option.selected .dot { border-color: var(--primary); }
  .pay-option.selected .dot::after { content:''; position:absolute; inset:3px; background: var(--primary); border-radius: 50%; }

  /* ---------- checkout map + promptpay ---------- */
  .checkout-map { margin: 0 20px; height: 200px; border-radius: var(--radius-m); border: 1px solid var(--border); overflow: hidden; z-index: 0; position: relative; }
  .map-gps-btn { display: block; width: calc(100% - 40px); margin: 10px 20px 0; padding: 12px; background: var(--surface-2); color: var(--primary); border: 1px solid var(--border); border-radius: var(--radius-s); font-weight: 700; font-size: 13.5px; font-family: inherit; cursor: pointer; }
  .map-gps-btn:active { opacity: .8; }
  .checkout-map { isolation: isolate; }
  .checkout-map .leaflet-pane, .checkout-map .leaflet-tile, .checkout-map .leaflet-marker-icon, .checkout-map .leaflet-tile-container { position: absolute; left: 0; top: 0; }
  .checkout-map .leaflet-tile { max-width: none !important; width: 256px; height: 256px; }
  .checkout-map .leaflet-top, .checkout-map .leaflet-bottom { position: absolute; z-index: 1000; }
  .map-hint { font-size: 12px; color: var(--text-muted); padding: 8px 20px 0; line-height: 1.5; }
  .pp-box { margin: 4px 20px 6px; padding: 14px; border: 1.5px dashed var(--primary); border-radius: var(--radius-m); background: var(--surface-2); text-align: center; }
  .pp-box img.pp-qr { width: 210px; max-width: 100%; border-radius: 10px; background: #fff; padding: 6px; display: block; margin: 8px auto; }
  .pp-amount { font-size: 20px; font-weight: 800; color: var(--primary); }
  .pp-meta { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  .slip-upload { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; padding: 11px; border-radius: 999px; background: var(--primary); color: var(--primary-ink); font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .slip-preview { max-width: 140px; max-height: 200px; border-radius: 8px; margin: 10px auto 0; display: block; border: 1px solid var(--border); }
  .pay-option.disabled { opacity: .45; pointer-events: none; }

  /* ---------- language switch + profile ---------- */
  .lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); flex-shrink: 0; }
  .lang-switch button { border: none; background: transparent; color: var(--text-muted); font-size: 11.5px; font-weight: 700; padding: 6px 9px; font-family: inherit; }
  .lang-switch button.on { background: var(--primary); color: var(--primary-ink); }
  .profile-card { margin: 6px 20px 0; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface-2); }
  .profile-card .pc-title { font-weight: 800; font-size: 14px; }
  .profile-card .pc-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
  .otp-input { letter-spacing: 8px; font-size: 22px !important; text-align: center; font-weight: 800; }
  .link-btn { background: none; border: none; color: var(--primary); font-weight: 700; font-size: 13px; padding: 10px 0 0; font-family: inherit; cursor: pointer; }
  .link-btn:disabled { color: var(--text-muted); cursor: default; }
  .or-sep { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 12px; margin: 16px 20px 0; }
  .or-sep::before, .or-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .hero-slide.clickable { cursor: pointer; }
  .en-warn { display: none; color: #E5484D; font-size: 12px; font-weight: 700; padding: 6px 20px 0; }
  .field-hint { font-size: 11.5px; color: var(--text-muted); padding: 4px 20px 0; }
  .input-bad { border-color: #E5484D !important; background: #FFF1F1 !important; }
  .menu-item-emoji.zoomable { cursor: zoom-in; position: relative; }
  .zoom-badge { position: absolute; right: 3px; bottom: 3px; font-size: 10px; background: rgba(255,255,255,.9); border-radius: 999px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .photo-viewer { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; animation: pvIn .18s ease; }
  @keyframes pvIn { from { opacity: 0; } to { opacity: 1; } }
  .photo-viewer img { max-width: 100%; max-height: 70vh; border-radius: 14px; object-fit: contain; touch-action: pinch-zoom; }

const LANGS = { th: 'ไทย', en: 'EN', zh: '中文' };
let currentLang = 'th';
try { const l = localStorage.getItem('imduan_lang'); if (l && LANGS[l]) currentLang = l; } catch(e) {}
const I18N_KEYS = Object.keys(I18N).sort((a, b) => b.length - a.length);
const I18N_RE = new RegExp(I18N_KEYS.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
const I18N_SKIP = '[translate="no"],.rest-name,.rest-tags,.menu-group-title,.menu-item-name,.menu-desc-text,.cart-line-name,.order-card-items,.order-items,.driver-name,.detail-sub h1,.hero-slide-text,.logo,.leaflet-control-attribution,.promo-tag';
function tr(text){
  if (currentLang === 'th' || !text || !/[฀-๿]/.test(text)) return text;
  const idx = currentLang === 'en' ? 0 : 1;
  return text.replace(I18N_RE, m => I18N[m][idx]);
}
function translateNode(root){
  if (currentLang === 'th' || !root) return;
  if (root.nodeType === 3) {
    const p = root.parentElement;
    if (!p || p.closest('script,style,textarea,' + I18N_SKIP)) return;
    const t = tr(root.nodeValue); if (t !== root.nodeValue) root.nodeValue = t;
    return;
  }
  if (root.nodeType !== 1) return;
  if (root.matches && root.matches('script,style,textarea') ) return;
  if (root.closest && root.closest(I18N_SKIP)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n; while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(translateNode);
  const attrEls = root.querySelectorAll ? [root, ...root.querySelectorAll('[placeholder],[title],[alt]')] : [];
  attrEls.forEach(el => {
    if (!el.getAttribute || el.closest(I18N_SKIP)) return;
    ['placeholder', 'title'].forEach(a => { const v = el.getAttribute(a); if (v) { const t = tr(v); if (t !== v) el.setAttribute(a, t); } });
  });
}
const i18nObserver = new MutationObserver(muts => {
  if (currentLang === 'th') return;
  i18nObserver.disconnect();
  muts.forEach(m => {
    if (m.type === 'characterData') translateNode(m.target);
    else m.addedNodes.forEach(translateNode);
  });
  i18nObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
});
function setLang(lang){
  if (!LANGS[lang]) return;
  currentLang = lang;
  try { localStorage.setItem('imduan_lang', lang); } catch(e) {}
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  applyRestaurantNames();
  render();
}
function applyRestaurantNames(){
  RESTAURANTS.forEach(r => { if (!r.nameTh) r.nameTh = r.name; r.name = (currentLang !== 'th' && r.nameEn) ? r.nameEn : r.nameTh; });
}
function langSwitchHtml(){
  return `<div class="lang-switch" translate="no">${Object.keys(LANGS).map(l => `<button class="${currentLang===l?'on':''}" onclick="setLang('${l}')">${LANGS[l]}</button>`).join('')}</div>`;
}
function startI18n(){
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang;
  i18nObserver.observe(document.body, { childList: true, subtree: true, characterData: true });

function preorderDayLabel(iso){
  const [y,m,d] = String(iso).split('-').map(Number);
  const date = new Date(y, m-1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((date - today) / 86400000);
  const short = date.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });
  if (diff === 0) return { main: 'วันนี้', sub: short };
  if (diff === 1) return { main: 'พรุ่งนี้', sub: short };
  if (diff === 2) return { main: 'มะรืนนี้', sub: short };

function playAlertSound() {

    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
    const ctx = sharedAudioCtx; const now = ctx.currentTime;
    [0, 0.18].forEach((t) => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + t);
      gain.gain.exponentialRampToValueAtTime(0.3, now + t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);

/* ============ CALL (Agora RTC ส่งเสียงจริง + Supabase Realtime แค่ใช้แจ้งสายเรียกเข้า) ============ */
function subscribeCallChannel(orderId) {
  if (!supabaseClient) return;
  if (callChannel && callChannelOrderId === orderId) return;
  if (callChannel) { supabaseClient.removeChannel(callChannel); callChannel = null; }
  callChannelOrderId = orderId;
  callChannel = supabaseClient.channel('call_' + orderId);
  callChannel
    .on('broadcast', { event: 'call-offer' }, ({ payload }) => { if (payload.from !== 'customer') handleIncomingOffer(); })
    .on('broadcast', { event: 'call-answer' }, ({ payload }) => { if (payload.from !== 'customer') handleCallAnswer(); })
    .on('broadcast', { event: 'call-end' }, ({ payload }) => { if (payload.from !== 'customer') endCallLocal(); })
    .subscribe();
}
function unsubscribeCallChannel() {
  if (callChannel) { supabaseClient.removeChannel(callChannel); callChannel = null; callChannelOrderId = null; }
  endCallLocal();
}
function getAgoraClient() {
  if (!agoraClient) agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
  return agoraClient;
}
async function joinAgoraChannel(orderId) {
  const client = getAgoraClient();
  client.removeAllListeners();
  client.on('user-published', async (user, mediaType) => {
    await client.subscribe(user, mediaType);
    if (mediaType === 'audio') {
      user.audioTrack.play();
      if (callState !== 'connected') { callState = 'connected'; startCallTimer(); render(); }
    }
  });
  client.on('user-left', () => { endCallLocal(); });
  await client.join(AGORA_APP_ID, 'order_' + orderId, null, null);
  localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
  await client.publish([localAudioTrack]);
}
async function leaveAgoraChannel() {
  if (localAudioTrack) { localAudioTrack.close(); localAudioTrack = null; }
  if (agoraClient) { try { await agoraClient.leave(); } catch (e) { console.warn(e); } }
}
function formatCallTime(sec) { const m = Math.floor(sec/60), s = sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function startCallTimer() {
  callSeconds = 0;
  callTimerHandle = setInterval(() => {
    callSeconds++;
    const el = document.getElementById('call-timer-text');
    if (el) el.textContent = formatCallTime(callSeconds);
  }, 1000);
}
function playRingtone(){ playAlertSound(); ringInterval = setInterval(playAlertSound, 2000); }
function stopRingtone(){ clearInterval(ringInterval); ringInterval = null; }

async function startCall() {
  if (!callChannel || !state.activeOrder) { showToast('ยังเชื่อมต่อระบบโทรไม่ได้ ลองใหม่อีกครั้ง'); return; }
  if (callState !== 'idle') return;
  callState = 'calling'; callOpen = true; render();
  try {
    await joinAgoraChannel(state.activeOrder.id);
  } catch (err) {
    console.error(err); showToast('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตสิทธิ์');
    callState = 'idle'; callOpen = false; render(); return;
  }
  callChannel.send({ type: 'broadcast', event: 'call-offer', payload: { from: 'customer' } });
}
function handleIncomingOffer() {
  if (callState !== 'idle') return;
  callState = 'ringing'; callOpen = true; render();
  playRingtone();
}
async function acceptCall() {
  stopRingtone();
  callOpen = true; render();
  try {
    await joinAgoraChannel(state.activeOrder.id);
  } catch (err) { console.error(err); showToast('ไม่สามารถเข้าถึงไมโครโฟนได้'); declineCall(); return; }
  callChannel.send({ type: 'broadcast', event: 'call-answer', payload: { from: 'customer' } });
  callState = 'connected'; startCallTimer(); render();
}
function declineCall() {
  stopRingtone();
  if (callChannel) callChannel.send({ type: 'broadcast', event: 'call-end', payload: { from: 'customer' } });
  callState = 'idle'; callOpen = false; render();
}
function handleCallAnswer() {
  if (callState === 'calling') { callState = 'connected'; startCallTimer(); render(); }
}
function endCall() {
  if (callChannel) callChannel.send({ type: 'broadcast', event: 'call-end', payload: { from: 'customer' } });
  endCallLocal();
}
async function endCallLocal() {
  stopRingtone();
  await leaveAgoraChannel();
  clearInterval(callTimerHandle); callTimerHandle = null; callSeconds = 0; micMuted = false;
  callState = 'idle'; callOpen = false;

}

function callModalHtml() {

let photoViewer = null; // { restaurantId, list:[item], idx }
function openPhotoViewer(restaurantId, itemId){
  const r = findRestaurant(restaurantId); if (!r) return;
  const list = []; r.menu.forEach(g => g.items.forEach(it => { if (it.image) list.push(it); }));
  const idx = Math.max(0, list.findIndex(it => it.id === itemId));
  photoViewer = { restaurantId, list, idx };
  renderPhotoViewer();
}
function closePhotoViewer(){ photoViewer = null; const el = document.getElementById('photo-viewer'); if (el) el.remove(); }
function stepPhotoViewer(d){ if (!photoViewer) return; const n = photoViewer.list.length; photoViewer.idx = (photoViewer.idx + d + n) % n; renderPhotoViewer(); }
function renderPhotoViewer(){
  let el = document.getElementById('photo-viewer');
  if (!photoViewer) { if (el) el.remove(); return; }
  const it = photoViewer.list[photoViewer.idx]; if (!it) return;
  if (!el) {
    el = document.createElement('div'); el.id = 'photo-viewer'; el.className = 'photo-viewer';
    el.addEventListener('click', e => { if (e.target === el) closePhotoViewer(); });
    let sx = null;
    el.addEventListener('touchstart', e => { if (e.touches.length === 1) sx = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) stepPhotoViewer(dx < 0 ? 1 : -1); });
    document.body.appendChild(el);
  }
  const many = photoViewer.list.length > 1;
  el.innerHTML = `
    ${many ? `<div class="pv-count">${photoViewer.idx + 1} / ${photoViewer.list.length}</div>` : ''}
    <button class="pv-close" onclick="closePhotoViewer()" aria-label="ปิด">✕</button>
    ${many ? `<button class="pv-nav prev" onclick="stepPhotoViewer(-1)">‹</button><button class="pv-nav next" onclick="stepPhotoViewer(1)">›</button>` : ''}
    <img src="${escAttr(it.image)}" alt="">
    <div class="pv-info">
      <div class="n" translate="no">${escHtml(it.name)}</div>
      ${it.desc ? `<div class="d" translate="no">${escHtml(it.desc)}</div>` : ''}
      <div class="p">${money(it.price)}</div>

    </div>`;
}
document.addEventListener('keydown', e => {
  if (!photoViewer) return;

function itemHasOptions(item){ return item && item.optionGroups && item.optionGroups.length > 0; }
function lineForSimpleItem(itemId){

}
function qtyForSimpleItem(itemId){

}

}
function addLineToCart(restaurantId, itemId, selections, unitPrice, qty){
  if (!state.cart.restaurantId) state.cart.restaurantId = restaurantId;
  state.cart.lines.push({
    lineId: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,8),

function addToCart(restaurantId, itemId) {
  if (!isShopOpen(findRestaurant(restaurantId))) { showToast('ร้านปิดอยู่ ยังสั่งไม่ได้'); return; }
  if (state.cart.restaurantId && state.cart.restaurantId !== restaurantId && cartCount() > 0) {
    const ok = confirm('ตะกร้าของคุณมีสินค้าจากร้านอื่นอยู่ เริ่มตะกร้าใหม่สำหรับร้านนี้หรือไม่?');
    if (!ok) return;
    state.cart = { restaurantId, lines: [] };
  }
  const r = findRestaurant(restaurantId);
  if (r && r.isPreorder) {
    const day = selectedDay(r);
    if (!day) { showToast('ร้านปิดรับจองแล้ว'); return; }
    if (state.cart.dayId && state.cart.dayId !== day.id && cartCount() > 0) {
      if (!confirm('ตะกร้ามีเมนูของวันอื่นอยู่ เริ่มตะกร้าใหม่สำหรับวันนี้หรือไม่?')) return;
      state.cart = { restaurantId, lines: [] };
    }
    const left = itemLeft(day, itemId, true);
    if (left !== null && left <= 0) { showToast('เมนูนี้หมดแล้ว'); return; }
    state.cart.restaurantId = restaurantId; state.cart.dayId = day.id;
  } else if (state.cart.dayId) { state.cart.dayId = null; }
  const item = r ? findItem(r, itemId) : null;
  if (item && item.isCustom) { requestTarget = { restaurantId, itemId }; requestQty = 1; requestText = ''; openSheet('request'); return; }
  if (item && itemHasOptions(item)) { openItemOptionsSheet(restaurantId, itemId); return; }
  if (!state.cart.restaurantId) state.cart.restaurantId = restaurantId;
  const existing = lineForSimpleItem(itemId);
  if (existing) { existing.qty += 1; }
  else { addLineToCart(restaurantId, itemId, [], item ? discPrice(restaurantId, item.price) : 0, 1); return; }
  saveCart(); render();
}
function removeFromCart(itemId) {
  const existing = lineForSimpleItem(itemId);
  if (!existing) return;
  existing.qty -= 1;
  if (existing.qty <= 0) state.cart.lines = state.cart.lines.filter(l => l.lineId !== existing.lineId);
  if (state.cart.lines.length === 0) state.cart.restaurantId = null;
  saveCart(); render();
}
function changeLineQty(lineId, delta){
  const line = state.cart.lines.find(l => l.lineId === lineId);
  if (!line) return;
  if (delta > 0 && state.cart.dayId) {
    const day = currentCartDay(); const left = day ? itemLeft(day, line.itemId, true) : null;
    if (left !== null && left <= 0) { showToast('เมนูนี้หมดแล้ว'); return; }
  }
  line.qty += delta;
  if (line.qty <= 0) state.cart.lines = state.cart.lines.filter(l => l.lineId !== lineId);
  if (state.cart.lines.length === 0) state.cart.restaurantId = null;
  saveCart(); render();
}

/* ============ ตัวเลือกเมนู (item options sheet) ============ */
let optionSheetTarget = null;    // { restaurantId, itemId }
let optionSheetSelections = {};  // { [groupId]: [optionId, ...] }
let optionSheetQty = 1;
function openItemOptionsSheet(restaurantId, itemId){
  optionSheetTarget = { restaurantId, itemId };
  optionSheetSelections = {};
  optionSheetQty = 1;
  openSheet('item-options');
}
function computeOptionSheetItem(){
  if (!optionSheetTarget) return null;
  const r = findRestaurant(optionSheetTarget.restaurantId);
  if (!r) return null;
  return findItem(r, optionSheetTarget.itemId);
}
function selectSingleOption(groupId, optionId){
  optionSheetSelections[groupId] = [optionId];
  refreshOverlay();
}
function toggleMultiOption(groupId, optionId, maxSelect){
  const cur = optionSheetSelections[groupId] || [];
  if (cur.includes(optionId)) {
    optionSheetSelections[groupId] = cur.filter(x => x !== optionId);
  } else {
    if (cur.length >= maxSelect) { showToast(`เลือกได้สูงสุด ${maxSelect} ข้อ`); return; }
    optionSheetSelections[groupId] = [...cur, optionId];
  }
  refreshOverlay();
}
function changeOptionSheetQty(delta){
  optionSheetQty = Math.max(1, optionSheetQty + delta);
  refreshOverlay();
}
function optionSheetUnitPrice(){
  const item = computeOptionSheetItem();
  if (!item) return 0;
  let price = item.price;
  (item.optionGroups||[]).forEach(g => {
    const picked = optionSheetSelections[g.id] || [];
    g.options.forEach(o => { if (picked.includes(o.id)) price += o.priceDelta; });
  });
  return optionSheetTarget ? discPrice(optionSheetTarget.restaurantId, price) : price;
}
function optionSheetMissingRequired(){
  const item = computeOptionSheetItem();
  if (!item) return [];
  return (item.optionGroups||[]).filter(g => g.required && (optionSheetSelections[g.id]||[]).length === 0);
}
function confirmAddFromOptionSheet(){
  const item = computeOptionSheetItem();
  if (!item || !optionSheetTarget) return;
  const missing = optionSheetMissingRequired();
  if (missing.length > 0) { showToast(`กรุณาเลือก "${missing[0].name}"`); return; }
  const selections = [];
  (item.optionGroups||[]).forEach(g => {
    const picked = optionSheetSelections[g.id] || [];
    g.options.forEach(o => { if (picked.includes(o.id)) selections.push({ groupId:g.id, groupName:g.name, optionId:o.id, optionName:o.name, priceDelta:o.priceDelta }); });
  });
  const pr = findRestaurant(optionSheetTarget.restaurantId);
  if (pr && pr.isPreorder) {
    const day = selectedDay(pr); const left = day ? itemLeft(day, optionSheetTarget.itemId, true) : 0;

  addLineToCart(optionSheetTarget.restaurantId, optionSheetTarget.itemId, selections, optionSheetUnitPrice(), optionSheetQty);

}

async function placePreorder() {
  const r = findRestaurant(state.cart.restaurantId);
  const day = currentCartDay();
  if (!r || !day || new Date(day.cutoff_at) <= new Date()) { showToast('เมนูวันนี้ปิดรับจองแล้ว'); return; }
  captureCheckoutForm();
  const g = id => document.getElementById(id);
  const name = (checkoutForm.name || '').trim(), phone = (checkoutForm.phone || '').replace(/\D/g, ''), note = (checkoutForm.note || '').trim();
  const addr = (checkoutForm.addr || '').trim();
  if (g('pre-time')) checkoutPre.time = g('pre-time').value;
  if (!checkoutPre.ful) { showToast('เลือกรับเองที่ร้าน หรือ ให้ร้านไปส่ง'); return; }
  if (!checkoutPre.time) { showToast('กรุณาเลือกเวลา'); return; }
  if (!name) { showToast('กรุณากรอกชื่อผู้สั่ง'); return; }
  if (!/^0\d{8,9}$/.test(phone)) { showToast('กรุณากรอกเบอร์โทรให้ถูกต้อง (ร้านจะโทรหาเบอร์นี้)'); return; }
  const subtotal = cartSubtotal();
  if (checkoutPre.ful === 'delivery') {
    if ((r.zones || []).length) {
      const z = preZone(r);
      if (!z) { showToast('กรุณาเลือกโซนจัดส่ง'); return; }
      if (!cartHasCustom() && subtotal < Number(z.min || 0)) { showToast(`ส่ง${z.name} ขั้นต่ำ ${money(z.min)}`); return; }
    }

    if (!checkoutGpsCoords) { showToast('กรุณาปักหมุดตำแหน่งจัดส่งบนแผนที่'); return; }

    checkoutForm.name = name; checkoutForm.phone = phone; if (addr) checkoutForm.addr = addr; saveProfileLocal();

  };
  const base = {
    restaurantId: r.id, restaurantName: r.name, restaurantEmoji: r.emoji, restaurantPhone: r.phone, restaurantLat: r.lat, restaurantLng: r.lng,
    address: checkoutPre.ful === 'pickup' ? 'รับเองที่ร้าน' : addr, payment: checkoutPayment, date: new Date().toLocaleString('th-TH'),
    status: 'pending', riderId: null, isSelfDelivery: true, isPreorder: true, fulfillment: checkoutPre.ful, deliveryZone: checkoutPre.ful === 'delivery' ? checkoutPre.zone : null,
    scheduledDate: day.serve_date, scheduledSlot: checkoutPre.time, pickupLocation: r.pickupLocation,

  };
  if (dataSource === 'supabase' && supabaseClient && state.customerId) {
    try {
      let slipPath = null;
      if (checkoutPayment === 'promptpay' && checkoutSlip) slipPath = await uploadPaymentSlip(r.id, orderCode);
      const { data, error } = await supabaseClient.rpc('place_preorder', { p: {
        day_id: day.id, fulfillment: checkoutPre.ful, time: checkoutPre.time, zone: checkoutPre.zone,
        address: addr, lat: base.dropoffLat, lng: base.dropoffLng, contact_name: name, contact_phone: phone,
        payment_method: checkoutPayment, slip_path: slipPath, note, order_code: orderCode,

      } });
      if (error) throw error;
      finish({ ...base, id: data.id, code: data.order_code, items: data.items, subtotal: Number(data.subtotal), deliveryFee: Number(data.delivery_fee), total: Number(data.total), discountAmount: 0 });
      subscribeToOrder(data.id);

      loadSold(day.id);

      if (btn) { btn.disabled = false; btn.textContent = 'ยืนยันการจอง'; }
      showToast('จองไม่สำเร็จ: ' + ((err && err.message) || 'ลองใหม่อีกครั้ง'));
    }
  } else {
    const items = state.cart.lines.map(l => { const it = findItem(r, l.itemId); return { menu_item_id: l.itemId, name: it ? it.name : '', emoji: it ? it.emoji : '', qty: l.qty, price: l.unitPrice, selected_options: l.selections || [] }; });

      }

      const order = {
        id: orderRow.id, code: orderRow.order_code, restaurantId: r.id, restaurantName: r.name, restaurantEmoji: r.emoji,
        items: cartLines, subtotal, deliveryFee, discountAmount, discountCode, total, address: addr, payment: checkoutPayment,

      clearCart(); resetCheckoutExtras(); activeSheet = null;

    // จำลองสถานะในเครื่องนี้เท่านั้น ไม่ถูกส่งไปที่ร้านค้า/ไรเดอร์จริง
    const order = {

    }
    simulateProgressDemo(order);
  }
}

function simulateProgressDemo(order) {
  let idx = 0;
  const timer = setInterval(() => {
    idx++;
    if (idx >= STATUS_ORDER.length) { clearInterval(timer); return; }
    const o = state.orders.find(x => x.id === order.id);
    if (!o) { clearInterval(timer); return; }
    o.status = STATUS_ORDER[idx];
    saveOrders();
    if (state.view === 'tracking' && state.activeOrder && state.activeOrder.id === order.id) {
      state.activeOrder = o; render();
    }
  }, 2600);
}

/* ============ REALTIME (Supabase) ============ */
function subscribeToOrder(orderId) {
  if (!supabaseClient) return;
  if (orderChannel) { supabaseClient.removeChannel(orderChannel); orderChannel = null; }
  orderChannel = supabaseClient
    .channel('order_track_' + orderId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${orderId}` }, async payload => {
      const o = state.orders.find(x => x.id === orderId);
      if (!o) return;
      o.status = payload.new.status;
      o.riderId = payload.new.rider_id;
      o.selfRiderName = payload.new.self_rider_name; o.selfRiderPhone = payload.new.self_rider_phone;
      if (payload.new.is_self_delivery !== undefined) o.isSelfDelivery = payload.new.is_self_delivery;
      if (payload.new.rider_requested_at !== undefined) o.riderRequested = !!payload.new.rider_requested_at;
      if (payload.new.total != null) { o.total = Number(payload.new.total); o.subtotal = Number(payload.new.subtotal); }
      if (payload.new.cancel_reason) o.cancelReason = payload.new.cancel_reason;
      if (payload.new.payment_status !== undefined) {
        const before = o.paymentStatus;
        o.paymentStatus = payload.new.payment_status; o.paymentNote = payload.new.payment_note;
        if (before !== o.paymentStatus && o.paymentStatus === 'rejected') showToast('⚠️ ร้านแจ้งว่าสลิปไม่ถูกต้อง');
        if (before !== o.paymentStatus && o.paymentStatus === 'verified') showToast('✅ ร้านยืนยันว่าได้รับเงินแล้ว');
      }
      if (state.activeOrder && state.activeOrder.id === orderId) state.activeOrder = o;
      if (o.riderId && !o.riderInfo) await fetchRiderInfo(o);
      if (o.riderId) subscribeToRiderGps(o.riderId);
      if (state.view === 'tracking') render();
    })
    .subscribe();
  subscribeCallChannel(orderId);
  subscribeChatMessages(orderId);
  loadChatMessages(orderId);
}

    if (error) throw error;
    order.riderInfo = data;
  } catch (err) { console.warn('fetchRiderInfo failed', err); }
}
let lastEtaCheck = 0;
let etaMinutes = null;
async function computeOsrmEta(originLat, originLng, destLat, destLng) {
  const now = Date.now();
  if (now - lastEtaCheck < 15000) return; // จำกัดไม่ให้ยิง OSRM ถี่เกินไป
  lastEtaCheck = now;
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${originLng},${originLat};${destLng},${destLat}?overview=false`;
    const res = await fetch(url);
    const data = await res.json();
    if (data && data.routes && data.routes[0]) {
      etaMinutes = Math.max(1, Math.round(data.routes[0].duration / 60));
      const etaEl = document.getElementById('eta-text');
      if (etaEl) etaEl.textContent = `ประมาณ ${etaMinutes} นาที`;
    }
  } catch (err) { console.warn('OSRM ETA failed', err); }
}
function subscribeToRiderGps(riderId) {
  if (!supabaseClient || !riderId) return;
  if (gpsChannel) { supabaseClient.removeChannel(gpsChannel); gpsChannel = null; }
  gpsChannel = supabaseClient
    .channel('gps_track_' + riderId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gps_locations', filter: `rider_id=eq.${riderId}` }, payload => {
      const row = payload.new;
      if (!row || !liveMap) return;
      if (!riderMarker) riderMarker = L.marker([row.lat, row.lng], { icon: carIconRef }).addTo(liveMap);
      else riderMarker.setLatLng([row.lat, row.lng]);
      liveMap.panTo([row.lat, row.lng]);
      const o = state.activeOrder;
      if (o && o.dropoffLat && o.dropoffLng) computeOsrmEta(row.lat, row.lng, o.dropoffLat, o.dropoffLng);
    })
    .subscribe();
}

function promoTarget(b){
  if (!b) return null;
  if (b.restaurant_id && findRestaurant(b.restaurant_id)) return { type: 'shop', id: b.restaurant_id };
  if (b.link_url) {
    const m = String(b.link_url).match(/(?:[?#&]r=|restaurant[\/=])([0-9a-f-]{36})/i) || String(b.link_url).match(/^([0-9a-f-]{36})$/i);
    if (m && findRestaurant(m[1])) return { type: 'shop', id: m[1] };
  }
  const title = (b.title || '').replace(/\s+/g, '');
  if (title) {
    const hit = RESTAURANTS.slice().sort((x, y) => (y.nameTh||y.name).length - (x.nameTh||x.name).length).find(r => {
      const full = (r.nameTh || r.name).replace(/\s+/g, '');
      const short = (r.nameTh || r.name).split(/[-–—(]/)[0].replace(/\s+/g, '');
      return title.includes(full) || (short.length >= 3 && title.includes(short));
    });
    if (hit) return { type: 'shop', id: hit.id };
  }
  if (b.link_url) return { type: 'url', url: b.link_url };
  return null;
}

  if (r.isPreorder && !r.slideEnabled) {
    if (r.displayImage) return [r.displayImage];
    const m = menuPhotosOnSale(r);
    return m.length ? [m[0]] : (r.cover ? [r.cover] : []);
  }
  // แพ็กเกจ "สไลด์" (แอดมินเปิด ได้ทั้งร้านทั่วไปและร้านพรีออเดอร์) = รูปที่เลือกไว้ หรือรูปเมนูที่เปิดขาย · ไม่มีแพ็กเกจ = รูปหน้าปก 1 รูป
  if (r.slideEnabled) {
    if (r.slides.length) return r.slides;
    const m = menuPhotosOnSale(r);
    if (m.length) return r.cover ? [r.cover].concat(m) : m;

      🕖 ${day.pickup_enabled && day.delivery_enabled ? 'รับ/ส่ง' : day.pickup_enabled ? 'รับอาหาร' : 'ส่ง'} <b>${escHtml(day.time_from)} - ${escHtml(day.time_to)} น.</b><br>

      ${day.delivery_enabled ? `🛵 ร้านไปส่ง${(r.zones || []).length ? `: <span translate="no">${r.zones.map(z => `${escHtml(z.name)} ขั้นต่ำ ${Number(z.min) || 0}${Number(z.fee) ? ` +ค่าส่ง ${Number(z.fee)}` : ''}`).join(' · ')}</span>` : ''}<br>` : '🚫 ไม่มีบริการส่ง<br>'}
      ⏰ ปิดรับจอง <b>${cutoffText(day.cutoff_at)}</b>
      ${day.note ? `<div style="margin-top:4px;" translate="no">📝 ${escHtml(day.note)}</div>` : ''}

  }
  return `
  ${(r.isPreorder || r.slideEnabled) ? `<div class="pre-detail-head">${shopSlidesHtml(r, true)}<button class="back-btn" onclick="setView('${r.isPreorder ? 'preorder' : 'home'}')">←</button></div>` : `

  return `

      : `<b>🏠 มารับเองที่ร้าน</b><small translate="no">${r.pickupLocation ? escHtml(r.pickupLocation) : 'แม่ค้ากำหนดให้มารับที่ร้าน'}</small>`}</div>

    ${checkoutPre.ful ? `
    <div class="field-label">${isDel ? 'เวลาให้ไปส่ง' : 'เวลาที่จะมารับ'} <span style="color:#E5484D">*</span> <span style="font-weight:500;">(${escHtml(day.time_from)} - ${escHtml(day.time_to)} น.)</span></div>

// ใช้เบอร์/เลขบัตรประชาชน/เลข e-Wallet ที่ร้านลงทะเบียน (promptpay_id) สร้าง QR พร้อมยอดเงินผ่าน promptpay.io
// ถ้าร้านไม่ได้ใส่เลข แต่แนบรูป QR ไว้ (promptpay_qr_url) จะใช้รูปนั้นแทน
function promptpayQrSrc(pp, amount){
  if (!pp) return null;
  const id = String(pp.id || '').replace(/\D/g, '');
  if (id.length === 10 || id.length === 13 || id.length === 15) {
    return `https://promptpay.io/${id}/${Number(amount).toFixed(2)}.png`;
  }
  return pp.qr || null;
}
function getPromptpayInfo(restaurantId){
  if (promptpayCache[restaurantId]) return promptpayCache[restaurantId];
  const entry = { loading: true, qr: null, id: null, name: null };
  promptpayCache[restaurantId] = entry;
  if (dataSource !== 'supabase' || !supabaseClient) { entry.loading = false; return entry; }
  supabaseClient.from('restaurants').select('promptpay_qr_url,promptpay_id,promptpay_name').eq('id', restaurantId).maybeSingle()
    .then(({ data, error }) => {
      if (error) console.warn('โหลดข้อมูลพร้อมเพย์ไม่สำเร็จ (ตรวจคอลัมน์ promptpay_* ในตาราง restaurants):', error);
      if (data) { entry.qr = data.promptpay_qr_url || null; entry.id = data.promptpay_id || null; entry.name = data.promptpay_name || null; }
    })
    .catch(err => console.warn(err))
    .finally(() => { entry.loading = false; if (activeSheet === 'checkout') openSheet('checkout'); else if (state.view === 'tracking' && (entry.id || entry.qr)) render(); });
  return entry;
}
function onSlipSelected(input){
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('กรุณาเลือกไฟล์รูปภาพ'); return; }
  if (file.size > 8 * 1024 * 1024) { showToast('ไฟล์ใหญ่เกิน 8MB'); return; }
  const reader = new FileReader();
  reader.onload = () => { checkoutSlip = { file, preview: reader.result }; openSheet('checkout'); };
  reader.readAsDataURL(file);
}
// เก็บใน bucket ส่วนตัว payment-slips: <restaurant_id>/<customer_id>/<order_code>.<ext>
// คืนค่าเป็น path (ฝั่งร้านเปิดดูด้วย storage.from('payment-slips').createSignedUrl(path, 3600))
async function uploadPaymentSlip(restaurantId, orderCode){
  if (!checkoutSlip || !supabaseClient || !state.customerId) return null;
  const ext = ((checkoutSlip.file.name.split('.').pop() || 'jpg').toLowerCase()).replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `${restaurantId}/${state.customerId}/${orderCode}.${ext}`;
  const { error } = await supabaseClient.storage.from('payment-slips').upload(path, checkoutSlip.file, { upsert: false, contentType: checkoutSlip.file.type });
  if (error) throw error;
  return path;
}

/* ---------- สถานะการตรวจสลิป (ร้านเป็นคนเช็กว่าเงินเข้า) ---------- */
function payBoxHtml(o){
  if (o.payment !== 'promptpay' || o.status === 'cancelled') return '';
  if (o.paymentStatus === 'verified') return `<div class="pay-box verified">✅ ร้านยืนยันว่าได้รับเงินแล้ว</div>`;
  if (o.paymentStatus === 'rejected') {
    const pp = o.restaurantId ? getPromptpayInfo(o.restaurantId) : null;
    const qr = pp ? promptpayQrSrc(pp, o.total) : null;
    return `<div class="pay-box rejected">
      <b>⚠️ ร้านแจ้งว่าสลิปไม่ถูกต้อง</b>
      ${o.paymentNote ? `<div>เหตุผล: <span translate="no">${escHtml(o.paymentNote)}</span></div>` : ''}
      <div>กรุณาโอนใหม่ หรือแนบสลิปที่ถูกต้อง · ยอดที่ต้องโอน <b>${money(o.total)}</b></div>
      ${qr ? `<img class="pp-qr" src="${escHtml(qr)}" alt="QR พร้อมเพย์">${pp.name ? `<div style="text-align:center;font-size:12px;" translate="no">${escHtml(pp.name)}</div>` : ''}` : ''}
      <label class="slip-upload" id="reslip-btn"><input type="file" accept="image/*" style="display:none" onchange="resubmitSlip('${o.id}', this)">📎 แนบสลิปใหม่</label>
    </div>`;
  }
  return `<div class="pay-box pending">⏳ รอร้านตรวจสอบยอดเงินโอน</div>`;
}
async function resubmitSlip(orderId, input){
  const o = state.orders.find(x => x.id === orderId); const file = input.files && input.files[0];
  if (!o || !file) return;
  if (!file.type.startsWith('image/')) { showToast('กรุณาเลือกไฟล์รูปภาพ'); return; }
  if (file.size > 8 * 1024 * 1024) { showToast('ไฟล์ใหญ่เกิน 8MB'); return; }
  if (!supabaseClient || !state.customerId || !o.restaurantId) { showToast('ส่งสลิปไม่ได้ ลองใหม่อีกครั้ง'); return; }
  const btn = document.getElementById('reslip-btn'); if (btn) btn.textContent = 'กำลังส่งสลิป...';
  try {
    const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase()).replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${o.restaurantId}/${state.customerId}/${o.code || o.id}_${Date.now()}.${ext}`;
    const { error: upErr } = await supabaseClient.storage.from('payment-slips').upload(path, file, { upsert: false, contentType: file.type });
    if (upErr) throw upErr;
    const { error } = await supabaseClient.rpc('resubmit_payment_slip', { p_order_id: o.id, p_slip_path: path });
    if (error) throw error;
    o.paymentStatus = 'pending'; o.paymentNote = null;
    if (state.activeOrder && state.activeOrder.id === o.id) state.activeOrder = o;
    render(); showToast('ส่งสลิปใหม่แล้ว รอร้านตรวจสอบ');
  } catch (err) { console.error(err); showToast('ส่งสลิปไม่สำเร็จ: ' + ((err && err.message) || 'ลองใหม่อีกครั้ง')); render(); }
}

function initCheckoutMap(){
  const el = document.getElementById('checkout-map');
  if (!el || typeof L === 'undefined') { if (el) el.innerHTML = '<div style="padding:60px 10px;text-align:center;font-size:12px;color:var(--text-muted);">โหลดแผนที่ไม่สำเร็จ</div>'; return; }
  if (checkoutMap) { try { checkoutMap.remove(); } catch(e) {} checkoutMap = null; }
  const store = findRestaurant(state.cart.restaurantId);
  const hasStore = store && store.lat != null && store.lng != null;
  const center = checkoutGpsCoords ? [checkoutGpsCoords.lat, checkoutGpsCoords.lng] : (hasStore ? [store.lat, store.lng] : [13.7563, 100.5018]);
  checkoutMap = L.map(el).setView(center, checkoutGpsCoords ? 15 : 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(checkoutMap);
  checkoutMarker = null;
  drawStoreOnMap();
  if (checkoutGpsCoords) placeCheckoutMarker(checkoutGpsCoords.lat, checkoutGpsCoords.lng);
  updatePinStatus();
  checkoutMap.on('click', (e) => setCheckoutPin(e.latlng.lat, e.latlng.lng, true));
  setTimeout(() => { if (checkoutMap) checkoutMap.invalidateSize(); }, 120);
}
const MAX_DELIVERY_KM = 6;
function distanceKm(lat1, lng1, lat2, lng2){
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
// คืนค่า { km, ok } — ถ้าร้านยังไม่มีพิกัด จะคืน km = null (ตรวจระยะไม่ได้)
function checkoutDistanceInfo(){
  const r = findRestaurant(state.cart.restaurantId);
  if (!checkoutGpsCoords || !r || r.lat == null || r.lng == null) return { km: null, ok: true };
  const km = distanceKm(r.lat, r.lng, checkoutGpsCoords.lat, checkoutGpsCoords.lng);
  return { km, ok: km <= MAX_DELIVERY_KM };
}
function pinStatusText(){
  if (!checkoutGpsCoords) return 'ยังไม่ได้เลือกพิกัด — กรุณาปักหมุดจุดจัดส่ง';
  const base = `📍 พิกัดที่เลือก: ${checkoutGpsCoords.lat.toFixed(5)}, ${checkoutGpsCoords.lng.toFixed(5)}`;
  const d = checkoutDistanceInfo();
  if (d.km == null) return base;
  return d.ok
    ? `${base}<br><span style="color:var(--green);font-weight:700;">✅ ห่างจากร้าน ${d.km.toFixed(1)} กม. — อยู่ในเขตจัดส่ง</span>`
    : `${base}<br><span style="color:#E5484D;font-weight:700;">⛔ ห่างจากร้าน ${d.km.toFixed(1)} กม. — เกินเขตจัดส่ง (ไม่เกิน ${MAX_DELIVERY_KM} กม.)</span>`;
}
function updatePinStatus(extra){
  const label = document.getElementById('gps-status-label');
  if (label) label.innerHTML = pinStatusText() + (extra ? `<br>${extra}` : '');
  const btn = document.getElementById('place-order-btn');
  if (btn) btn.disabled = !checkoutDistanceInfo().ok;
}
function drawStoreOnMap(){
  const r = findRestaurant(state.cart.restaurantId);
  if (!checkoutMap || !r || r.lat == null || r.lng == null) return;
  L.circle([r.lat, r.lng], { radius: MAX_DELIVERY_KM * 1000, color: '#FF6B00', weight: 1.5, fillColor: '#FF6B00', fillOpacity: 0.06, interactive: false }).addTo(checkoutMap);
  L.marker([r.lat, r.lng], { interactive: false, icon: L.divIcon({ className: '', html: `<div style="font-size:22px;line-height:22px;">${r.emoji || '🏪'}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(checkoutMap);
}
function placeCheckoutMarker(lat, lng){
  if (!checkoutMap) return;
  if (!checkoutMarker) {
    checkoutMarker = L.marker([lat, lng], { draggable: true }).addTo(checkoutMap);
    checkoutMarker.on('dragend', () => { const p = checkoutMarker.getLatLng(); setCheckoutPin(p.lat, p.lng, true); });
  } else checkoutMarker.setLatLng([lat, lng]);
}
async function setCheckoutPin(lat, lng, fillAddress){
  checkoutGpsCoords = { lat, lng };
  placeCheckoutMarker(lat, lng);
  if (checkoutMap) checkoutMap.setView([lat, lng], Math.max(checkoutMap.getZoom(), 15));
  updatePinStatus();
  if (!fillAddress) return;
  if (!checkoutDistanceInfo().ok) { showToast(`⛔ ตำแหน่งนี้เกินเขตจัดส่ง ${MAX_DELIVERY_KM} กม. จากร้าน`); return; }
  updatePinStatus('กำลังค้นหาที่อยู่...');
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=th`);
    const data = await res.json();
    const addrInput = document.getElementById('addr-input');
    if (data && data.display_name && addrInput) { addrInput.value = data.display_name; checkoutForm.addr = data.display_name; }
    updatePinStatus('เติมที่อยู่ให้แล้ว ตรวจสอบบ้านเลขที่อีกครั้ง');
  } catch (err) {
    console.warn('reverse geocode failed', err);
    updatePinStatus();
  }
}

async function useGpsForAddress(){
  if (!('geolocation' in navigator)) { showToast('อุปกรณ์นี้ไม่รองรับ GPS'); return; }
  const label = document.getElementById('gps-status-label');
  if (label) label.textContent = '📡 กำลังค้นหาตำแหน่ง...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    await setCheckoutPin(pos.coords.latitude, pos.coords.longitude, true);
    if (checkoutDistanceInfo().ok) showToast('📍 ใช้ตำแหน่งปัจจุบันแล้ว');
  }, () => {
    if (label) label.textContent = '⚠️ ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาอนุญาตสิทธิ์ GPS';
    showToast('ไม่สามารถเข้าถึงตำแหน่งได้');
  }, { enableHighAccuracy: true, timeout: 8000 });
}
async function applyDiscountCode(){
  const input = document.getElementById('discount-input');
  const code = input ? input.value.trim() : '';
  const label = document.getElementById('discount-status-label');
  if (!code) { checkoutDiscount = { code: null, amount: 0 }; openSheet('checkout'); return; }
  if (dataSource !== 'supabase' || !supabaseClient) { showToast('ใช้โค้ดได้เฉพาะโหมดเชื่อมฐานข้อมูลจริง'); return; }
  const subtotal = cartSubtotal();
  try {
    const { data, error } = await supabaseClient.rpc('validate_promo_code', { p_code: code, p_subtotal: subtotal, p_restaurant: state.cart.restaurantId });
    if (error) throw error;
    const result = Array.isArray(data) ? data[0] : data;
    if (result && result.valid) {
      checkoutDiscount = { code: code.toUpperCase(), amount: Number(result.discount) };
      showToast('✅ ' + result.message);
    } else {
      checkoutDiscount = { code: null, amount: 0 };
      showToast('⚠️ ' + (result ? result.message : 'โค้ดไม่ถูกต้อง'));
    }
  } catch (err) {
    console.error(err); showToast('ตรวจสอบโค้ดไม่สำเร็จ');
  }
  openSheet('checkout');
}

function checkEnglishInput(el, kind){

async function callCustomerAuth(body){
  const { data, error } = await supabaseClient.functions.invoke('customer-auth', { body });
  if (error) {
    let payload = null;
    try { payload = error.context && typeof error.context.json === 'function' ? await error.context.json() : null; } catch(e) {}
    return { error: (payload && payload.error) || error.message || 'error' };
  }
  return data || {};
}
async function claimGuestBeforeLogin(){
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user.is_anonymous) {
      const { data: tok, error } = await supabaseClient.rpc('create_guest_claim');
      if (!error && tok) localStorage.setItem('imduan_guest_claim', tok);
    }
  } catch(e) {}
}
async function afterMemberLogin(user, msg){
  if (user) { state.customerId = user.id; state.isAnonymous = !!user.is_anonymous; state.email = user.email || ''; }
  try {
    const tok = localStorage.getItem('imduan_guest_claim');
    if (tok) { await supabaseClient.rpc('claim_guest_data', { p_token: tok }); localStorage.removeItem('imduan_guest_claim'); }
  } catch(e) {}
  try { await ensureCustomerRow(); } catch(e) { console.warn(e); }
  otpState = { step: 'start', email: '', mode: 'email', sending: false, verifying: false, cooldownUntil: 0 };
  showToast(msg);
  try { await refreshMyOrders(); } catch(e) {}
  render(); openSheet('profile');
}
async function doPasswordLogin(){
  saveOtpForm();
  const id = (otpState.loginId || '').trim();
  const pass = (document.getElementById('li-pass') || {}).value || '';
  if (!id || !pass) { showToast('กรุณากรอกไอดีและรหัสผ่าน'); return; }
  otpState.sending = true; openSheet('profile');
  try {
    await claimGuestBeforeLogin();
    let user = null;
    if (id.includes('@')) {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: id.toLowerCase(), password: pass });
      if (error) throw error;
      user = data.user;
    } else {
      if (/[^A-Za-z0-9_]/.test(id)) { throw new Error('bad'); }
      const res = await callCustomerAuth({ action: 'login', username: id, password: pass });
      if (!res.access_token) throw new Error(res.error || 'invalid_login');
      const { data, error } = await supabaseClient.auth.setSession({ access_token: res.access_token, refresh_token: res.refresh_token });
      if (error) throw error;
      user = data.user;
    }
    await afterMemberLogin(user, '✅ เข้าสู่ระบบสำเร็จ');
  } catch (err) {
    console.error(err);
    otpState.sending = false; openSheet('profile');
    showToast('ไอดีหรือรหัสผ่านไม่ถูกต้อง');
  }
}

function otpBack(){ saveOtpForm(); otpState.step = 'start'; openSheet('profile'); }
function startOtpCooldown(){
  otpState.cooldownUntil = Date.now() + 60000;
  clearInterval(otpTimer);
  otpTimer = setInterval(() => {
    const btn = document.getElementById('otp-resend-btn');
    const left = Math.max(0, Math.ceil((otpState.cooldownUntil - Date.now()) / 1000));
    if (btn) { btn.disabled = left > 0; btn.textContent = tr(left > 0 ? `ส่งใหม่ได้ใน ${left} วินาที` : 'ส่งรหัสใหม่'); }
    if (left <= 0) clearInterval(otpTimer);
  }, 1000);
}
async function sendEmailOtp(isResend){
  const input = document.getElementById('otp-email');
  const email = (isResend ? otpState.email : (input ? input.value : '')).trim().toLowerCase();
  if (!isResend && !otpState.loginOnly) {
    saveOtpForm();
    const user = (otpState.user || '').trim(), pass = otpState.pass || '';
    const name = (otpState.name || '').trim(), phone = (otpState.phone || '').replace(/\D/g, '');
    if (!user) { showToast('กรุณาสร้างไอดี'); return; }
    if (/[^A-Za-z0-9_]/.test(user)) { showToast('⚠️ ไอดีใช้ได้เฉพาะภาษาอังกฤษ a-z, 0-9 หรือ _ เท่านั้น'); return; }
    if (user.length < 4) { showToast('ไอดีต้องมี 4-20 ตัวอักษร'); return; }
    if (!pass) { showToast('กรุณาตั้งรหัสผ่าน'); return; }
    if (/[^\x21-\x7E]/.test(pass)) { showToast('⚠️ รหัสผ่านใช้ได้เฉพาะภาษาอังกฤษ ตัวเลข และสัญลักษณ์ (ห้ามเว้นวรรค)'); return; }
    if (pass.length < 6) { showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัว'); return; }
    if (!name) { showToast('กรุณากรอกชื่อ-นามสกุล'); return; }
    if (!/^0\d{8,9}$/.test(phone)) { showToast('กรุณากรอกเบอร์โทรให้ถูกต้อง (9-10 หลัก ขึ้นต้นด้วย 0)'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showToast('กรุณากรอกอีเมลให้ถูกต้อง'); return; }
    try {
      const chk = await callCustomerAuth({ action: 'check', username: user });
      if (chk && chk.available === false) { showToast('ไอดีนี้มีคนใช้แล้ว ลองไอดีอื่น'); return; }
    } catch(e) { console.warn('username check failed', e); }
    checkoutForm.name = name; checkoutForm.phone = phone; saveProfileLocal();
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showToast('กรุณากรอกอีเมลให้ถูกต้อง'); return; }
  otpState.email = email; otpState.sending = true; openSheet('profile');
  try {
    // เก็บ "ตั๋ว" ของบัญชีชั่วคราวไว้ก่อน เพื่อย้ายประวัติการสั่งซื้อเดิมไปบัญชีสมาชิกหลังยืนยัน OTP
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user.is_anonymous && !isResend) {
      try {
        const { data: tok, error: tokErr } = await supabaseClient.rpc('create_guest_claim');
        if (!tokErr && tok) { try { localStorage.setItem('imduan_guest_claim', tok); } catch(e) {} }
      } catch(e) { console.warn('create_guest_claim unavailable', e); }
    }
    const { error } = await supabaseClient.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
    if (error) throw error;
    const mode = 'email';
    otpState.mode = mode; otpState.step = 'code';
    showToast('ส่งอีเมลแล้ว กรอกรหัส หรือกดลิงก์ในอีเมลก็ได้');
    startOtpCooldown();
  } catch (err) {
    console.error(err);
    showToast('ส่งรหัสไม่สำเร็จ: ' + (err.message || ''));
  }
  otpState.sending = false; openSheet('profile');
  setTimeout(() => { const c = document.getElementById('otp-code'); if (c) c.focus(); }, 80);
}
async function verifyEmailOtp(){
  const input = document.getElementById('otp-code');
  const token = input ? input.value.trim() : '';
  if (token.length < 6 || otpState.verifying) return;
  otpState.verifying = true;
  const btn = document.getElementById('otp-verify-btn'); if (btn) { btn.disabled = true; btn.textContent = tr('กำลังตรวจสอบ...'); }
  try {
    const { data, error } = await supabaseClient.auth.verifyOtp({ email: otpState.email, token, type: otpState.mode });
    if (error) throw error;
    const user = data.user || (data.session && data.session.user);
    if (user) { state.customerId = user.id; state.isAnonymous = !!user.is_anonymous; state.email = user.email || otpState.email; }
    try {
      const tok = localStorage.getItem('imduan_guest_claim');
      if (tok) { await supabaseClient.rpc('claim_guest_data', { p_token: tok }); localStorage.removeItem('imduan_guest_claim'); }
    } catch(e) { console.warn('claim_guest_data unavailable', e); }
    try { await ensureCustomerRow(); } catch(e) { console.warn(e); }
    try { await persistCustomerDetails(); } catch(e) { console.warn(e); }
    const wasSignup = !otpState.loginOnly;
    if (wasSignup && otpState.pass) {
      const uname = (otpState.user || '').trim().toLowerCase();
      const { error: pwErr } = await supabaseClient.auth.updateUser({ password: otpState.pass, data: { username: uname, full_name: checkoutForm.name, phone: checkoutForm.phone } });
      if (pwErr) { console.error(pwErr); showToast('ตั้งรหัสผ่านไม่สำเร็จ: ' + (pwErr.message || '')); }
      const { error: unErr } = await supabaseClient.from('customers').update({ username: uname, name: checkoutForm.name, phone: checkoutForm.phone }).eq('id', state.customerId);
      if (unErr) { console.error(unErr); if (/duplicate|unique/i.test(unErr.message || '')) showToast('ไอดีนี้มีคนใช้แล้ว กรุณาติดต่อร้านเพื่อเปลี่ยนไอดี'); }
    }
    otpState.pass = '';
    otpState = { step: 'start', email: '', mode: 'email', sending: false, verifying: false, cooldownUntil: 0 };
    showToast(wasSignup ? '✅ สมัครสมาชิกสำเร็จ' : '✅ เข้าสู่ระบบสำเร็จ');
    render();
    try { await refreshMyOrders(); } catch(e) {}
    openSheet('profile');
  } catch (err) {
    console.error(err);
    otpState.verifying = false;
    showToast('รหัสไม่ถูกต้องหรือหมดอายุ');
    openSheet('profile');
  }
}
async function persistCustomerDetails(){
  saveProfileLocal();
  if (dataSource !== 'supabase' || !supabaseClient || !state.customerId) return;
  const patch = { address: checkoutForm.addr || null };
  if (checkoutForm.name) patch.name = checkoutForm.name;
  if (checkoutForm.phone) patch.phone = checkoutForm.phone;
  const { error } = await supabaseClient.from('customers').update(patch).eq('id', state.customerId);
  if (error) throw error;
}
async function saveProfileDetails(){
  const g = id => (document.getElementById(id) || {}).value || '';
  const name = g('pf-name').trim(), phone = g('pf-phone').replace(/\D/g, ''), addr = g('pf-addr').trim();
  if (phone && !/^0\d{8,9}$/.test(phone)) { showToast('กรุณากรอกเบอร์โทรให้ถูกต้อง (9-10 หลัก ขึ้นต้นด้วย 0)'); return; }
  checkoutForm.name = name; checkoutForm.phone = phone; checkoutForm.addr = addr;
  try { await persistCustomerDetails(); showToast('✅ บันทึกข้อมูลแล้ว'); render(); }
  catch (e) { console.error(e); showToast('บันทึกไม่สำเร็จ'); }
}

        ${o.fulfillment === 'delivery' && o.selfRiderPhone ? `<a class="call-shop" href="${callTel(o.selfRiderPhone)}">📞 โทรหาไรเดอร์</a>` : ''}
        ${o.restaurantPhone ? `<a class="call-shop" href="${callTel(o.restaurantPhone)}">📞 โทรหาร้าน</a>` : ''}
        ${o.fulfillment === 'pickup' && o.restaurantLat && o.restaurantLng ? `<a class="call-shop nav" href="https://www.google.com/maps/dir/?api=1&destination=${o.restaurantLat},${o.restaurantLng}" target="_blank" rel="noopener">🧭 นำทางไปร้าน</a>` : ''}
      </div>` : ''}
      ${payBoxHtml(o)}
      <div class="progress-bar"><div class="progress-fill" style="width:${info.pct}%"></div></div>

      <div class="stage-row">
        ${TRACK_STAGES.map((label,i) => `
          <div class="stage-item ${info.stage>i?'done':(info.stage===i?'active':'')}">
            <div class="stage-dot">${info.stage>i?'✓':STAGE_ICONS[i]}</div>
            <div class="stage-label">${label}</div>
          </div>`).join('')}
      </div>

      ${(o.status==='picked_up') ? `<div class="eta-badge">⏱️ <span id="eta-text">${etaMinutes ? 'ประมาณ '+etaMinutes+' นาที' : 'กำลังคำนวณเวลา...'}</span></div>` : ''}
      <div class="order-id">เลขคำสั่งซื้อ #${o.code || o.id}${o.isSelfDelivery ? ' · จัดส่งโดยร้านค้าเอง' : ''}</div>
      ${o.status === 'pending' && !o.riderId && !o.isPreorder ? `<button class="cancel-order-btn" onclick="cancelMyOrder('${o.id}')">ยกเลิกออเดอร์</button>
      ${o.isPreorder ? '' : `<div class="map-hint" style="text-align:center;padding:6px 0 0;">ถ้าไม่มีใครรับภายใน 10 นาที ระบบจะยกเลิกให้อัตโนมัติ</div>`}` : ''}
    </div>
    ${o.isPreorder && o.fulfillment === 'pickup' ? '' : '<div id="live-tracking-map"></div>'}

    ${(!o.isSelfDelivery && (o.status==='preparing' || o.status==='ready' || o.status==='picked_up') || o.isSelfDelivery && (o.status==='ready' || o.status==='picked_up')) ? `
    <div class="driver-card">
      <div class="driver-avatar">${o.isSelfDelivery ? '🏪' : '🏍️'}</div>
      <div>
        <div class="driver-name">${o.riderInfo ? o.riderInfo.name : (o.isSelfDelivery ? o.restaurantName : 'กำลังมอบหมายไรเดอร์...')}</div>
        <div class="driver-meta">${o.riderInfo ? `ทะเบียน ${o.riderInfo.plate||'-'} • คะแนน ${o.riderInfo.rating||'-'} ★` : (o.isSelfDelivery ? 'ทีมจัดส่งของร้าน' : '')}</div>
      </div>
      ${!o.isSelfDelivery && o.riderId ? `
      <div class="driver-actions">
        <button class="driver-btn call" onclick="startCall()"><i>📞</i></button>
        <button class="driver-btn chat" onclick="openChat()"><i>💬</i></button>
      </div>` : ''}
    </div>` : ''}

    <div class="section-title" style="padding:0;margin-top:16px;"><h2>สรุปคำสั่งซื้อ</h2></div>
    <div class="order-card" style="margin-top:8px">
      <div class="order-card-top"><span style="font-weight:700" translate="no">${o.restaurantEmoji} ${o.restaurantName}</span></div>
      <div class="order-card-items">${o.items.map(orderItemLineText).join(', ')}</div>
      <div class="order-card-bottom"><span>${o.isPreorder && o.fulfillment === 'pickup' ? '🏠 รับเองที่ร้าน' : `ส่งไปที่ <span translate="no">${o.address}</span>`}</span></div>
      ${o.discountAmount>0 ? `<div class="order-card-bottom"><span style="color:var(--primary)">ส่วนลด (${o.discountCode})</span><span style="color:var(--primary)">-${money(o.discountAmount)}</span></div>` : ''}
      <div class="order-card-bottom"><b>รวม ${money(o.total)}</b></div>
    </div>
    <button class="btn-secondary" onclick="setView('home')">กลับหน้าแรก สั่งเพิ่ม</button>
  </div>
  ${bottomNav()}
  `;
}
function initLiveTrackingMap(o) {
  const mapContainer = document.getElementById('live-tracking-map');
  if (!mapContainer || typeof L === 'undefined') return;
  if (liveMap) { liveMap.remove(); liveMap = null; riderMarker = null; }
  liveMap = L.map('live-tracking-map').setView([13.7563, 100.5018], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(liveMap);
  carIconRef = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3097/3097180.png', iconSize: [38,38], iconAnchor: [19,19] });
  if (o && o.dropoffLat && o.dropoffLng) {
    L.marker([o.dropoffLat, o.dropoffLng]).addTo(liveMap).bindPopup('จุดส่งของคุณ');
    liveMap.setView([o.dropoffLat, o.dropoffLng], 14);
  }
  if (o && o.riderId) subscribeToRiderGps(o.riderId);
}

/* ============ RENDER: ORDERS HISTORY ============ */
function renderOrders() {
  return `
  ${topbar()}
  <div class="section-title"><h2>ประวัติคำสั่งซื้อ</h2></div>
  ${state.orders.length === 0 ? `
    <div class="empty-state"><div class="e">🧾</div><h3>ยังไม่มีคำสั่งซื้อ</h3><p>เมื่อคุณสั่งอาหาร ประวัติจะแสดงที่นี่</p></div>
  ` : `
  <div class="orders-list">
    ${state.orders.map(o => {
      const statusMap = statusMapFor(o);
      const info = statusMap[o.status] || statusMap.pending;
      const done = o.status === 'delivered' || o.status === 'cancelled';
      return `
      <div class="order-card" onclick="openOrderTracking('${o.id}')">
        <div class="order-card-top">
          <span style="font-weight:700" translate="no">${o.restaurantEmoji} ${o.restaurantName}</span>
          <span><span class="order-status-tag ${done?'':'pending'}">${info.label}</span>${o.payment === 'promptpay' && o.paymentStatus === 'rejected' && o.status !== 'cancelled' ? '<span class="order-status-tag payfix">แก้สลิป</span>' : ''}</span>
        </div>
        ${o.isPreorder && o.scheduledDate ? `<div class="pre-when" style="margin:4px 0 2px;">${o.fulfillment === 'pickup' ? '🏠 รับที่ร้าน' : '🛵 ส่ง'} ${preorderDayText(o.scheduledDate)}${o.scheduledSlot ? ' · <span translate="no">' + escHtml(o.scheduledSlot) + ' น.</span>' : ''}</div>` : ''}
        <div class="order-card-items">${o.items.map(orderItemLineText).join(', ')}</div>
        <div class="order-card-bottom"><span style="color:var(--text-muted)">${o.date}</span><b>${money(o.total)}</b></div>
      </div>`;
    }).join('')}
  </div>
  `}
  <div style="height:100px"></div>
  ${bottomNav()}
  `;
}

/* ============ MAIN RENDER ============ */
function refreshOverlay(){
  let overlayEl = document.getElementById('overlay-root');
  let savedScroll = 0;
  if (overlayEl) {
    const sheetEl = overlayEl.querySelector('.sheet');
    if (sheetEl) savedScroll = sheetEl.scrollTop;
    captureCheckoutForm();
    if (checkoutMap) { try { checkoutMap.remove(); } catch(e) {} checkoutMap = null; checkoutMarker = null; }
    overlayEl.remove();
  }
  if (activeSheet) {
    const div = document.createElement('div');
    div.id = 'overlay-root'; div.className = 'overlay';
    div.onclick = (e) => { if (e.target === div) closeSheet(); };
    div.innerHTML = activeSheet === 'cart' ? cartSheetHtml() : (activeSheet === 'profile' ? profileSheetHtml() : (activeSheet === 'item-options' ? itemOptionsSheetHtml() : (activeSheet === 'request' ? requestSheetHtml() : checkoutSheetHtml())));
    document.body.appendChild(div);
    const newSheetEl = div.querySelector('.sheet');
    if (newSheetEl) {
      newSheetEl.scrollTop = savedScroll;
      requestAnimationFrame(() => { newSheetEl.scrollTop = savedScroll; });
    }
    if (activeSheet === 'checkout') setTimeout(initCheckoutMap, 30);
  }
}
function render() {
  const app = document.getElementById('app');
  if (state.loading) { app.innerHTML = `<div class="empty-state"><div class="e">⏳</div><h3>กำลังโหลดร้านอาหาร...</h3></div>`; return; }
  // ถ้ามี sheet เปิดอยู่ (เช่นตะกร้า) การรีเฟรชหน้าหลักข้างหลัง sheet ไม่ควรทำให้หน้าเลื่อนกลับขึ้นบนสุด
  const preserveScroll = !!activeSheet;
  const savedWindowScroll = preserveScroll ? window.scrollY : 0;
  let html = '';
  if (state.view === 'home') html = renderHome();
  if (state.view === 'detail') html = renderDetail();
  if (state.view === 'tracking') html = renderTracking();
  if (state.view === 'orders') html = renderOrders();
  if (state.view === 'preorder') html = renderPreorder();

  let fab = '';
  if ((state.view === 'home' || state.view === 'detail' || state.view === 'preorder') && cartCount() > 0 && !activeSheet) {
    const r = findRestaurant(state.cart.restaurantId);
    fab = `<button class="cart-fab" onclick="openCartSheet()">
      <span>🛒 ${cartCount()} รายการ · <span translate="no">${r ? r.name : ''}</span></span>
      <span>${money(cartSubtotal())} ›</span>
    </button>`;
  }
  let nav = (state.view === 'home' || state.view === 'detail' || state.view === 'preorder') ? bottomNav() : '';
  if (state.view === 'detail') nav = '';

  app.innerHTML = html + fab + nav;
  if (preserveScroll) window.scrollTo(0, savedWindowScroll);

  refreshOverlay();

  let chatEl = document.getElementById('chat-root');
  if (chatEl) chatEl.remove();
  if (chatOpen) {
    const div = document.createElement('div');
    div.id = 'chat-root';
    div.innerHTML = chatDrawerHtml();
    document.body.appendChild(div);
    scrollChatToBottom();
  }

  let callEl = document.getElementById('call-root');
  if (callEl) callEl.remove();
  if (callOpen) {
    const div = document.createElement('div');
    div.id = 'call-root';
    div.innerHTML = callModalHtml();
    document.body.appendChild(div);
  }
}

/* ============ INIT ============ */
startI18n();
init();
</script>
</body>
</html>
